{t:'A4',a:'C',q:'Before performing a wheel alignment, the technician should:',o:['Set tire pressures, check ride height and inspect for worn parts','Rotate the tires','Replace all tie rods','Align the headlights'],c:0,w:'Worn parts and wrong ride height make alignment readings meaningless.'},
{t:'A4',a:'C',q:'What does positive caster provide?',o:['Straight-line stability and steering returnability','Tire wear on the inside edge','Turning radius','Bump steer'],c:0,w:'Positive caster places the steering axis ahead of the contact patch, like a shopping cart wheel, so the wheels want to track straight.'},
{t:'A4',a:'C',q:'Total toe is:',o:['The sum of the left and right individual toe readings','The difference between front and rear camber','The same as thrust angle','Caster plus camber'],c:0,w:'Total toe adds both sides. Set individual toe equally to center the steering wheel.'},
{t:'A4',a:'D',q:'Which tire pressure should be used for setting cold inflation?',o:['The max pressure on the tire sidewall','The vehicle placard (door jamb) specification','Whatever feels right','Always 35 psi'],c:1,w:'The sidewall number is the tire\'s maximum. The placard is what the vehicle was designed for.'},
{t:'A4',a:'D',q:'A tire is worn mostly in the center of the tread. What is the most likely cause?',o:['Overinflation','Underinflation','Negative camber','Toe-out'],c:0,w:'Too much pressure bulges the center. Underinflation wears both shoulders.'},
{t:'A4',a:'D',q:'How should lug nuts be tightened?',o:['With an impact gun as tight as possible','To specified torque in a star (crisscross) pattern','In a circle pattern by hand only','Without regard to sequence'],c:1,w:'Even clamping prevents rotor and drum distortion and wheel damage.'},
{t:'A4',a:'D',q:'Static imbalance in a wheel and tire most commonly causes:',o:['Wheel tramp (vertical hop)','Side-to-side shimmy','Pull to one side','Toe wear'],c:0,w:'A heavy spot makes the wheel hop up and down. Dynamic imbalance causes side-to-side shimmy.'},

/* ===================== A5 BRAKES ===================== */
{t:'A5',a:'A',q:'Why should DOT 3 and DOT 4 brake fluid be replaced periodically?',o:['They absorb moisture, which lowers their boiling point and causes corrosion','They evaporate','They turn into DOT 5','They lose color only'],c:0,w:'Glycol-based fluids are hygroscopic. Water lowers the boiling point and corrodes components.'},
{t:'A5',a:'A',q:'DOT 5 silicone brake fluid:',o:['Can be mixed freely with DOT 3','Should not be mixed with DOT 3 or DOT 4','Is used in most ABS systems','Absorbs water like DOT 3'],c:1,w:'DOT 5 is silicone-based and doesn\'t mix with glycol fluids. Mixing causes separation and problems. (DOT 5.1 is glycol-based.)'},
{t:'A5',a:'A',q:'A low brake pedal pumps up higher on a vehicle with rear drum brakes. What is the most likely cause?',o:['Rear drum brakes out of adjustment','Failed booster','Seized caliper','ABS fault'],c:0,w:'Excessive shoe-to-drum clearance takes up pedal travel. Pumping moves the shoes out. Air in the system is another possibility.'},
{t:'A5',a:'A',q:'In a disc/drum system, what does the metering valve do?',o:['Delays front disc application until the rear shoes overcome their return springs','Reduces rear pressure during hard stops','Turns on the warning light','Bleeds the system'],c:0,w:'This balances the brakes on light stops so the front discs don\'t apply first.'},
{t:'A5',a:'A',q:'What does the proportioning valve do?',o:['Limits rear brake pressure during hard stops to prevent rear wheel lockup','Delays front brakes','Holds residual pressure','Activates ABS'],c:0,w:'Weight shifts forward during hard braking, so rear pressure must be limited.'},
{t:'A5',a:'A',q:'The red brake warning light comes on when one hydraulic circuit loses pressure. Which component triggers it?',o:['Pressure differential switch','Metering valve','Wheel speed sensor','Booster check valve'],c:0,w:'The switch\'s piston shifts toward the low-pressure side and closes the warning contact. (Many vehicles also use a fluid level switch.)'},
{t:'A5',a:'A',q:'All four brakes drag after the vehicle warms up. Pedal height is normal. What is the most likely cause?',o:['A master cylinder pushrod too long, so the compensating ports are blocked','One seized caliper','Worn pads','Low fluid'],c:0,w:'Fluid can\'t return to the reservoir, so heat expansion builds pressure and applies all the brakes.'},
{t:'A5',a:'A',q:'Before installing a new master cylinder, the technician should:',o:['Bench bleed it','Fill the reservoir only','Lubricate the bore with grease','Apply thread locker to the lines'],c:0,w:'Bench bleeding removes air from the bores, so system bleeding is much easier.'},
{t:'A5',a:'A',q:'One front caliper stays applied after the pedal is released. Opening its bleeder releases it. What is the most likely cause?',o:['Collapsed brake hose acting as a check valve','Worn pads','Low fluid','Bad booster'],c:0,w:'A hose that has collapsed inside lets pressure in but not out.'},
{t:'A5',a:'A',q:'On a Hydro-boost system, where does the brake assist come from?',o:['Engine vacuum','Power steering pump pressure','An electric pump only','The ABS module'],c:1,w:'Hydro-boost uses power steering fluid pressure. An accumulator gives reserve assists if the pump stops.'},
{t:'A5',a:'A',q:'The parking brake lever travels too far before holding. What is the most likely cause?',o:['A stretched cable or rear brakes out of adjustment','Low brake fluid','Worn front pads','Failed ABS'],c:0,w:'Adjust the rear brakes first, then the cable, following service info.'},
{t:'A5',a:'A',q:'The red brake warning light is on with the parking brake fully released. What should be checked first?',o:['Brake fluid level','ABS wheel sensors','Tire pressure','Headlights'],c:0,w:'Low fluid (often from pad wear or a leak) is the most common cause of a red brake light.'},
{t:'A5',a:'B',q:'A brake drum measures larger than the maximum diameter stamped on it. What should be done?',o:['Machine it','Replace it','Reuse it','Install oversize shoes'],c:1,w:'Beyond the maximum diameter the drum is too thin to handle heat and stress safely.'},
{t:'A5',a:'B',q:'One rear drum brake grabs. Its linings are soaked with fluid. What is the most likely source?',o:['A leaking wheel cylinder or axle seal','A bad master cylinder','A worn proportioning valve','A bad ABS sensor'],c:0,w:'Contaminated linings grab. Fix the leak and replace the shoes (in axle sets).'},
{t:'A5',a:'B',q:'On a duo-servo drum brake, the primary shoe usually:',o:['Faces the front of the vehicle and has the shorter lining','Faces the rear and has the longer lining','Is identical to the secondary shoe','Has no lining'],c:0,w:'The secondary (rear) shoe does more of the work and has the longer lining.'},
{t:'A5',a:'B',q:'Brake fluid is found behind a rear drum on the backing plate. What should be inspected?',o:['The wheel cylinder for leaks','The master cylinder only','The caliper','The booster'],c:0,w:'Pull back the wheel cylinder boots and look for fluid.'},
{t:'A5',a:'C',q:'Which repair commonly reduces disc brake squeal?',o:['Installing anti-noise shims and lubricating pad contact points','Adding more brake fluid','Increasing tire pressure','Replacing the master cylinder'],c:0,w:'Squeal is high-frequency vibration. Shims and proper lubrication dampen it.'},
{t:'A5',a:'C',q:'The inner pad is worn much more than the outer pad on a floating caliper. What is the most likely cause?',o:['Seized or sticking caliper slides','Normal wear','Wrong pads','Air in the system'],c:0,w:'The caliper has to slide to apply the outer pad. If the slides stick, the inner pad does most of the work.'},
{t:'A5',a:'C',q:'After installing new pads and rotors, the technician should:',o:['Burnish (bed in) the brakes per the pad manufacturer','Drive hard to heat them up immediately','Skip any procedure','Pump the brakes 100 times while parked'],c:0,w:'Burnishing transfers a layer of pad material to the rotor for smooth, quiet stops.'},
{t:'A5',a:'C',q:'Rotor thickness variation (parallelism) is measured with:',o:['A micrometer at several points around the rotor','A dial indicator only','A feeler gauge','A straightedge'],c:0,w:'Thickness variation of just thousandths of an inch can cause pulsation.'},
{t:'A5',a:'C',q:'How is the piston retracted on a rear caliper with an integral parking brake?',o:['Push it straight in with a C-clamp','Rotate it in with a special tool (or use the scan tool for electronic parking brakes)','Remove it and reinstall','Pry it with a screwdriver'],c:1,w:'The piston threads onto the parking brake mechanism. Forcing it straight in damages the caliper. Electronic parking brakes need a service mode.'},
{t:'A5',a:'C',q:'Why open the bleeder screw when pushing a caliper piston back?',o:['To keep old, contaminated fluid from being pushed back into the ABS unit and master cylinder','It makes the piston go back faster','It\'s not recommended','To add fluid'],c:0,w:'Pushing dirty fluid backward can damage the ABS valves and master cylinder seals.'},
{t:'A5',a:'C',q:'Wheel nuts tightened unevenly with an impact wrench can cause:',o:['Rotor distortion and pedal pulsation','Brake fade only','ABS failure','Low fluid'],c:0,w:'Uneven clamping can distort the rotor and hub flange. Torque to spec in a star pattern.'},
{t:'A5',a:'D',q:'What is the difference between passive (magnetic) and active wheel speed sensors?',o:['Passive sensors make an AC signal; active sensors need power and output a digital square wave','Both make AC signals','Active sensors need no power','Passive sensors work at zero speed'],c:0,w:'Active sensors (Hall-effect or magnetoresistive) can read very low speeds and need a power supply from the module.'},
{t:'A5',a:'D',q:'Why may some ABS systems require a scan tool when bleeding the brakes?',o:['To cycle the hydraulic unit\'s valves and pump to purge trapped air','To reset tire pressure','To program the keys','It\'s never needed'],c:0,w:'Air trapped in the hydraulic control unit may only come out with an automated bleed procedure.'},
{t:'A5',a:'D',q:'The amber ABS light is on but the red brake light is off. What is the condition?',o:['ABS is disabled but normal base brakes still work','No brakes at all','Low brake fluid','Parking brake applied'],c:0,w:'An ABS fault turns off anti-lock function. The base hydraulic brakes still work.'},
{t:'A5',a:'D',q:'Traction control (TCS) limits wheel spin by:',o:['Applying brake pressure to the spinning wheel and/or reducing engine torque','Lowering tire pressure','Shifting to 4WD','Locking the differential manually'],c:0,w:'The ABS module brakes the spinning wheel, and the PCM may cut torque.'},
{t:'A5',a:'D',q:'A customer complains of pedal pulsation and noise during a hard stop on gravel. The ABS light is off. What should be done?',o:['Explain that this is normal ABS operation','Replace the rotors','Replace the ABS module','Bleed the brakes'],c:0,w:'ABS cycles pressure rapidly, which causes pulsation and noise. That\'s normal during activation.'},
{t:'A5',a:'D',q:'What is the best way to check a wheel speed sensor signal?',o:['Scope or AC voltmeter while spinning the wheel, or scan tool wheel speed data','Ohmmeter while driving','Test light','Visual inspection only'],c:0,w:'A scope shows signal quality: dropouts, a weak signal or a damaged tone ring.'},
{t:'A5',a:'D',q:'Which sensor tells the ESC system how fast the vehicle is rotating around its vertical axis?',o:['Yaw rate sensor','Wheel speed sensor','Brake pressure sensor','Throttle position sensor'],c:0,w:'ESC compares the yaw rate with steering angle and wheel speeds to detect skids.'},

/* ===================== A6 ELECTRICAL ===================== */
{t:'A6',a:'A',q:'Three 4 Ω resistors are connected in series to a 12 V source. What is the current?',o:['1 A','3 A','4 A','12 A'],c:0,w:'Series resistance adds: 12 Ω total. I = 12 ÷ 12 = 1 A.'},
{t:'A6',a:'A',q:'Two 6 Ω resistors are connected in parallel. What is the total resistance?',o:['12 Ω','6 Ω','3 Ω','1.5 Ω'],c:2,w:'Equal resistors in parallel: R ÷ number of branches = 6 ÷ 2 = 3 Ω.'},
{t:'A6',a:'A',q:'A 12 V circuit draws 5 A. How much power does it use?',o:['2.4 W','17 W','60 W','120 W'],c:2,w:'P = E × I = 12 × 5 = 60 W.'},
{t:'A6',a:'A',q:'Technician A uses a fused jumper wire to bypass a switch for testing. Technician B uses a jumper wire to bypass a load such as a motor. Who is correct?',o:[TA,TB,BOTH,NEI],c:0,w:'Bypassing a switch is a valid test. Bypassing a load creates a direct short.'},
{t:'A6',a:'A',q:'Why should a conventional test light not be used on computer sensor circuits?',o:['It can draw enough current to damage sensitive circuits; use a high-impedance DMM','It shows voltage too accurately','It doesn\'t light on 5 V','It is illegal'],c:0,w:'Incandescent test lights draw current that low-current electronic circuits can\'t handle.'},
{t:'A6',a:'A',q:'A fuse blows as soon as it is replaced. What is the best way to find the short to ground?',o:['Keep replacing fuses','Use a short finder or a cycling circuit breaker in place of the fuse and trace the circuit','Install a larger fuse','Disconnect the battery and wait'],c:1,w:'A cycling breaker or short tester keeps the circuit powered safely while you trace the short.'},
{t:'A6',a:'A',q:'A closed switch shows a 2.1 V voltage drop with the circuit operating. What does this indicate?',o:['Normal','Excessive resistance in the switch contacts','An open circuit','A short to ground'],c:1,w:'A good closed switch drops nearly zero volts. A large drop means burnt or dirty contacts.'},
{t:'A6',a:'A',q:'A DMM in diode test mode reads about 0.6 V in one direction and OL in the other across a diode. What does this indicate?',o:['Good diode','Shorted diode','Open diode','Leaking diode'],c:0,w:'A silicon diode conducts one way (about 0.5–0.7 V drop) and blocks the other.'},
{t:'A6',a:'A',q:'What is the purpose of a diode or resistor across a relay coil?',o:['To suppress the voltage spike when the coil turns off','To increase relay speed','To act as a fuse','To raise coil voltage'],c:0,w:'A collapsing magnetic field creates a high-voltage spike that can damage the switching module.'},
{t:'A6',a:'B',q:'A battery has an open-circuit voltage of 12.2 V after the surface charge is removed. About what is its state of charge?',o:['100%','75%','50%','25%'],c:2,w:'Roughly: 12.6 V = 100%, 12.4 V = 75%, 12.2 V = 50%, 12.0 V = 25%.'},
{t:'A6',a:'B',q:'When charging an AGM battery, the technician should:',o:['Use any high-rate charger','Use a charger with an AGM setting and follow the manufacturer\'s voltage limits','Remove the caps first','Charge at 16 V'],c:1,w:'AGM batteries can be damaged by overvoltage. Use the correct charger mode.'},
{t:'A6',a:'B',q:'When jump-starting, where should the final cable connection be made?',o:['The dead battery\'s negative post','A good engine ground away from the battery','The positive post','The alternator'],c:1,w:'This keeps any spark away from hydrogen gas around the battery.'},
{t:'A6',a:'B',q:'The starter solenoid clicks but the engine doesn\'t crank. The battery is fully charged. What should be done next?',o:['Replace the starter','Perform voltage drop tests on the starter cables and solenoid contacts','Replace the battery','Check the alternator'],c:1,w:'Find the high resistance first: cables, connections or burnt solenoid contacts.'},
{t:'A6',a:'B',q:'The starter motor spins rapidly but doesn\'t turn the engine. What is the most likely cause?',o:['A failed starter drive (overrunning clutch)','A weak battery','A bad ignition switch','A seized engine'],c:0,w:'The motor runs, but the drive isn\'t engaging or isn\'t transmitting torque to the flywheel.'},
{t:'A6',a:'B',q:'A grinding noise is heard during cranking. What should be inspected?',o:['The flywheel ring gear and starter pinion teeth','The alternator bearings','The water pump','The serpentine belt'],c:0,w:'Damaged teeth or a loose or misaligned starter cause grinding during engagement.'},
{t:'A6',a:'B',q:'A manual transmission vehicle cranks without the clutch pedal being pressed. What is the most likely cause?',o:['A shorted or bypassed clutch pedal position switch','A bad starter','A weak battery','A bad neutral safety switch on the automatic'],c:0,w:'The clutch switch should prevent cranking unless the pedal is down. That is a safety failure.'},
{t:'A6',a:'C',q:'During an alternator output test, the alternator produces 60 A on a 120 A rating. What does this indicate?',o:['Normal','Low output: faulty alternator, slipping belt or wiring problem','Overcharging','A good diode'],c:1,w:'Output should be near the rating (usually within about 10%). Check the belt and wiring before condemning the alternator.'},
{t:'A6',a:'C',q:'With the engine running, the voltage drop between the alternator B+ terminal and the battery positive post is 0.9 V. What does this indicate?',o:['Normal','Excessive resistance in the charge wire or connections','Bad diode','Overcharging'],c:1,w:'Many specs allow about 0.2 V on the positive side and 0.5 V total for both sides combined. 0.9 V means high resistance. Clean or repair the connections.'},
{t:'A6',a:'C',q:'A squeal at startup, along with low charging voltage, most likely indicates:',o:['A slipping drive belt','A bad diode','A weak regulator','A shorted field'],c:0,w:'A slipping belt can\'t turn the alternator fast enough under load.'},
{t:'A6',a:'C',q:'On many newer vehicles, how is charging voltage controlled?',o:['A fixed internal regulator only','The PCM or BCM, which varies voltage based on conditions','The battery','The ignition switch'],c:1,w:'Smart charging systems change the output target. Check with a scan tool before calling a low voltage a fault.'},
{t:'A6',a:'C',q:'The battery/charge warning light stays on with the engine running. What does this most likely indicate?',o:['A charging system fault','Normal operation','Low oil','Parking brake on'],c:0,w:'The light means the system has detected undercharging or a fault. Check voltage, belt and connections.'},
{t:'A6',a:'D',q:'Both headlights are dim, but all other lights are normal. What is the most likely cause?',o:['High resistance in the shared headlight feed or ground circuit','Two burned bulbs','A weak alternator','A bad dimmer for the dash'],c:0,w:'A problem common to both lamps points to a shared part of the circuit. Do voltage drop tests.'},
{t:'A6',a:'D',q:'What precaution applies when servicing HID headlamps?',o:['Ballasts produce very high voltage; disconnect power before servicing','They work on 5 V','They never need aiming','They can be tested with a test light'],c:0,w:'HID ballasts generate thousands of volts to strike the arc.'},
{t:'A6',a:'D',q:'After replacing a headlamp assembly, the technician should:',o:['Check and adjust headlamp aim','Replace the bulbs again','Reset the ECM','Nothing'],c:0,w:'A new housing or assembly can change the beam pattern. Aim it to spec.'},
{t:'A6',a:'D',q:'None of the brake lights work, but the turn signals do. What should be checked first?',o:['Brake light switch and its fuse','All bulbs','The flasher','The headlight switch'],c:0,w:'A failure of every bulb at once points to the shared feed: fuse or switch.'},
{t:'A6',a:'D',q:'When the brakes are applied, the tail lights dim and a turn signal flickers. What is the most likely cause?',o:['A poor ground at a rear lamp socket','A bad brake switch','A weak battery','A bad flasher'],c:0,w:'With a bad ground, current feeds back through the other filament of a dual-filament bulb, so the lights act strangely.'},
{t:'A6',a:'E',q:'A power window moves slowly in both directions. What should be checked?',o:['Window regulator/track binding and motor current draw','The door lock switch','The fuse only','The window tint'],c:0,w:'High current draw with slow movement points to mechanical binding. Normal current points to a weak motor or voltage drop.'},
{t:'A6',a:'E',q:'One power door lock doesn\'t work, but all the others do. Where is the most likely problem?',o:['That door\'s actuator or the wiring through its door jamb','The master switch','The BCM','The fuse'],c:0,w:'Shared parts work. Focus on the one door, especially the wiring that flexes in the jamb.'},
{t:'A6',a:'E',q:'The horn sounds continuously and won\'t turn off. What is the most likely cause?',o:['A stuck horn relay or shorted horn switch circuit','An open horn fuse','A bad horn','A weak battery'],c:0,w:'The relay is staying energized, or its contacts are stuck closed.'},
{t:'A6',a:'E',q:'The windshield wipers stop wherever they are when switched off. What is the most likely cause?',o:['A faulty park switch in the wiper motor or its circuit','A bad washer pump','A blown fuse','Worn blades'],c:0,w:'The park circuit keeps the motor running until the wipers reach the park position.'},
{t:'A6',a:'E',q:'All of the gauges in an instrument cluster are dead. What should be checked first?',o:['The cluster\'s power, ground and network communication','Each sending unit','The oil pressure','The alternator'],c:0,w:'When every gauge fails at once, the problem is something they share.'},
{t:'A6',a:'E',q:'How can a fuel level sending unit be tested?',o:['Check its resistance with an ohmmeter while moving the float through its range','With a test light','By filling the tank','By scanning for codes only'],c:0,w:'The resistance should change smoothly with no dead spots, matching the specification.'},
{t:'A6',a:'E',q:'One line of the rear window defogger grid doesn\'t heat. How can it be repaired?',o:['With a conductive grid repair kit (epoxy) over the break','Replace the glass only','Install a bigger fuse','It can\'t be repaired'],c:0,w:'Find the break with a voltmeter along the line and bridge it with conductive repair material.'},
{t:'A6',a:'E',q:'A keyless entry remote doesn\'t work, but the door lock switches do. What should be checked first?',o:['The remote\'s battery','The door lock actuators','The BCM fuse','The door ajar switches'],c:0,w:'The locks work, so the receiving side is likely fine. Start with the simplest cause.'},
{t:'A6',a:'E',q:'The engine cranks but won\'t start, and the security light is flashing. What is the most likely cause?',o:['The immobilizer isn\'t recognizing the key','A bad fuel pump','A failed crank sensor','A weak battery'],c:0,w:'The immobilizer disables fuel or ignition until a valid transponder key is read. A new key needs programming.'},
{t:'A6',a:'E',q:'"U" codes stored in several modules usually indicate:',o:['Network communication problems','Engine misfires','Body hardware faults','Transmission slipping'],c:0,w:'U codes are network (communication) codes. Find the module or bus fault common to them.'},
{t:'A6',a:'E',q:'One module isn\'t communicating on the network, while the others are. What should be checked first?',o:['That module\'s power, ground and network wiring','The gateway in every other module','The battery only','The fuse to all modules'],c:0,w:'A module can\'t talk without power and ground. Check the basics before condemning it.'},
{t:'A6',a:'E',q:'After a new body control module is installed, some features don\'t work. What is most likely needed?',o:['Programming or configuration of the module to the vehicle','A new battery','A bigger fuse','Nothing'],c:0,w:'Many modules must be programmed with the VIN and options and have keys or settings relearned.'},

/* ===================== A7 HVAC ===================== */
{t:'A7',a:'A',q:'What coolant mixture is generally recommended for most climates?',o:['100% coolant','50/50 coolant and water (or premixed as specified)','100% water','25% coolant'],c:1,w:'50/50 balances freeze protection, boil protection and heat transfer. Pure coolant actually transfers heat worse.'},
{t:'A7',a:'A',q:'An engine overheats at highway speed but runs normal temperature at idle. What is the most likely cause?',o:['Restricted radiator (internal clogging)','Inoperative cooling fan','Low idle speed','Stuck-open thermostat'],c:0,w:'At speed the engine makes more heat, and a clogged radiator can\'t reject it. Overheating at idle points to the fan.'},
{t:'A7',a:'A',q:'The windshield fogs with a greasy film, the cabin smells sweet and the passenger carpet is wet. What is the most likely cause?',o:['Leaking heater core','Leaking evaporator drain','Bad blower motor','Low refrigerant'],c:0,w:'Coolant leaking from the heater core gives the sweet smell, wet floor and film.'},
{t:'A7',a:'A',q:'After a coolant replacement, the heater blows cold and the temperature gauge fluctuates. What is the most likely cause?',o:['Air trapped in the cooling system','Bad thermostat','Low refrigerant','Blend door failure'],c:0,w:'Air pockets block coolant flow. Bleed the system per the procedure or use a vacuum fill tool.'},
{t:'A7',a:'A',q:'Which certification is required in the U.S. to service motor vehicle A/C systems for compensation?',o:['EPA Section 609','EPA Section 608 only','ASE L1','None'],c:0,w:'Section 609 of the Clean Air Act requires certified technicians and approved equipment for MVAC service.'},
{t:'A7',a:'A',q:'Why is an A/C system evacuated with a vacuum pump before recharging?',o:['To remove air and moisture','To add oil','To find the compressor','To cool the system'],c:0,w:'Moisture forms acids and ice, and air raises pressures. A deep vacuum boils moisture off.'},
{t:'A7',a:'A',q:'Which method can locate small refrigerant leaks?',o:['Electronic leak detector or UV dye with a black light','Soap on the compressor only','A test light','A vacuum gauge on the engine'],c:0,w:'Both are standard. Check the whole system, including the evaporator through the drain or a vent.'},
{t:'A7',a:'A',q:'Airflow from the dash vents is weak on all blower speeds. What should be checked first?',o:['Cabin air filter','Compressor clutch','Refrigerant charge','Heater core'],c:0,w:'A clogged cabin filter restricts airflow. It\'s quick and common.'},
{t:'A7',a:'A',q:'A musty odor comes from the vents when the A/C is first turned on. What is the most likely cause?',o:['Microbial growth on the evaporator','Low refrigerant','Heater core leak','Bad compressor'],c:0,w:'Moisture on the evaporator allows mold and bacteria to grow. Clean it and check the drain.'},
{t:'A7',a:'A',q:'How should refrigerant be added to an empty system?',o:['By weight according to the specification','Until the sight glass clears','By feel','Until the low side reads 50 psi'],c:0,w:'Charging by weight is the accurate method on modern systems.'},
{t:'A7',a:'A',q:'A lower radiator hose collapses at high engine speed. What should be done?',o:['Replace the hose (making sure it has its internal support spring if required)','Add more coolant','Replace the thermostat','Ignore it'],c:0,w:'The lower hose is on the suction side of the pump. A weak hose collapses and restricts flow.'},
{t:'A7',a:'A',q:'A new thermostat was installed backward. What is the most likely result?',o:['Overheating','Overcooling','No change','Better heat'],c:0,w:'The wax pellet must face the engine coolant. Installed backward, it opens late or not at all.'},
{t:'A7',a:'B',q:'Where is an accumulator located?',o:['On the low side, in orifice tube systems','On the high side, in TXV systems','Inside the compressor','In the heater core'],c:0,w:'The accumulator protects the compressor from liquid and holds the desiccant. TXV systems use a receiver-drier on the high side.'},
{t:'A7',a:'B',q:'Where is a fixed orifice tube typically located?',o:['In the liquid line at the evaporator inlet','In the compressor','In the accumulator outlet','In the suction line at the compressor'],c:0,w:'It\'s the point where high-pressure liquid drops to low pressure before entering the evaporator.'},
{t:'A7',a:'B',q:'How does a thermostatic expansion valve (TXV) regulate refrigerant flow?',o:['Based on evaporator outlet temperature (and pressure)','Based on engine rpm','Based on cabin temperature only','It doesn\'t regulate flow'],c:0,w:'The sensing bulb measures evaporator outlet superheat and changes flow to match the load.'},
{t:'A7',a:'B',q:'Which oil should be used in an electrically driven A/C compressor (common in hybrids)?',o:['Any PAG oil','The manufacturer-specified non-conductive oil (often POE)','Mineral oil','Engine oil'],c:1,w:'Electric compressors need non-conductive oil. The wrong oil can cause insulation faults and electrical hazards.'},
{t:'A7',a:'B',q:'What does the condenser do?',o:['Turns high-pressure vapor into high-pressure liquid by releasing heat','Turns liquid into vapor','Filters moisture','Lowers pressure'],c:0,w:'Heat leaves the refrigerant to the outside air as it condenses.'},
{t:'A7',a:'B',q:'What does the evaporator do?',o:['Absorbs heat from cabin air as the refrigerant evaporates','Releases heat outside','Pumps refrigerant','Stores oil'],c:0,w:'Low-pressure liquid boils in the evaporator and absorbs heat, which cools the cabin air.'},
{t:'A7',a:'B',q:'Why should the receiver-drier or accumulator be replaced when the system has been opened for a major repair?',o:['The desiccant may be saturated with moisture','It\'s required by law','It adds refrigerant','It isn\'t needed'],c:0,w:'The desiccant has a limited capacity. Many compressor warranties also require replacing it.'},
{t:'A7',a:'C',q:'Which sensors does an automatic climate control system commonly use?',o:['In-car temperature, ambient temperature and sun load','Oxygen sensor','Knock sensor','Wheel speed'],c:0,w:'The control module uses these inputs to set blower speed, blend and mode automatically.'},
{t:'A7',a:'C',q:'A clicking noise comes from behind the dash when the temperature setting is changed. What is the most likely cause?',o:['A blend door actuator with stripped gears','A bad blower motor','Low refrigerant','A bad compressor clutch'],c:0,w:'The actuator keeps trying to reach its position and its gears skip. Some need recalibration after replacement.'},
{t:'A7',a:'C',q:'Air comes out of the defrost vents no matter which mode is selected. What is the most likely cause?',o:['Mode door or actuator failure (or vacuum loss on vacuum systems)','Low refrigerant','A bad blower resistor','A bad heater core'],c:0,w:'Many systems default to defrost when they lose vacuum or control.'},
{t:'A7',a:'C',q:'What is the purpose of the diode across the A/C compressor clutch coil?',o:['To suppress voltage spikes when the coil turns off','To increase clutch strength','To act as a fuse','To regulate pressure'],c:0,w:'It protects the control module from the coil\'s inductive spike.'},
{t:'A7',a:'C',q:'The A/C compressor clutch won\'t engage. What should be checked before condemning the clutch?',o:['Refrigerant charge/pressure switch status, then voltage and ground at the clutch coil','The cabin filter','The heater core','The blend door'],c:0,w:'Low charge or an open pressure switch prevents engagement. Then verify that the coil gets power and ground.'},
{t:'A7',a:'C',q:'The A/C works well at highway speed but blows warmer at idle. What should be checked first?',o:['Condenser fan operation','Evaporator','Heater core','Blend door'],c:0,w:'At idle there\'s no ram air, so the condenser depends on the fan.'},
{t:'A7',a:'C',q:'On many newer vehicles, how is a variable displacement A/C compressor controlled?',o:['An electronically controlled solenoid valve','A clutch cycling switch only','The thermostat','Engine vacuum'],c:0,w:'The module changes the compressor\'s stroke with a control valve. Some have no clutch at all.'},
{t:'A7',a:'C',q:'What does a high-pressure cutout switch do?',o:['Turns off the compressor if high-side pressure gets too high','Turns on the heater','Controls the blower','Opens the orifice tube'],c:0,w:'It protects the system from dangerous pressure, for example when the condenser fan fails.'},
{t:'A7',a:'C',q:'Why do many systems use an evaporator temperature sensor?',o:['To keep the evaporator from freezing up','To measure cabin temperature','To control the heater valve only','To detect leaks'],c:0,w:'The module cycles or limits the compressor to keep the evaporator above freezing.'},
{t:'A7',a:'C',q:'A vehicle has a vacuum-operated heater control valve and no heat. Vacuum is present at the valve when heat is selected. What is the most likely cause?',o:['The valve is stuck closed or has a torn diaphragm','A bad blower motor','Low refrigerant','A bad A/C clutch'],c:0,w:'The control is working, but the valve isn\'t opening to let coolant through the core.'},

/* ===================== A8 ENGINE PERFORMANCE ===================== */
{t:'A8',a:'A',q:'What does freeze frame data show?',o:['Engine conditions at the moment a DTC was set','Live data only','Readiness monitors','Software version'],c:0,w:'Use it to recreate the conditions (rpm, load, temperature, fuel trim) when the fault happened.'},
{t:'A8',a:'A',q:'A DTC shows as pending but the MIL is off. What does this usually mean?',o:['The fault was detected once and needs to repeat on another trip to set the MIL','The fault is fixed','The code is fake','The MIL bulb is out'],c:0,w:'Many emissions faults are two-trip faults. A pending code is an early warning.'},
{t:'A8',a:'A',q:'During a power balance test, rpm drops much less on one cylinder than the others. What does this indicate?',o:['That cylinder is weak or not contributing','That cylinder is the strongest','Normal','Fuel pressure is high'],c:0,w:'Disabling a weak cylinder changes little because it wasn\'t doing much work.'},
{t:'A8',a:'A',q:'Long-term fuel trim reads −20%. What does this mean?',o:['The PCM is removing fuel to correct a rich condition','The engine is lean','Normal','A vacuum leak'],c:0,w:'Negative trim means the PCM is reducing fuel. Look for causes of richness: a leaking injector, high fuel pressure, a purge fault.'},
{t:'A8',a:'A',q:'A cranking amperage waveform shows one current hump much lower than the others. What does this indicate?',o:['Low compression on one cylinder','A bad starter','A weak battery','Ignition timing too far advanced'],c:0,w:'Less compression means less load on the starter for that cylinder. A relative compression test finds it without pulling the plugs.'},
{t:'A8',a:'A',q:'After clearing codes, several readiness monitors show incomplete. What does this mean?',o:['The vehicle needs to complete its drive cycle for the monitors to run','The PCM is bad','The codes will return immediately','The emission test will pass'],c:0,w:'Clearing codes resets the monitors. Drive the vehicle through the required enable conditions.'},
{t:'A8',a:'A',q:'An engine misfires only under heavy load or acceleration. Which is a likely cause?',o:['Ignition secondary breakdown (weak coil, worn plugs or wires)','A vacuum leak at idle','A faulty ECT sensor','A stuck-open EGR at idle'],c:0,w:'Higher cylinder pressure under load needs more firing voltage. Weak secondary parts break down first.'},
{t:'A8',a:'A',q:'Which scan data PID helps confirm a misfire on a specific cylinder?',o:['Misfire counters (per cylinder)','Barometric pressure','Odometer','Fuel level'],c:0,w:'Per-cylinder misfire counts help narrow the problem down before swapping parts.'},
{t:'A8',a:'B',q:'The crankshaft position sensor fails completely. What is the most likely result?',o:['No spark and no injector pulse: cranks but won\'t start','Rough idle only','Higher fuel economy','Check engine light only'],c:0,w:'The PCM uses the crank signal to time spark and fuel. Without it, most engines won\'t start.'},
{t:'A8',a:'B',q:'What does the knock sensor allow the PCM to do?',o:['Retard ignition timing when detonation is detected','Adjust fuel pressure','Control the idle','Turn on the fan'],c:0,w:'It\'s a piezoelectric sensor that picks up knock vibration, so the PCM pulls timing back.'},
{t:'A8',a:'B',q:'In a waste spark ignition system:',o:['Two spark plugs fire at the same time; one on compression and one on exhaust','Each plug fires twice per cycle on compression','There is no coil','The distributor fires all plugs'],c:0,w:'Paired cylinders share a coil. The spark on the exhaust stroke is "wasted" and needs little voltage.'},
{t:'A8',a:'B',q:'Typical ignition coil primary resistance is:',o:['Low, often under 2 Ω','Several thousand ohms','Infinite','Exactly 12 Ω'],c:0,w:'The primary is a few turns of heavy wire. The secondary is thousands of turns and reads in the thousands of ohms. Always check the spec.'},
{t:'A8',a:'B',q:'An engine misfires on damp mornings. Black tracks are found on a coil boot. What is the cause?',o:['Carbon tracking letting spark leak to ground','A bad fuel pump','A vacuum leak','A bad crank sensor'],c:0,w:'Moisture helps spark follow the carbon track. Replace the boot (and the coil if it\'s tracked).'},
{t:'A8',a:'B',q:'When installing spark plugs, the technician should:',o:['Follow manufacturer torque specs and anti-seize recommendations','Tighten them as tight as possible','Always use anti-seize','Ignore the gap'],c:0,w:'Some plugs have plated threads and should not get anti-seize, which changes the torque. Overtightening can damage aluminum heads.'},
{t:'A8',a:'C',q:'Fuel pressure is in spec at idle but the engine stumbles under load. Which test is most useful next?',o:['Fuel volume (flow) test or pressure under load','Spark plug gap check','Compression test','Ignition timing'],c:0,w:'A weak pump or restriction can hold pressure at idle but not supply enough volume under load.'},
{t:'A8',a:'C',q:'On a returnless fuel system, how is fuel pressure typically controlled?',o:['At the pump module, by a regulator in the tank or by the PCM varying pump speed','By a regulator on the fuel rail with a vacuum hose','By the injectors','By the throttle'],c:0,w:'Returnless systems keep hot fuel out of the tank and regulate at or in the tank.'},
{t:'A8',a:'C',q:'On a gasoline direct injection (GDI) engine, what drives the high-pressure fuel pump?',o:['The camshaft','An electric motor in the tank','The crankshaft pulley belt','Intake vacuum'],c:0,w:'A cam lobe drives the high-pressure pump. A low-pressure electric pump in the tank feeds it.'},
{t:'A8',a:'C',q:'After cleaning a dirty throttle body on an electronic throttle system, the technician should:',o:['Perform the idle relearn procedure if required','Replace the TPS','Adjust the throttle stop screw','Nothing'],c:0,w:'The PCM had learned the dirty throttle position. A relearn resets the idle airflow.'},
{t:'A8',a:'C',q:'A contaminated MAF sensor usually reads airflow:',o:['Lower than actual, causing a lean condition especially at higher airflow','Higher than actual','Exactly right','Only at idle'],c:0,w:'Contamination insulates the sensing element, so it under-reports. Fuel trims usually go positive as rpm rises.'},
{t:'A8',a:'C',q:'Why does injector pulse width increase on a cold engine?',o:['More fuel is needed because fuel vaporizes poorly when cold','To reduce emissions','Because of high fuel pressure','It doesn\'t increase'],c:0,w:'Cold enrichment makes up for fuel condensing on cold surfaces.'},
{t:'A8',a:'C',q:'A leaking fuel injector most likely causes:',o:['Hard hot starts, rich running and negative fuel trims','Lean codes','High oil pressure','No effect'],c:0,w:'Fuel drips into the cylinder after shutdown, flooding the engine and making it run rich.'},
{t:'A8',a:'C',q:'A severely clogged air filter on a modern fuel-injected engine mainly causes:',o:['Reduced power at wide-open throttle','Black smoke and a rich condition','A no-start','A high idle'],c:0,w:'The MAF and MAP sensors measure the actual air, so fuel stays matched. The main symptom is less available airflow and power.'},
{t:'A8',a:'D',q:'A PCV valve stuck open can cause:',o:['A high or rough idle from extra air entering the intake','Rich running only','Low oil pressure','Overheating'],c:0,w:'Extra air enters the intake through the stuck-open valve and bypasses the throttle. On some engines it can also show up as a lean condition. Stuck closed causes crankcase pressure, oil leaks and sludge.'},
{t:'A8',a:'D',q:'A vehicle is hard to start right after refueling and runs rich briefly. Which component is a likely cause?',o:['EVAP purge valve stuck open','Bad spark plugs','Bad knock sensor','Clogged air filter'],c:0,w:'A stuck-open purge valve dumps fuel vapor straight into the intake.'},
{t:'A8',a:'D',q:'How does EGR reduce NOx emissions?',o:['By lowering peak combustion temperature','By adding oxygen','By raising compression','By cooling the catalytic converter'],c:0,w:'Inert exhaust gas dilutes the charge, which lowers peak temperature. NOx forms at high temperatures.'},
{t:'A8',a:'D',q:'When does secondary air injection reduce HC and CO?',o:['Mainly during cold start and warm-up, by adding air to the exhaust','At wide-open throttle','Only at idle when hot','It reduces NOx'],c:0,w:'Extra oxygen helps burn HC and CO and heats the catalytic converter faster.'},
{t:'A8',a:'D',q:'A vehicle fails an emissions test for high NOx. Which is a likely cause?',o:['EGR system not flowing or a lean condition','A rich condition only','A dirty air filter','A bad fuel gauge'],c:0,w:'High combustion temperature from a lean mixture, missing EGR flow or overadvanced timing raises NOx.'},
{t:'A8',a:'D',q:'How can catalytic converter operation be checked with an infrared thermometer?',o:['A working converter is usually hotter at the outlet than the inlet once warmed up','The inlet should be hotter','Both should be cold','Temperature means nothing'],c:0,w:'The chemical reactions release heat. Use this as a supporting check along with O2 sensor data.'},
{t:'A8',a:'E',q:'A zirconia oxygen sensor in closed loop should switch between about:',o:['0.1 V and 0.9 V','0 V and 5 V','2 V and 3 V','12 V and 14 V'],c:0,w:'High voltage means rich, low voltage means lean, switching around 0.45 V. Wideband sensors work differently.'},
{t:'A8',a:'E',q:'How does a wideband air-fuel ratio sensor differ from a narrow-band O2 sensor?',o:['It uses a pumping current to measure the actual air-fuel ratio (lambda) over a wide range','It only switches rich and lean','It needs no heater','It measures NOx'],c:0,w:'The PCM reads the pump current to see exactly how rich or lean the mixture is, not just which side of stoichiometric.'},
{t:'A8',a:'E',q:'What is a typical throttle position sensor voltage range?',o:['About 0.5 V closed to about 4.5 V wide open','0 V to 12 V','5 V closed to 0 V wide open always','1 V fixed'],c:0,w:'Most TPS signals sweep smoothly within the 5 V reference range. Check the specification.'},
{t:'A8',a:'E',q:'How does an engine coolant temperature (ECT) sensor\'s resistance change as the engine warms up?',o:['It decreases (NTC thermistor)','It increases','It stays the same','It goes to zero'],c:0,w:'Most temperature sensors are negative temperature coefficient thermistors.'},
{t:'A8',a:'E',q:'The ECT sensor PID reads about 290°F on a cold engine. What is the most likely cause?',o:['The signal circuit is shorted to ground','The sensor circuit is open','Normal','A bad thermostat'],c:0,w:'A signal pulled to 0 V looks like very low resistance, which means very hot. An open circuit reads very cold (about −40°F).'},
{t:'A8',a:'E',q:'Many sensor readings are slightly off at the same time. What is a good next step?',o:['Voltage drop test the PCM ground circuits','Replace all the sensors','Reflash the PCM immediately','Ignore it'],c:0,w:'A poor PCM ground shifts the reference for every sensor. Ground drop should be very low, usually around 0.1 V or less.'},
{t:'A8',a:'E',q:'A TSB says a drivability concern is fixed with a software update. What should the technician do?',o:['Reprogram (flash) the PCM with the updated calibration','Replace the PCM','Replace the sensors','Ignore the TSB'],c:0,w:'Many drivability concerns are fixed with calibration updates. Always check TSBs.'},
{t:'A8',a:'E',q:'When checking sensor signals at a connector, what is the preferred method?',o:['Back-probe the connector without damaging the seals','Pierce the wire insulation','Cut the wire','Use a test light'],c:0,w:'Pierced insulation lets moisture in and causes corrosion later. Back-probe whenever possible. Try it in the Fan Circuit Lab.'},
{t:'A8',a:'E',q:'Why do electronic throttle control systems use two (or more) accelerator pedal position sensors?',o:['For redundancy and plausibility checks','To double the throttle opening','One for each bank','For cruise control only'],c:0,w:'The PCM compares the signals. If they disagree, it sets a code and limits throttle (reduced power mode).'},
{t:'A8',a:'E',q:'P0171 and P0174 (system lean, bank 1 and bank 2) are set together. What should be checked first?',o:['Something common to both banks: MAF, fuel pressure or a large vacuum leak','One injector','One O2 sensor','One spark plug'],c:0,w:'Both banks lean at once points to a shared cause, not a single-cylinder or single-bank part.'}
);

Q.push(
/* ===== A1 ===== */
{t:'A1',a:'A',q:'During a cylinder leakage test, air is heard at the throttle body. Which part is leaking?',o:['Intake valve','Exhaust valve','Piston rings','Head gasket to coolant'],c:0,w:'Air escaping into the intake points to the intake valve not sealing.'},
{t:'A1',a:'A',q:'During a cylinder leakage test, air is heard at the oil fill opening. What does this indicate?',o:['Leakage past the piston rings','A leaking intake valve','A leaking exhaust valve','A cracked radiator'],c:0,w:'Air going into the crankcase gets there past the rings (or through a holed piston).'},
{t:'A1',a:'A',q:'Oil is being pushed out of the dipstick tube. The PCV system tests good. What is the most likely cause?',o:['Excessive blow-by from worn rings or pistons','Overfilled coolant','A clogged air filter','Low fuel pressure'],c:0,w:'Combustion gases leaking past the rings pressurize the crankcase faster than a working PCV can vent them.'},
{t:'A1',a:'A',q:'At sea level, a healthy engine at warm idle typically shows about how much manifold vacuum?',o:['5–8 in. Hg','17–21 in. Hg','25–30 in. Hg','0 in. Hg'],c:1,w:'A steady 17–21 in. Hg is typical. Readings drop at higher altitude.'},
{t:'A1',a:'A',q:'At idle, the vacuum gauge needle vibrates rapidly, and it steadies as rpm increases. What is the most likely cause?',o:['Worn valve guides','Restricted exhaust','Late ignition timing','Head gasket leak'],c:0,w:'Loose valve guides let the valves wobble on their seats at idle. The flutter smooths out with speed.'},
{t:'A1',a:'A',q:'A vacuum gauge shows a steady but low reading (about 10–14 in. Hg) at idle. Which is a likely cause?',o:['Late valve timing, such as a jumped timing belt','Burned valve','Worn valve guides','Normal reading'],c:0,w:'A steady low reading points to late ignition or valve timing (or an intake leak). Fluctuating readings point to valve problems.'},
{t:'A1',a:'A',q:'One spark plug is wet with oil while the others look normal. What is the most likely cause?',o:['Worn valve seals or rings on that cylinder','A rich fuel mixture','Overheating','A bad ignition coil only'],c:0,w:'Oil is getting into that one cylinder past its seals or rings. A wet compression test can tell which.'},
{t:'A1',a:'B',q:'After a valve job, installed valve stem height is too high. What can this affect?',o:['Hydraulic lifter preload and rocker geometry','Oil pressure','Compression ratio only','Coolant flow'],c:0,w:'Grinding the valve and seat raises the stem. Correct it per spec, usually by grinding the stem tip or using a different seat.'},
{t:'A1',a:'B',q:'A valve head\'s margin is ground below the minimum specification. What should be done?',o:['Replace the valve','Reuse it','Grind it more','Shim the spring'],c:0,w:'A thin margin can overheat and burn. Replace the valve.'},
{t:'A1',a:'B',q:'How can a pushrod be checked for straightness?',o:['Roll it on a flat surface such as glass and look for wobble or gaps','Measure its resistance','Weigh it','Check it with a test light'],c:0,w:'A bent pushrod rocks or shows gaps when rolled. Many shops also use a dial indicator on V-blocks.'},
{t:'A1',a:'B',q:'The overhead camshaft binds after the head bolts are torqued. What is the most likely cause?',o:['Warped head or misaligned cam bores','Low oil','A loose timing belt','A bad lifter'],c:0,w:'A warped head distorts the cam bore alignment. Check flatness and the bores before installing the cam.'},
{t:'A1',a:'B',q:'Valve lash on solid lifters is set too tight. What can this cause?',o:['Valves not closing fully and burning','Louder valve noise','Better fuel economy','Higher oil pressure'],c:0,w:'Without clearance, the valve may not seat fully and can\'t transfer heat to the head. Too loose causes noise and wear.'},
{t:'A1',a:'C',q:'A bore measures 4.002 in. parallel to the crankshaft and 4.005 in. perpendicular to it. How much out-of-round is that?',o:['0.001 in.','0.003 in.','0.005 in.','0.007 in.'],c:1,w:'Out-of-round is the difference: 4.005 − 4.002 = 0.003 in.'},
{t:'A1',a:'C',q:'Where is piston diameter typically measured?',o:['Across the skirt, at the specified distance, perpendicular to the piston pin','Across the top ring land','Parallel to the pin','At the crown'],c:0,w:'Skirts are cam-ground, so measure where the manufacturer specifies to get piston-to-wall clearance.'},
{t:'A1',a:'C',q:'Crankshaft journal taper and out-of-round are checked with:',o:['An outside micrometer at several points','A feeler gauge','A straightedge','Plastigage only'],c:0,w:'Measure each journal at both ends and at 90° apart, then compare the readings.'},
{t:'A1',a:'C',q:'What holds a bearing insert tightly in its bore?',o:['Bearing crush','Oil pressure','The locating tab only','Thread locker'],c:0,w:'Bearing halves stick up slightly above the parting line. Torquing the cap "crushes" them tight in the bore. The tab only locates them.'},
{t:'A1',a:'C',q:'An engine had a severe overheat. Before reassembly, what should be checked on the block?',o:['Deck surface flatness','Oil pan level','Starter mounting','Intake runner length'],c:0,w:'Overheating can warp the deck as well as the head. Check both before installing a new gasket.'},
{t:'A1',a:'D',q:'An oil pump pressure relief valve stuck open would cause:',o:['Low oil pressure','High oil pressure','Overheating coolant','Oil burning'],c:0,w:'A relief valve stuck open sends oil straight back to the pan.'},
{t:'A1',a:'D',q:'An engine with a mechanical fan clutch overheats at idle and in traffic but is fine at highway speed. What is a likely cause?',o:['Slipping fan clutch','Restricted radiator','Head gasket leak','Wrong coolant color'],c:0,w:'At low speed the engine depends on the fan. A slipping clutch doesn\'t pull enough air.'},
{t:'A1',a:'D',q:'How can an infrared thermometer help diagnose a radiator?',o:['Cold spots across the core indicate plugged tubes','It measures coolant concentration','It tests the cap','It finds air pockets in the block'],c:0,w:'A healthy radiator shows an even temperature drop from inlet to outlet. Cold bands mean blocked tubes.'},
{t:'A1',a:'D',q:'Engine oil level keeps rising and the oil smells like fuel. What is a likely cause?',o:['Fuel dilution from a leaking injector or excessive short-trip rich running','A head gasket leak only','A clogged PCV hose','Normal operation'],c:0,w:'Fuel washing past the rings thins the oil and wears the bearings. Find the source.'},
{t:'A1',a:'E',q:'A ticking noise is heard when the engine is cold and goes away as it warms up. Which is a likely cause?',o:['A cracked exhaust manifold or leaking manifold gasket','A rod bearing','A low coolant level','A bad alternator'],c:0,w:'The crack opens when cold and seals as the metal expands with heat.'},
{t:'A1',a:'E',q:'An air leak in the intake duct between the MAF sensor and the throttle body can cause:',o:['A lean condition from unmetered air','A rich condition','High oil pressure','No effect'],c:0,w:'Air that bypasses the MAF isn\'t measured, so the PCM under-fuels it.'},
{t:'A1',a:'E',q:'There is a rattle from the catalytic converter when the exhaust is tapped. What is the most likely cause?',o:['Broken internal substrate','Normal heat shield noise only','A clogged air filter','A loose O2 sensor'],c:0,w:'Loose substrate can move and plug the exhaust. Check for restriction.'},
{t:'A1',a:'E',q:'Before checking base ignition timing on older distributor engines, the technician should:',o:['Disable computer timing control as the procedure specifies','Disconnect the fuel pump','Remove the spark plugs','Unplug the MAF'],c:0,w:'Base timing is checked with the PCM\'s spark advance disabled (for example, by disconnecting a timing connector) and the engine at the specified rpm.'},

/* ===== A2 ===== */
{t:'A2',a:'A',q:'Only the 2–3 upshift is harsh. All other shifts are normal. What should be suspected?',o:['The 2–3 accumulator or the apply circuit for 3rd','The pump','The torque converter','The output speed sensor'],c:0,w:'A problem with one shift points to the components for that shift: its accumulator, servo or clutch apply circuit.'},
{t:'A2',a:'A',q:'A transmission slips in all forward gears but Reverse is normal. What is the most likely cause?',o:['Forward clutch (applied in all forward gears)','Reverse clutch','Low/reverse band','Torque converter'],c:0,w:'Find the component applied in every forward gear but not in reverse, often the forward clutch.'},
{t:'A2',a:'A',q:'Reverse slips, and there is no engine braking in Manual 1. Drive 1st is normal. What is the most likely cause?',o:['The low/reverse holding device (shared by Reverse and Manual 1)','The forward clutch','The pump','The TCC'],c:0,w:'Find the common component. On many units the low/reverse clutch or band holds in both Reverse and Manual 1.'},
{t:'A2',a:'A',q:'The engine flares between shifts only at wide-open throttle. What is the most likely cause?',o:['Line pressure not rising enough under load','Overfilled fluid','A bad VSS','Wrong tire size'],c:0,w:'Apply pressure must rise with throttle. If it doesn\'t, the clutches slip during shifts at high torque.'},
{t:'A2',a:'A',q:'The scan tool shows high TCC slip rpm while the TCC is commanded fully applied. What does this indicate?',o:['A slipping torque converter clutch or low apply pressure','Normal operation','A bad TPS','Wrong engine oil'],c:0,w:'When the TCC is fully applied, engine and turbine speed should nearly match.'},
{t:'A2',a:'A',q:'A transmission overheats while towing. What is the best recommendation?',o:['Verify cooler flow and add an auxiliary transmission cooler','Lower the tire pressure','Use thicker engine oil','Remove the thermostat'],c:0,w:'Heat kills fluid and friction material. Confirm cooler flow, then add cooling capacity for towing.'},
{t:'A2',a:'A',q:'The transmission stays in 1st gear. The speedometer works, and a shift solenoid A circuit code is set. What should be checked first?',o:['Shift solenoid A circuit: wiring, connector and solenoid resistance','The torque converter','The pump','The forward clutch'],c:0,w:'The code points to the circuit. Check the wiring and solenoid before assuming a mechanical failure.'},
{t:'A2',a:'A',q:'The backup lights don\'t work in Reverse, and the vehicle sometimes won\'t crank in Park. What should be checked?',o:['Transmission range sensor','Brake light switch','Turn signal flasher','TCC solenoid'],c:0,w:'The range sensor often controls both reverse lamps and start enable.'},
{t:'A2',a:'A',q:'After oversize tires are installed, shift points feel late and the speedometer reads low. What is the fix?',o:['Reprogram the tire size in the PCM/TCM','Replace the speed sensor','Adjust the shift cable','Change the fluid'],c:0,w:'The modules calculate vehicle speed from tire size, and the wrong value affects shifting and speed readings.'},
{t:'A2',a:'A',q:'How long should a single stall test run?',o:['No more than about 5 seconds','30 seconds','Until the engine overheats','2 minutes'],c:0,w:'Fluid heats up fast during a stall test. Keep it short and let the fluid cool between tests.'},
{t:'A2',a:'A',q:'The engine stalls when coming to a stop, and it idles rough in Drive but fine in Neutral. What is the most likely transmission cause?',o:['Torque converter clutch stuck applied','Slipping forward clutch','Low fluid','Bad range sensor'],c:0,w:'A TCC that won\'t release acts like a manual car with the clutch out at a stop.'},
{t:'A2',a:'A',q:'A ticking or knocking noise comes from the bell housing in Park and Neutral and changes with engine speed. What is the most likely cause?',o:['Cracked flexplate or loose converter bolts','Worn planetary','Low fluid','Bad pump'],c:0,w:'The flexplate turns with the engine. Inspect it through the inspection cover.'},
{t:'A2',a:'A',q:'Technician A says transmission fluid level reads higher when the fluid is hot. Technician B says the level should be checked at the temperature the procedure specifies. Who is correct?',o:[TA,TB,BOTH,NEI],c:2,w:'Fluid expands with heat, so the temperature in the procedure matters.'},
{t:'A2',a:'B',q:'How is the fluid level checked on many "sealed" transmissions without a dipstick?',o:['Through a check/fill plug at a specified fluid temperature read on a scan tool','By weighing the vehicle','Through the vent','It never needs checking'],c:0,w:'Fluid is at the correct level when it just drips from the check plug at the specified temperature.'},
{t:'A2',a:'B',q:'A loud clunk is heard when shifting into Drive or Reverse. What should be inspected first?',o:['Transmission and engine mounts','Clutch packs','Valve body','Cooler lines'],c:0,w:'Broken mounts let the powertrain lurch on engagement.'},
{t:'A2',a:'B',q:'The shifter won\'t move out of Park even with the brake pressed. What is the most likely cause?',o:['A failed brake switch or shift interlock solenoid','Low fluid','A worn band','A bad TCC'],c:0,w:'The interlock releases only when it sees the brake applied. Most vehicles have a manual override slot.'},
{t:'A2',a:'B',q:'After a TCM replacement, what is usually required?',o:['Programming and adaptive relearn','A new torque converter','A fluid flush only','Nothing'],c:0,w:'Most TCMs must be loaded with the correct calibration and then learn clutch fill values.'},
{t:'A2',a:'B',q:'The pan magnet has large metal chunks on it. What does this indicate?',o:['Internal mechanical damage such as gears or bearings','Normal wear','Wrong fluid','A clogged cooler only'],c:0,w:'A light gray paste is normal. Chunks mean something is breaking.'},
{t:'A2',a:'B',q:'Which hose should be used to repair a transmission cooler line?',o:['Hose rated for transmission fluid and cooler line pressure and heat','Rubber vacuum hose','Fuel hose of any type','Heater hose'],c:0,w:'Cooler circuits see heat and pressure. Use approved hose and clamps, or steel line repair fittings.'},
{t:'A2',a:'C',q:'Which lubricant is appropriate for holding parts and seals during transmission assembly?',o:['Transmission assembly gel or petroleum jelly','Chassis grease','Wheel bearing grease','Silicone RTV'],c:0,w:'Assembly lube dissolves in ATF. Chassis grease can plug passages and filters.'},
{t:'A2',a:'C',q:'A valve body is reassembled with a check ball missing. What is the most likely result?',o:['Abnormal shift quality, such as harsh, soft or wrong-timed shifts','No effect','Higher fuel economy','A no-start'],c:0,w:'Check balls direct fluid in specific circuits. Note their locations before disassembly.'},
{t:'A2',a:'C',q:'On transmissions with adjustable bands, the band is usually adjusted by:',o:['Torquing the adjusting screw to spec and then backing it off a specified number of turns','Adding shims','Changing the pump','Changing line pressure'],c:0,w:'Follow the exact torque and back-off spec. Over-tight bands drag, and loose bands slip.'},
{t:'A2',a:'C',q:'Before installing the transmission, how should the torque converter be positioned?',o:['Fully seated, engaging the pump drive (usually confirmed by a measured depth)','Pulled forward onto the flexplate','Bolted to the flexplate first','At any depth'],c:0,w:'A converter that isn\'t fully seated can crack the pump when the bell housing bolts are tightened.'},
{t:'A2',a:'C',q:'How is bushing clearance on a transmission shaft checked?',o:['Measure the bushing ID with a telescoping or bore gauge and compare it to the shaft OD','With Plastigage','With a feeler gauge only','By sound'],c:0,w:'Excessive bushing clearance leaks fluid pressure from the circuits fed through it.'},

/* ===== A3 ===== */
{t:'A3',a:'A',q:'How should clutch pedal free play be handled on a cable clutch without a self-adjuster?',o:['Adjust it to the specified free play','Remove all free play','Ignore it','Add as much as possible'],c:0,w:'Too little free play causes slipping. Too much causes incomplete release.'},
{t:'A3',a:'A',q:'The clutch doesn\'t fully release, and the hydraulic system tests good. Which mechanical part should be checked?',o:['Release fork pivot or fork wear','Pilot bearing only','Synchronizers','Axle shafts'],c:0,w:'A worn pivot ball or fork reduces release travel at the bearing.'},
{t:'A3',a:'A',q:'A new clutch disc was installed backward. What is the likely result?',o:['Engagement or release problems and noise','Better grip','No difference','Higher pedal'],c:0,w:'Discs are marked "flywheel side." Backward, the hub can contact the flywheel bolts or pressure plate.'},
{t:'A3',a:'A',q:'A dual-mass flywheel rattles at idle and the two halves rotate much more than specified. What is the correct repair?',o:['Replace the flywheel','Resurface it','Add shims','Change the gear oil'],c:0,w:'Worn internal springs and dampers can\'t be repaired.'},
{t:'A3',a:'B',q:'Reverse grinds when selected, even right after the clutch is pressed. What does the technician tell the customer?',o:['Reverse often isn\'t synchronized; wait a moment for the input shaft to stop','The synchronizers are bad','The engine mounts are bad','It needs new gear oil'],c:0,w:'Many manual transmissions have an unsynchronized reverse. If grinding continues after a pause, check for clutch drag.'},
{t:'A3',a:'B',q:'How is tapered roller bearing preload in many manual transmissions set?',o:['With selective shims, based on measured end play','By tightening the case bolts','With gear oil viscosity','By the shift forks'],c:0,w:'Measure end play, then choose a shim to get the specified preload or end play.'},
{t:'A3',a:'B',q:'Shifts are noisy and the sleeve can be felt rubbing. What should be measured?',o:['Shift fork pad thickness and fork-to-sleeve clearance','Clutch free play','Axle backlash','Tire size'],c:0,w:'Worn fork pads cause rubbing and can lead to jumping out of gear.'},
{t:'A3',a:'B',q:'A new transmission wears out its pilot bearing and input shaft quickly, and it shifts poorly. What should be checked?',o:['Bell housing bore and face runout (alignment)','Gear oil brand','Clutch pedal height only','Axle ratio'],c:0,w:'A misaligned bell housing puts the input shaft off-center from the crankshaft. Check it with a dial indicator.'},
{t:'A3',a:'C',q:'A transaxle whines on both acceleration and deceleration, and the whine changes with load. What is the most likely cause?',o:['Final drive gears or bearings','Clutch disc','CV boot','Wheel balance'],c:0,w:'Gear noise changes with load. Isolate it with a road test.'},
{t:'A3',a:'C',q:'Gear oil is leaking onto the clutch from the transaxle input shaft seal. What is the likely result?',o:['Clutch slip or chatter','Harder steering','Brake fade','No effect'],c:0,w:'Fix the leak and replace the contaminated disc.'},
{t:'A3',a:'C',q:'The shifter feels sloppy and imprecise on a cable-shifted transaxle. What is a common cause?',o:['Worn shift cable bushings or shifter base','Low tire pressure','Worn clutch disc','Bad wheel bearing'],c:0,w:'Worn bushings add play between the lever and the transaxle.'},
{t:'A3',a:'C',q:'Removing a half shaft from a transaxle usually calls for:',o:['Inspecting and often replacing the differential seal','Replacing the clutch','Adding engine oil','Replacing the shifter'],c:0,w:'Seals are easy to damage during removal and installation. Replacing them prevents comebacks.'},
{t:'A3',a:'D',q:'When installing a new front axle (half shaft), how should the axle nut be tightened?',o:['To spec, usually with the vehicle weight on the wheels or the hub held, and with a new nut if specified','With an impact as tight as possible','By hand only','Left loose for adjustment'],c:0,w:'Axle nut torque sets the hub bearing clamp load. Many nuts are one-time-use.'},
{t:'A3',a:'D',q:'After undercoating, a driveshaft develops a vibration. What should be checked?',o:['Missing balance weights or undercoating stuck on the shaft','The clutch','The gear oil','The tie rods'],c:0,w:'Even small added or lost weight throws the balance off at speed.'},
{t:'A3',a:'D',q:'A clunk occurs on takeoff, and the driveshaft slip yoke has noticeable spline play. What is the correct repair?',o:['Replace the worn slip yoke or splines','Add gear oil','Adjust the clutch','Rotate the tires'],c:0,w:'Spline wear causes a clunk when the driveline load reverses.'},
{t:'A3',a:'D',q:'A two-piece driveshaft rumbles at highway speed. Which part is a common source?',o:['Center support bearing','Clutch release bearing','Pilot bearing','Pinion seal'],c:0,w:'A worn center bearing or rubber mount lets the shaft vibrate.'},
{t:'A3',a:'E',q:'How is a ring and pinion tooth contact pattern checked?',o:['Apply marking compound and rotate the gears under load','Measure with Plastigage','Use a stethoscope','By road test only'],c:0,w:'The pattern shows where the teeth meet so depth and backlash can be corrected.'},
{t:'A3',a:'E',q:'How is a clutch-type limited-slip differential checked?',o:['Measure breakaway torque at one wheel with a torque wrench while the other is held','By listening only','With a vacuum gauge','By spinning both wheels together'],c:0,w:'Compare the torque needed to turn one axle to spec. Low torque means worn clutches.'},
{t:'A3',a:'E',q:'How should the retaining ring on a press-fit axle bearing be removed?',o:['By notching it with a chisel or drilling it, never by heating it with a torch','By heating it red hot','With an impact wrench','It can\'t be removed'],c:0,w:'A torch can weaken the axle shaft. Use the cutting method in the procedure.'},
{t:'A3',a:'E',q:'A pinion nut on a crush-sleeve design is tightened past the preload spec. What should be done?',o:['Replace the crush sleeve and set preload again','Back the nut off to reduce preload','Add a washer','Leave it'],c:0,w:'Once crushed too far, the sleeve won\'t hold preload correctly if the nut is backed off.'},
{t:'A3',a:'F',q:'An electric-shift transfer case won\'t shift. The motor runs when commanded. What should be checked next?',o:['The encoder/position sensor and the internal shift mechanism','The clutch','The tie rods','The gear oil brand'],c:0,w:'The module uses the encoder to know the shift position. A bad encoder stops or confuses the shift.'},
{t:'A3',a:'F',q:'An AWD vehicle with an electronically controlled rear coupling shudders on tight turns. Which service may be needed?',o:['Coupling fluid service (and software or relearn if specified)','A clutch replacement','A brake bleed','An alignment only'],c:0,w:'Many couplings need periodic fluid service. Worn fluid causes binding and shudder.'},
{t:'A3',a:'F',q:'What is the purpose of a center differential lock on a full-time 4WD system?',o:['To lock front and rear outputs together for maximum traction on slippery surfaces','To improve fuel economy on dry pavement','To disable 4WD','To shift to low range'],c:0,w:'Locked, the front and rear turn together. Unlock it on high-traction surfaces to avoid windup.'},
{t:'A3',a:'F',q:'Transfer case fluid level keeps rising and the fluid smells like ATF. What is the most likely cause?',o:['A leaking seal between the transmission and the transfer case','Condensation','An overfill at the last service only','A bad front axle seal'],c:0,w:'ATF migrating from the transmission raises the transfer case level and lowers the transmission level.'},
{t:'A3',a:'F',q:'A 4WD indicator shows engaged, but the front driveshaft doesn\'t turn. Which component should be checked?',o:['Transfer case range/mode shift system and front output','Rear brakes','Clutch master cylinder','Steering gear'],c:0,w:'The indicator only reports the command or switch. Confirm whether the transfer case is actually sending power forward.'},

/* ===== A4 ===== */
{t:'A4',a:'A',q:'Power steering fluid is found inside a rack-and-pinion bellows boot. What is the cause?',o:['Leaking internal rack seals','A loose reservoir cap','Normal condition','A bad pump'],c:0,w:'Fluid in the boot means the rack\'s seals are leaking. Replace or reseal the rack.'},
{t:'A4',a:'A',q:'Steering feels notchy and binding through part of its rotation. What should be inspected?',o:['Steering shaft universal joints','Tie-rod ends only','Tire pressure','Shock absorbers'],c:0,w:'Seized or corroded intermediate shaft U-joints cause notchy steering.'},
{t:'A4',a:'A',q:'The wrong fluid was added to a hydraulic power steering system. What is the correct fix?',o:['Flush the system with the specified fluid and inspect for seal damage','Top off with the correct fluid','Ignore it','Add a seal conditioner'],c:0,w:'Incompatible fluid can swell or harden seals. Flush it out completely.'},
{t:'A4',a:'A',q:'Electric power steering gets heavy when battery voltage is low. Why?',o:['The EPS module reduces assist to protect the system when voltage is low','The rack is worn','The tie rods are bent','Normal tire wear'],c:0,w:'EPS motors draw high current, so modules limit assist at low voltage. Check the charging system and battery.'},
{t:'A4',a:'A',q:'On a recirculating ball steering gear, where is the over-center (sector) preload adjustment made?',o:['With the gear at the center of its travel','At full left lock','At full right lock','With the gear removed only'],c:0,w:'The gear is designed with the tightest mesh at center. Follow the specified sequence and torque values.'},
{t:'A4',a:'A',q:'After replacing an outer tie-rod end, what must be done?',o:['Check and set toe','Replace the other tie rod','Bleed the steering','Nothing'],c:0,w:'Even counting turns, toe changes. Align the vehicle.'},
{t:'A4',a:'A',q:'A clunk is felt when turning the steering wheel back and forth with the vehicle stopped. What should be checked?',o:['Steering gear/rack mounting bolts and bushings','Wheel bearings','Shock absorbers','Brake pads'],c:0,w:'Loose rack mounts let the gear housing shift as you steer.'},
{t:'A4',a:'B',q:'One front coil spring is sagging. What is the recommended repair?',o:['Replace the springs in pairs on the same axle','Replace only the sagging spring','Add a spacer','Inflate the tire more'],c:0,w:'Replacing in pairs keeps ride height and handling even side to side.'},
{t:'A4',a:'B',q:'A creak or clunk is heard when turning the steering wheel, coming from the top of a front strut. What is the most likely cause?',o:['Worn strut mount bearing','Worn tie rod','Low steering fluid','Worn brake pads'],c:0,w:'The strut bearing lets the strut rotate as you steer. When worn, it binds and pops.'},
{t:'A4',a:'B',q:'A worn rear trailing arm bushing can cause:',o:['Rear wheel steer and thrust angle changes','Brake fade','Power steering noise','Engine misfire'],c:0,w:'Rear axle position affects thrust angle and tracking.'},
{t:'A4',a:'B',q:'On a vehicle with electronic air or height-leveling suspension, ride height is wrong after repairs. What should be checked?',o:['Ride height sensor linkage, calibration and relearn','Tire balance','Toe','Shocks only'],c:0,w:'The module levels to what the sensor reports. A bent link or missed calibration gives the wrong height.'},
{t:'A4',a:'B',q:'On a ball joint with a wear indicator, the grease fitting boss has receded into the housing. What does this mean?',o:['The ball joint is worn and should be replaced','The joint needs more grease','It\'s normal','It\'s overtightened'],c:0,w:'The boss moves inward as internal wear increases.'},
{t:'A4',a:'B',q:'A squeak or clunk comes from the rear of a leaf-spring truck over bumps. Which part is a common cause?',o:['Worn spring shackle or eye bushings','Front tie rod','Power steering pump','Brake hose'],c:0,w:'Worn bushings let the spring move and make noise.'},
{t:'A4',a:'B',q:'When should control arm bushing bolts be torqued?',o:['With the suspension at normal ride height','With the suspension hanging free','Before installing the springs','It doesn\'t matter'],c:0,w:'Torquing at full droop pre-twists the rubber bushings, which then wear out early and change ride height.'},
{t:'A4',a:'C',q:'Camber is commonly adjusted with:',o:['Eccentric bolts/cams or shims','Tie-rod sleeves','Wheel weights','Tire pressure'],c:0,w:'The method depends on design. Toe is adjusted at the tie rods.'},
{t:'A4',a:'C',q:'On a short-long arm suspension with shims at the upper arm, how is caster adjusted?',o:['Moving shims from the front to the rear of the arm (or the reverse)','Adding shims equally front and rear','Adjusting the tie rods','Changing the springs'],c:0,w:'Equal shim changes adjust camber. Moving shims between front and rear tilts the arm and changes caster.'},
{t:'A4',a:'C',q:'Before measuring alignment with wheel-mounted sensors, what should be done when the system requires it?',o:['Compensate for wheel runout','Rotate the tires','Inflate the tires to max','Disconnect the battery'],c:0,w:'Runout compensation removes rim wobble from the readings.'},
{t:'A4',a:'C',q:'Too much positive camber most commonly causes wear on:',o:['The outer shoulder of the tire','The inner shoulder','The center','Both shoulders equally'],c:0,w:'Positive camber tilts the top of the tire outward and loads the outer edge.'},
{t:'A4',a:'C',q:'What does steering axis inclination (SAI) do?',o:['Helps the steering return to center and reduces steering effort','Sets toe','Causes tire wear','Adjusts ride height'],c:0,w:'SAI places the steering axis closer to the tire contact patch and helps self-centering.'},
{t:'A4',a:'C',q:'Aftermarket wheels with a different offset are installed. Which alignment-related angle changes?',o:['Scrub radius, which can change steering feel and pull','Thrust angle','Camber at the factory setting','Rear toe only'],c:0,w:'Offset moves the tire contact patch relative to the steering axis.'},
{t:'A4',a:'C',q:'After a vehicle is lifted or lowered, what should be done?',o:['Check and correct the alignment','Nothing','Only balance the tires','Replace the shocks'],c:0,w:'Changing ride height changes camber, caster and toe.'},
{t:'A4',a:'D',q:'A tire\'s DOT code ends in "2321." When was it made?',o:['The 23rd week of 2021','March 2021','2023','The 21st day of 2023'],c:0,w:'The last four digits are the week and year of manufacture.'},
{t:'A4',a:'D',q:'Replacement tires should have a load index and speed rating that are:',o:['Equal to or greater than the original equipment specification','Any rating','Lower for a smoother ride','Only matched to the rear tires'],c:0,w:'Lower ratings can be unsafe and may not support the vehicle\'s weight or speed capability.'},
{t:'A4',a:'D',q:'A wheel wobbles side to side when spun. What is this called?',o:['Lateral runout','Radial runout','Static imbalance','Toe-out'],c:0,w:'Lateral runout is side-to-side wobble. Radial runout is out-of-round (up and down).'},
{t:'A4',a:'D',q:'What is the correct way to repair a tread puncture?',o:['A combination plug-patch installed from inside the tire','An outside plug only','A patch on the sidewall','Tire sealant only'],c:0,w:'Industry procedure is to dismount the tire and install a plug-patch from inside. Sidewall and shoulder punctures aren\'t repairable.'},

/* ===== A5 ===== */
{t:'A5',a:'A',q:'After repeated hard stops on a long downhill, the pedal goes spongy and braking fades. What is the likely cause?',o:['Brake fluid boiling (vapor) and/or overheated friction material','A failed booster','Master cylinder bypass','ABS fault'],c:0,w:'Moisture-laden fluid boils at a lower temperature. Vapor compresses, so the pedal goes spongy.'},
{t:'A5',a:'A',q:'How should a section of steel brake line be replaced?',o:['With approved steel brake tubing using double or ISO bubble flares','With compression fittings','With copper tubing','With rubber hose'],c:0,w:'Brake lines must handle high pressure. Compression fittings and copper aren\'t acceptable.'},
{t:'A5',a:'A',q:'How should a vacuum booster check valve be tested?',o:['It should allow airflow in one direction only','It should flow both ways','It should block flow both ways','It isn\'t testable'],c:0,w:'It holds vacuum in the booster when engine vacuum drops.'},
{t:'A5',a:'A',q:'A hiss is heard from under the dash when the brake pedal is held down, and the engine idle stumbles. What is the most likely cause?',o:['Leaking booster diaphragm','Air in the lines','Worn pads','Bad ABS sensor'],c:0,w:'A torn diaphragm leaks vacuum into the cabin side and creates a vacuum leak at the engine.'},
{t:'A5',a:'A',q:'Technician A says the brake fluid level drops gradually as pads wear. Technician B says a low level should prompt an inspection for leaks and pad wear before topping off. Who is correct?',o:[TA,TB,BOTH,NEI],c:2,w:'Caliper pistons move out as the pads wear, which draws fluid from the reservoir. Low fluid is a reason to inspect.'},
{t:'A5',a:'A',q:'Which tools can test brake fluid condition?',o:['Fluid test strips or a boiling-point tester','A hydrometer for battery acid','A vacuum gauge','A test light'],c:0,w:'Strips check copper content, which indicates corrosion inhibitor depletion. Boiling-point testers measure moisture effects.'},
{t:'A5',a:'A',q:'Unless the manufacturer says otherwise, the typical manual bleeding sequence starts at:',o:['The wheel farthest from the master cylinder','The closest wheel','The front wheels','Any wheel'],c:0,w:'Commonly RR, LR, RF, LF. Always check service info, since diagonal-split and ABS systems may differ.'},
{t:'A5',a:'A',q:'The brake lights stay on and cruise control won\'t engage. What is the most likely cause?',o:['A misadjusted or faulty brake light switch','A failed booster','Low fluid','A worn rotor'],c:0,w:'The switch also tells the cruise control and other modules that the brake is applied.'},
{t:'A5',a:'A',q:'A new brake hose is installed twisted. What can happen?',o:['The hose can be stressed, rub and fail early','Better flow','Nothing','The ABS light comes on'],c:0,w:'Check the hose for twists and clearance through full steering and suspension travel.'},
{t:'A5',a:'A',q:'The first stop after the vehicle sits overnight has a hard pedal. Later stops are normal. What is the most likely cause?',o:['A leaking booster check valve that doesn\'t hold vacuum reserve','Air in the lines','Worn pads','Seized caliper'],c:0,w:'Vacuum should be stored in the booster. A leaky check valve lets it bleed off overnight.'},
{t:'A5',a:'B',q:'When relining drum brakes, which hardware should be replaced?',o:['The return and hold-down springs, which weaken with heat','Only the shoes','The drums every time','The backing plate'],c:0,w:'Heat-fatigued springs cause drag and poor adjustment.'},
{t:'A5',a:'B',q:'An out-of-round rear drum most commonly causes:',o:['Pedal pulsation (and parking brake lever pulsing)','A spongy pedal','A brake pull only when turning','An ABS light'],c:0,w:'Measure drum diameter at several points.'},
{t:'A5',a:'B',q:'Where the drum brake shoes touch the backing plate pads, apply:',o:['A thin film of high-temperature brake lubricant','Engine oil','Nothing','Brake fluid'],c:0,w:'This prevents squeaks and sticking. Keep lubricant off the linings.'},
{t:'A5',a:'C',q:'A brake pad wear warning light comes on. What is the correct repair?',o:['Replace the pads and the wear sensor (sensors are often one-time-use)','Reset the light','Replace the rotor only','Bleed the brakes'],c:0,w:'Many sensors wear through when contacting the rotor and must be replaced with the pads.'},
