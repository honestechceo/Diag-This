<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Check Engine — ASE Prep</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#121417;--panel:#1c1f23;--panel2:#24282d;--line:#33383f;--text:#e9ebee;--muted:#9aa1ab;--yellow:#f5c518;--green:#7dfc9a;--red:#ff5a4e}
*{box-sizing:border-box}
html,body{margin:0;background:radial-gradient(ellipse at top,#1d2228,#0e1012 60%);background-attachment:fixed;color:var(--text);font-family:Barlow,system-ui,sans-serif;font-size:16px}
button{font-family:inherit;cursor:pointer}
.wrap{max-width:720px;margin:0 auto;padding:10px 12px 40px}
.hazard{height:6px;background:repeating-linear-gradient(-45deg,var(--yellow) 0 12px,#111 12px 24px);border-radius:3px}
.back{display:inline-block;color:var(--yellow);text-decoration:none;font:600 13px "JetBrains Mono";margin:8px 0 0;background:none;border:0;padding:0}
h1{overflow-wrap:anywhere;font-family:"Barlow Condensed";font-size:30px;text-transform:uppercase;margin:6px 0 2px;line-height:1}
h1 span{color:var(--yellow)}
h2{font-family:"Barlow Condensed";font-size:24px;text-transform:uppercase;margin:0}
.sub{color:var(--muted);font-size:14px;line-height:1.45;margin:4px 0 10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0}
.test{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:8px;color:var(--text)}
.test:hover{border-color:var(--yellow)}
.badge{flex:none;width:50px;height:50px;border-radius:10px;background:#111418;border:2px solid var(--yellow);display:flex;align-items:center;justify-content:center;font:700 18px "JetBrains Mono";color:var(--yellow)}
.test b{font-family:"Barlow Condensed";font-size:19px;text-transform:uppercase;display:block;overflow-wrap:anywhere}
.test small{color:var(--muted);font-size:12.5px}
.prog{height:6px;background:#2a2e33;border-radius:4px;margin-top:6px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--green)}
.pct{margin-left:auto;font:700 14px "JetBrains Mono";color:var(--green);flex:none}
.area{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.area:last-child{border:0}
.area .n{font:600 12px "JetBrains Mono";color:var(--muted);white-space:nowrap}
.area button{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:7px 10px;font-size:13px;font-weight:600;white-space:nowrap}
.big{display:block;width:100%;background:var(--yellow);color:#111;border:0;border-radius:10px;padding:14px;font-family:"Barlow Condensed";font-weight:700;font-size:20px;text-transform:uppercase;margin-top:10px;text-align:center;text-decoration:none}
.ghost{display:block;width:100%;background:transparent;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:15px;margin-top:8px;text-align:center;text-decoration:none}
.qhead{display:flex;justify-content:space-between;font:600 12px "JetBrains Mono";color:var(--muted);margin:10px 0 6px}
.qtext{font-size:18px;line-height:1.45;font-weight:500}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:13px 12px;font-size:16px;line-height:1.35;margin-top:8px}
.opt .l{flex:none;width:24px;height:24px;border-radius:6px;background:#111418;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font:700 12px "JetBrains Mono";color:var(--yellow)}
.opt:hover:not(:disabled){border-color:var(--yellow)}
.opt.right{border-color:var(--green);background:#16301f}.opt.wrong{border-color:var(--red);background:#3a1b18}
.opt:disabled{cursor:default}
.why{background:#111418;border-left:4px solid var(--yellow);border-radius:8px;padding:10px 12px;margin-top:10px;line-height:1.5;font-size:15px;color:#d5d9de}
.why b.ok{color:var(--green)}.why b.no{color:var(--red)}
.score{font-family:"Barlow Condensed";font-size:56px;font-weight:700;line-height:1}
.res td{padding:7px 4px;border-bottom:1px solid var(--line);font-size:14px}
.res{width:100%;border-collapse:collapse}
.note{color:#6c747e;font-size:12px;line-height:1.45;margin-top:14px}
.lablink{display:flex;gap:10px;align-items:center;text-decoration:none;color:var(--text);background:#1e2a22;border:1px solid #2f5a3d;border-radius:10px;padding:10px 12px;margin-top:8px;font-size:14px}
.lablink b{color:var(--green)}
.hidden{display:none!important}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.feat{text-align:left;background:linear-gradient(#262a30,#1c1f23);border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--text)}
.feat:hover:not(:disabled){border-color:var(--yellow)}
.feat:disabled{opacity:.45}
.feat b{display:block;font-family:"Barlow Condensed";font-size:19px;text-transform:uppercase;color:var(--yellow)}
.feat span{font-size:12.5px;color:var(--muted);line-height:1.35;display:block;margin-top:2px}
.flagB{background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:4px 9px;font:600 12px "JetBrains Mono"}
.flagB.on{color:var(--yellow);border-color:var(--yellow)}
.qhead{align-items:center}
.opt.sel{border-color:var(--yellow);background:#3a3410}
.examBar{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;gap:8px;background:#0b0d10;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:700 13px "JetBrains Mono";margin-top:6px}
.examBar #timer{color:var(--yellow)}
.navRow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.navRow .ghost{margin-top:0}
.ghost:disabled{opacity:.4}
.qgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.qgrid button{background:#16301f;border:1px solid #2f6b45;color:var(--text);border-radius:8px;padding:10px 0;font:700 13px "JetBrains Mono"}
.qgrid button.un{background:transparent;border-color:var(--line)}
.qgrid button.fl{background:#3a3410;border-color:var(--yellow)}
.topnav{display:flex;gap:6px;overflow-x:auto;margin:8px 0 4px;scrollbar-width:none}
.topnav::-webkit-scrollbar{display:none}
.topnav a{flex:none;text-decoration:none;color:#cfd3d8;background:#1c1f23;border:1px solid #33383f;border-radius:20px;padding:7px 12px;font:600 13px Barlow,system-ui,sans-serif}
.topnav a.on{background:#f5c518;color:#111;border-color:#f5c518}

/* 2026 workshop redesign */
:root{--bg:#090d13;--panel:#151c27;--panel2:#1d2836;--line:#304053;--text:#f2f6fc;--muted:#a5b4c7;--yellow:#ffca45;--green:#62e8b2;--red:#ff7777}
html,body{background:radial-gradient(ellipse at 60% -10%,#1a3145 0,#0c1420 45%,#090d13 100%);color:var(--text)}
.wrap{max-width:880px;padding:14px clamp(12px,3vw,28px) 60px}
.hazard{height:4px;border-radius:10px}
h1{font-size:clamp(36px,6vw,52px);letter-spacing:.02em;margin-top:16px}
h2{letter-spacing:.02em}
.card,.test,.feat{background:linear-gradient(145deg,#1b2837,#111a26);border-color:#314357;box-shadow:0 10px 30px #0002}
.card{padding:18px;border-radius:16px}.test{padding:16px;border-radius:16px;transition:transform .15s,border-color .15s}.test:hover{transform:translateY(-2px)}
.badge{border-radius:12px;background:#0c1521;box-shadow:inset 0 0 16px #ffca4510}
.feat{padding:18px;min-height:104px;border-radius:16px;transition:transform .15s}.feat:hover:not(:disabled){transform:translateY(-2px)}
.feat b{font-size:23px}.feat span{font-size:13px;line-height:1.5}
.big{background:linear-gradient(120deg,#ffd66b,#f5b829);box-shadow:0 5px 20px #f5c51825}
.big,.ghost,.opt{transition:border-color .15s,transform .15s}.big:hover,.ghost:hover:not(:disabled){transform:translateY(-1px)}
.opt{padding:16px;border-radius:12px}.opt:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}
.sub{color:var(--muted)}.topnav a{background:#182331;border-color:#304053}.topnav a.on{background:var(--yellow);border-color:var(--yellow)}
.hero{padding:22px;margin:12px 0 18px;background:linear-gradient(115deg,#1d3447,#121c2b 70%);border:1px solid #35516a;border-radius:20px}
.hero h1{margin:0 0 8px}.hero .sub{margin:0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 18px}
.stat{padding:14px;background:#131e2c;border:1px solid var(--line);border-radius:14px;text-align:center}.stat strong{display:block;color:var(--yellow);font:700 24px 'JetBrains Mono',monospace}.stat small{color:var(--muted)}
.difficulty{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 16px}.difficulty button{padding:13px 8px;border:1px solid #40536b;background:#1b293a;color:var(--text);border-radius:12px;font-weight:700}.difficulty button.active{border-color:var(--yellow);background:#403516;color:var(--yellow)}.difficulty small{display:block;color:var(--muted);font-size:11px;margin-top:4px;font-weight:400}
@media(max-width:440px){.stats{gap:5px}.stat{padding:10px 5px}.stat strong{font-size:19px}.difficulty{gap:5px}.difficulty button{font-size:12px}.grid2{gap:8px}.feat{padding:13px}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const TESTS={
A1:{name:'Engine Repair',scored:50,time:75,lab:null,areas:{A:['General Engine Diagnosis',15],B:['Cylinder Head & Valve Train',10],C:['Engine Block',10],D:['Lubrication & Cooling Systems',8],E:['Fuel, Electrical, Ignition & Exhaust Inspection',7]}},
A2:{name:'Automatic Transmission/Transaxle',scored:50,time:75,lab:null,areas:{A:['General Diagnosis (mechanical/hydraulic & electronic)',25],B:['In-Vehicle Maintenance & Repair',12],C:['Off-Vehicle Repair',13]}},
A3:{name:'Manual Drive Train & Axles',scored:40,time:60,lab:null,areas:{A:['Clutch',6],B:['Transmission',7],C:['Transaxle',7],D:['Drive Shafts, U-Joints & CV Joints',5],E:['Drive Axles',7],F:['4WD / AWD Components',8]}},
A4:{name:'Suspension & Steering',scored:40,time:60,lab:null,areas:{A:['Steering Systems',12],B:['Suspension Systems',12],C:['Wheel Alignment',11],D:['Wheels & Tires',5]}},
A5:{name:'Brakes',scored:45,time:75,lab:['quick.html','Quick diagnosis (brake jobs)'],areas:{A:['Hydraulic, Power Assist & Parking Brake',19],B:['Drum Brakes',5],C:['Disc Brakes',11],D:['Electronic Brake Controls (ABS/TCS/ESC)',10]}},
A6:{name:'Electrical/Electronic Systems',scored:50,time:90,lab:['fan.html','Cooling Fan Circuit Lab'],areas:{A:['General Electrical/Electronic Diagnosis',13],B:['Battery & Starting',9],C:['Charging',5],D:['Lighting',6],E:['Body Electrical',17]}},
A7:{name:'Heating & Air Conditioning',scored:50,time:75,lab:['fan.html','Cooling Fan Circuit Lab'],areas:{A:['HVAC & Engine Cooling Service/Diagnosis',21],B:['Refrigeration System Components',10],C:['Operating Systems & Controls',19]}},
A8:{name:'Engine Performance',scored:50,time:75,lab:['ign.html','Ignition Circuit Lab'],areas:{A:['General Diagnosis',12],B:['Ignition System',8],C:['Fuel, Air Induction & Exhaust',9],D:['Emissions Control',8],E:['Computerized Engine Controls',13]}},
};
const TA='Technician A only',TB='Technician B only',BOTH='Both A and B',NEI='Neither A nor B';
const Q=[
/* ===== A1 ===== */
{t:'A1',a:'A',q:'A compression test shows 85 psi on cylinder 3 and 160–165 psi on the others. After adding a teaspoon of oil, cylinder 3 rises to 150 psi. What is the most likely cause?',o:['Burned exhaust valve','Worn piston rings on cylinder 3','Head gasket leak between two cylinders','Worn camshaft lobe'],c:1,w:'Oil temporarily seals the rings. A big rise on the wet test points to worn rings. A burned valve or a gasket leak would not improve much with oil.'},
{t:'A1',a:'A',q:'During a cylinder leakage test, air is heard escaping from the tailpipe. Which part is leaking?',o:['Intake valve','Exhaust valve','Piston rings','Head gasket'],c:1,w:'Air from the tailpipe means it is getting past the exhaust valve. Air from the throttle body means intake valve, air from the oil fill means rings, and bubbles in the radiator mean head gasket or a cracked head.'},
{t:'A1',a:'A',q:'Bubbles appear in the radiator filler neck while a cylinder leakage test is performed on one cylinder. What is the most likely cause?',o:['Leaking water pump seal','Stuck-closed thermostat','Head gasket failure or cracked head','Worn intake valve guide'],c:2,w:'Combustion-chamber air reaching the cooling system means a breach between the chamber and a coolant passage: a head gasket or a crack.'},
{t:'A1',a:'B',q:'Technician A says valve springs should be checked for squareness and free length. Technician B says spring pressure should be tested at the specified installed height. Who is correct?',o:[TA,TB,BOTH,NEI],c:2,w:'Both checks are part of normal valve spring inspection.'},
{t:'A1',a:'B',q:'An engine puffs blue smoke for a few seconds after a cold start, then clears up. What is the most likely cause?',o:['Worn valve stem seals or guides','Leaking head gasket','Rich fuel mixture','Stuck-open thermostat'],c:0,w:'Oil seeps past worn valve seals and guides while the engine sits, then burns off at startup. Rings usually smoke under load or deceleration, not just at startup.'},
{t:'A1',a:'C',q:'Cylinder taper is found by comparing bore measurements taken:',o:['At the top and bottom of ring travel','Parallel and perpendicular to the crankshaft','Between two different cylinders','Before and after honing'],c:0,w:'Taper is the difference top-to-bottom of ring travel. Out-of-round is the difference between measurements taken parallel and perpendicular to the crank.'},
{t:'A1',a:'C',q:'Technician A says Plastigage is placed on a clean, dry journal and the cap is torqued without turning the crank. Technician B says the wider the flattened Plastigage, the greater the bearing clearance. Who is correct?',o:[TA,TB,BOTH,NEI],c:0,w:'Technician A is right. A wider strip means it got squeezed more, which means less clearance, so Technician B is wrong.'},
{t:'A1',a:'D',q:'Oil pressure is normal on a cold engine but drops very low at hot idle. What is the most likely cause?',o:['Pressure relief valve stuck closed','Worn main and rod bearings','Clogged PCV valve','Overfilled crankcase'],c:1,w:'Excessive bearing clearance bleeds off pressure, and it gets worse as the oil thins out when hot. A relief valve stuck closed would cause high pressure.'},
{t:'A1',a:'D',q:'An engine is slow to warm up, heater output is weak, and code P0128 is set. What is the most likely cause?',o:['Thermostat stuck open','Thermostat stuck closed','Low oil level','Restricted radiator'],c:0,w:'P0128 means coolant temperature is below the thermostat regulating temperature, which is typical of a thermostat stuck open.'},
{t:'A1',a:'E',q:'An engine vacuum reading starts normal at 2,500 rpm and slowly drops the longer the rpm is held. What does this indicate?',o:['Burned valve','Restricted exhaust','Vacuum leak','Late ignition timing'],c:1,w:'Exhaust backpressure builds up when the exhaust can\'t flow freely, so vacuum slowly falls while rpm is held. A clogged catalytic converter is the classic cause.'},
/* ===== A2 ===== */
{t:'A2',a:'A',q:'A stall test shows engine rpm well above specification in both Drive and Reverse. What is the most likely cause?',o:['Engine performance problem','Torque converter stator clutch slipping','Low line pressure or a slipping component common to both ranges','Restricted exhaust'],c:2,w:'High stall rpm means something is slipping. When both D and R are high, look at things they share, such as line pressure (pump, filter, regulator). Low stall rpm points to engine power or the stator clutch.'},
{t:'A2',a:'A',q:'Transmission fluid is dark with a burnt smell and the pan has friction material in it. What does this indicate?',o:['Normal wear','Internal clutch or band wear from slipping or overheating','A leaking cooler line','Wrong fluid type only'],c:1,w:'Burnt fluid and friction debris point to clutches or bands that slipped and overheated.'},
{t:'A2',a:'A',q:'A shift solenoid with a resistance spec of 10–15 Ω measures 2 Ω. What is the condition?',o:['Open winding','Shorted winding','Normal','High-resistance connection'],c:1,w:'Far below spec means turns of the coil are shorted together. An open winding would read OL (infinite).'},
{t:'A2',a:'A',q:'At about 45 mph a car shudders like driving over rumble strips. The shudder stops when the brake pedal is tapped lightly. What is the most likely cause?',o:['Worn engine mounts','Torque converter clutch (TCC) apply shudder','Unbalanced tires','Worn CV joints'],c:1,w:'Tapping the brake disengages the TCC. If the shudder stops, the TCC apply is the problem. Check fluid condition first.'},
{t:'A2',a:'B',q:'Technician A says most automatic transmissions are checked cold with the engine off. Technician B says to follow the manufacturer procedure, which is usually hot, engine running, in Park or Neutral. Who is correct?',o:[TA,TB,BOTH,NEI],c:1,w:'Fluid expands when hot, and most procedures specify operating temperature with the engine running. Always follow the service information.'},
{t:'A2',a:'B',q:'Line pressure is low in all ranges. Which is the most likely cause?',o:['Leaking reverse clutch seal','Clogged transmission filter','Worn 3rd gear band','Faulty vehicle speed sensor'],c:1,w:'A problem in all ranges points to the pressure source: a clogged filter or worn pump. A single clutch leak would only drop pressure in the ranges that use that clutch.'},
{t:'A2',a:'C',q:'Clutch pack clearance on a rebuilt transmission is usually adjusted by:',o:['Changing the number of springs','Using a selective-thickness snap ring or pressure plate','Increasing line pressure','Grinding the steel plates'],c:1,w:'Clearance is measured with a feeler gauge and corrected with selective snap rings or pressure plates.'},
{t:'A2',a:'C',q:'During an air pressure test of a clutch circuit, you hear a hiss and the clutch does not apply. What does this indicate?',o:['Normal operation','A leaking seal or passage','A stuck accumulator','Correct clutch clearance'],c:1,w:'A good circuit gives a dull thud as the piston applies. A hiss without apply means air (and fluid) is leaking past a seal or out of a passage.'},
{t:'A2',a:'A',q:'Engagement into Drive is delayed when cold but normal once warm. Fluid level is correct. What is the most likely cause?',o:['Hardened piston seals','Worn torque converter','Misadjusted range sensor','Faulty output speed sensor'],c:0,w:'Hard seals leak until they warm up and soften, which delays clutch apply.'},
{t:'A2',a:'A',q:'The engine will not crank in Park, but cranks in Neutral. What is the most likely cause?',o:['Weak battery','Misadjusted or faulty transmission range sensor','Bad starter relay','Open fusible link'],c:1,w:'The range sensor (neutral safety switch) allows cranking in P and N. Cranking in only one of them points to its adjustment or contacts.'},
/* ===== A3 ===== */
{t:'A3',a:'A',q:'A clutch slips under hard acceleration. Technician A says there may be no pedal free play. Technician B says the disc may be soaked with oil. Who is correct?',o:[TA,TB,BOTH,NEI],c:2,w:'No free play keeps the release bearing partly applied, and oil on the disc lowers friction. Either one causes slipping.'},
{t:'A3',a:'A',q:'A noise is heard only while the clutch pedal is pressed down. What is the most likely source?',o:['Input shaft bearing','Release (throwout) bearing','Countershaft bearing','Reverse idler gear'],c:1,w:'The release bearing only spins under load when the pedal is pressed. A noise in neutral with the pedal released (that goes away when pressed) points to the input shaft bearing.'},
{t:'A3',a:'B',q:'Gears clash when shifting into 2nd, even with the clutch pedal pressed all the way down. What is the most likely cause?',o:['Worn 2nd-gear synchronizer blocker ring','Low fluid level only','Worn U-joint','Misadjusted shift linkage only'],c:0,w:'The synchronizer matches gear speeds before engagement. A worn blocker ring can\'t do that, so the gears clash.'},
{t:'A3',a:'B',q:'A manual transmission jumps out of 3rd gear when decelerating. What is the most likely cause?',o:['Worn clutch teeth on the gear or synchronizer sleeve','Low clutch pedal height','Worn release bearing','Leaking rear seal'],c:0,w:'Worn or tapered engagement teeth (and weak detents or excessive end play) let the sleeve walk off the gear under load changes.'},
{t:'A3',a:'D',q:'A front-wheel-drive car makes a clicking noise during sharp turns. What is the most likely cause?',o:['Inner CV joint','Outer CV joint','Wheel bearing','Differential side gears'],c:1,w:'The outer joint runs at steep angles when turning. A worn outer joint clicks during sharp turns. Inner joints more often cause shudder during acceleration.'},
{t:'A3',a:'D',q:'A rear-wheel-drive truck clunks when shifted from Drive to Reverse. Which should be inspected?',o:['U-joints and driveline backlash','Front wheel bearings','Tie-rod ends','Brake rotors'],c:0,w:'Worn U-joints or too much backlash in the driveline or axle cause a clunk when torque changes direction.'},
{t:'A3',a:'E',q:'Ring gear backlash is measured with a dial indicator on a ring gear tooth. How is backlash usually adjusted?',o:['By changing the pinion bearing preload','By moving the ring gear sideways with side-bearing shims or adjusters','By changing the ring gear bolts','By changing the gear oil viscosity'],c:1,w:'Moving the ring gear toward or away from the pinion with side-bearing shims or adjusters changes backlash.'},
{t:'A3',a:'E',q:'A limited-slip rear axle chatters on tight turns after a fluid change. What is the most likely cause?',o:['Worn pinion bearing','Missing friction modifier or wrong fluid','Low tire pressure','Worn axle bearing'],c:1,w:'Clutch-type limited-slip units need a friction modifier. Without it, the clutches stick and slip, which causes chatter.'},
{t:'A3',a:'F',q:'An AWD vehicle needs one tire replaced. What should the technician consider?',o:['Any tire size is fine','Matching tire circumference / tread depth across all tires','Only matching the brand','Only the rear tires matter'],c:1,w:'Different rolling diameters force the center coupling or transfer case to slip all the time, which can overheat and damage it. Match tires within the manufacturer\'s tread depth limit.'},
{t:'A3',a:'C',q:'A FWD car hums at highway speed. The hum changes with speed (not engine rpm) and gets louder when turning one direction. What is the most likely cause?',o:['Transaxle final drive','A wheel bearing','Inner CV joint','Clutch release bearing'],c:1,w:'Turning loads the outer wheel bearing. If the noise changes with turns, a wheel bearing is the likely cause.'},
/* ===== A4 ===== */
{t:'A4',a:'C',q:'Tires show a feathered wear pattern across the tread. Which alignment angle is most likely out of spec?',o:['Caster','Toe','Steering axis inclination','Thrust angle'],c:1,w:'Incorrect toe scrubs the tire sideways and leaves a feathered edge across the tread. Camber wear shows up on one shoulder.'},
{t:'A4',a:'C',q:'Left caster is +4.0° and right caster is +2.5°. Which way will the vehicle tend to pull?',o:['Left','Right','No pull','Pulls only when braking'],c:1,w:'A vehicle pulls toward the side with less positive caster (and toward the side with more positive camber).'},
{t:'A4',a:'C',q:'How is thrust angle corrected on a vehicle with adjustable rear suspension?',o:['Adjusting front toe','Adjusting rear toe','Adjusting front caster','Rotating the tires'],c:1,w:'Thrust angle is the direction the rear axle points. Set rear toe first, then align the front to the thrust line.'},
{t:'A4',a:'B',q:'A vehicle keeps bouncing after going over a bump. What is the most likely cause?',o:['Worn shock absorbers or struts','Worn tie-rod ends','Incorrect toe','Low power steering fluid'],c:0,w:'Shocks dampen spring oscillation. Worn units let the body keep bouncing.'},
{t:'A4',a:'B',q:'One corner of a vehicle sits noticeably lower than the others. What should the technician check first?',o:['Wheel alignment','Ride height and the spring at that corner','Tire balance','Steering gear'],c:1,w:'Measure ride height against spec. A weak or broken spring is the usual cause, and ride height affects every alignment angle.'},
{t:'A4',a:'A',q:'Power steering groans loudest at full lock, and the fluid looks foamy. What is the most likely cause?',o:['Air in the system or low fluid','Worn tie-rod ends','Incorrect toe','Worn ball joints'],c:0,w:'Air in the fluid causes foaming and pump noise. Find the leak, top off and bleed the system.'},
{t:'A4',a:'A',q:'After an alignment, the vehicle tracks straight but the steering wheel is off-center. How should this be corrected?',o:['Adjust caster on one side','Turn both tie-rod adjusters equally in the same direction','Adjust only the left tie rod','Re-index the steering wheel on its splines'],c:1,w:'Turning both tie rods equally in the same direction centers the wheel without changing total toe.'},
{t:'A4',a:'A',q:'After a battery replacement, a vehicle with electric power steering (EPS) has a warning light and uneven assist. What is the most likely fix?',o:['Replace the EPS motor','Perform steering angle sensor / EPS relearn','Flush the steering fluid','Replace the steering rack'],c:1,w:'Many EPS systems lose their steering angle zero point after a power loss and need a calibration with a scan tool or a specific procedure.'},
{t:'A4',a:'D',q:'A wheel-and-tire assembly has too much radial runout, even though it balances fine. What is the best fix?',o:['Add more wheel weights','Match-mount the tire on the wheel','Increase tire pressure','Rotate the tires front to rear'],c:1,w:'Match mounting lines up the tire\'s high spot with the wheel\'s low spot to cancel runout. Balancing can\'t fix runout.'},
{t:'A4',a:'D',q:'After a tire rotation, the TPMS shows pressures at the wrong positions. What is needed?',o:['Replace all sensors','Perform a TPMS sensor relearn','Reset the odometer','Rebalance the wheels'],c:1,w:'Direct TPMS systems that show each tire\'s location need a relearn after rotation so the module knows where each sensor is.'},
/* ===== A5 ===== */
{t:'A5',a:'A',q:'The brake pedal is spongy but firms up when pumped. What is the most likely cause?',o:['Air in the hydraulic system','Master cylinder internal bypass','Failed vacuum booster','Worn pads'],c:0,w:'Air compresses, so the pedal feels spongy. Pumping takes up the slack. Bleed the system.'},
{t:'A5',a:'A',q:'Engine off: pump the pedal to use up the vacuum reserve. Hold steady pressure on the pedal and start the engine. The pedal does not drop. What does this indicate?',o:['Normal booster operation','Faulty booster or vacuum supply','Air in the lines','Master cylinder bypass'],c:1,w:'With a working booster, the pedal drops slightly when vacuum arrives. No drop means no assist: check the vacuum hose, check valve and booster.'},
{t:'A5',a:'A',q:'The pedal is firm at first but slowly sinks under steady pressure. There are no external leaks. What is the most likely cause?',o:['Air in the lines','Master cylinder internal bypass','Seized caliper','Weak booster'],c:1,w:'With no leaks and a full reservoir, fluid is slipping past the master cylinder\'s internal seals.'},
{t:'A5',a:'A',q:'Brake fluid is found contaminated with petroleum-based fluid. What is the correct repair?',o:['Flush with fresh DOT 3','Replace all rubber hydraulic components and flush','Replace only the master cylinder','Add fluid conditioner'],c:1,w:'Petroleum makes brake rubber swell. Every seal, hose and rubber part in the system has to be replaced, and the lines flushed.'},
{t:'A5',a:'C',q:'Pedal pulsation during braking is most commonly caused by:',o:['Worn pads','Excessive rotor lateral runout or thickness variation','Air in the system','Low fluid'],c:1,w:'Runout eventually causes uneven rotor thickness, which pushes the pistons back and forth and pulses the pedal.'},
{t:'A5',a:'C',q:'A vehicle pulls to the LEFT only when braking. Which is a likely cause?',o:['Left caliper piston seized and not applying','Right caliper piston seized and not applying','Low left tire pressure only when braking','Worn right outer tie rod only'],c:1,w:'If the right caliper does not apply, the left brake does more of the work and the car pulls left.'},
{t:'A5',a:'C',q:'Technician A says rotors may be machined down to the discard thickness. Technician B says they must be at or above the minimum refinish thickness after machining. Who is correct?',o:[TA,TB,BOTH,NEI],c:1,w:'Discard thickness is the wear limit while in service. After machining, a rotor must still be at or above minimum refinish thickness.'},
{t:'A5',a:'B',q:'On most duo-servo drum brakes, the self-adjuster works when:',o:['Braking while moving forward','Braking while moving in reverse','Applying the parking brake on all designs','Accelerating'],c:1,w:'On most duo-servo designs, the adjuster lever operates during reverse stops. Some designs adjust with the parking brake, so check service info.'},
{t:'A5',a:'D',q:'ABS activates at very low speed on one wheel during a normal stop. What is the most likely cause?',o:['Low brake fluid','Damaged tone ring or excessive sensor air gap at that wheel','Faulty brake light switch','Worn pads'],c:1,w:'A weak or erratic wheel speed signal makes that wheel look like it\'s locking. Check the tone ring, air gap and sensor wiring.'},
{t:'A5',a:'D',q:'After a wheel alignment, the electronic stability control (ESC) light stays on. What is the most likely fix?',o:['Replace the ABS module','Calibrate the steering angle sensor','Bleed the brakes','Replace the yaw sensor'],c:1,w:'ESC compares steering angle with yaw rate. After an alignment, the steering angle sensor often needs recalibration.'},
/* ===== A6 ===== */
{t:'A6',a:'A',q:'A 12 V circuit has a total resistance of 4 Ω. How much current flows?',o:['0.33 A','3 A','16 A','48 A'],c:1,w:'Ohm\'s law: I = E ÷ R = 12 ÷ 4 = 3 A.'},
{t:'A6',a:'A',q:'A lamp won\'t light. With the switch on, 12 V is measured at the lamp\'s power terminal and 12 V at its ground terminal (black lead on battery negative). What is the most likely cause?',o:['Open filament','Open in the ground circuit','Blown fuse','Open switch'],c:1,w:'Voltage passes through the good filament to the ground terminal. 12 V on the ground side means the ground path is open, so no current flows.'},
{t:'A6',a:'A',q:'While cranking, 0.8 V is measured from the battery negative post to the engine block. What does this indicate?',o:['Normal reading','Excessive resistance in the ground circuit','Weak battery','Faulty starter solenoid'],c:1,w:'Ground-side voltage drop should be very low, generally around 0.2 V or less. 0.8 V means a poor ground connection or cable.'},
{t:'A6',a:'A',q:'The cooling fan relay clicks when commanded on. 12 V is present at relay pin 30, but pin 87 reads 0 V. What is the most likely cause?',o:['Open relay coil','Burnt relay contacts','Blown fan fuse','Open fan ground'],c:1,w:'A click means the coil works. Power in at 30 with nothing out at 87 means the contacts aren\'t closing. Try this in the Fan Circuit Lab.'},
{t:'A6',a:'A',q:'What is the correct way to measure parasitic battery draw?',o:['Measure immediately after shutting the doors','Connect an ammeter in series and wait for the modules to go to sleep','Measure voltage across the battery','Disconnect all fuses first'],c:1,w:'Modules stay awake for a while after shutdown. Measure in series once they sleep. Typical specs are about 50 mA or less, but check the service information.'},
{t:'A6',a:'B',q:'During a battery load test at about 70°F, what is the minimum acceptable voltage at the end of 15 seconds?',o:['8.5 V','9.6 V','10.5 V','12.4 V'],c:1,w:'Load to half the CCA rating for 15 seconds. The voltage should stay at or above 9.6 V at about 70°F (the spec is lower when the battery is colder).'},
{t:'A6',a:'B',q:'The engine cranks slowly, and starter current draw is lower than specification. What is the most likely cause?',o:['Engine mechanical bind','Shorted starter armature','High resistance in the starter circuit','Too much ignition advance'],c:2,w:'Low current with slow cranking means something is restricting current flow: corroded cables or connections, or a bad solenoid contact. High current points to a bind or a shorted starter.'},
{t:'A6',a:'C',q:'An alternator shows more than 0.5 V AC ripple at the battery. What is the most likely cause?',o:['Faulty diode in the rectifier','Loose belt','Weak battery','Corroded battery terminal'],c:0,w:'A bad diode lets AC through to the system. 0.5 V AC is a common fail point, and many newer vehicles specify much less (around 0.1 V AC). Excess ripple can cause flickering lights and module or network problems.'},
{t:'A6',a:'C',q:'Charging voltage measures 15.6 V at 2,000 rpm. What is the most likely cause?',o:['Faulty voltage regulator or regulator sense circuit','Slipping belt','Open diode','Weak battery'],c:0,w:'Overcharging means the regulator isn\'t controlling field current. Also check the regulator\'s voltage sense wiring for a bad connection.'},
{t:'A6',a:'D',q:'The left turn signal flashes much faster than normal. What is the most likely cause?',o:['Bad flasher','Burned-out bulb on the left side','Shorted turn signal switch','Blown fuse'],c:1,w:'With one bulb out, less current flows through the flasher. Most flashers and body modules respond by flashing noticeably faster (hyperflash). Some older thermal flashers may stay lit or stop flashing instead.'},
{t:'A6',a:'E',q:'With the battery disconnected, resistance between DLC pins 6 and 14 (CAN high/low) reads 120 Ω. What does this indicate?',o:['Normal','One terminating resistor or bus branch is open','Bus shorted to ground','Bus shorted to voltage'],c:1,w:'Two 120 Ω terminating resistors in parallel read about 60 Ω. A reading of 120 Ω means one resistor or its branch is open.'},
{t:'A6',a:'E',q:'Before servicing an airbag (SRS) component, the technician should:',o:['Unplug the airbag with the key on','Disconnect the battery and wait the time specified by the manufacturer','Probe the airbag connector with a test light','Remove the SRS fuse only'],c:1,w:'The SRS module stores reserve energy. Disconnect the battery and wait the specified time before disconnecting any SRS component. Never probe an airbag with a test light or ohmmeter.'},
/* ===== A7 ===== */
{t:'A7',a:'A',q:'The heater blows cold. Both heater hoses are hot. What is the most likely cause?',o:['Restricted heater core','Blend door stuck or actuator failed','Stuck-open thermostat','Low coolant'],c:1,w:'Hot coolant is flowing through the core, but the air isn\'t being directed across it. One hot hose and one cool hose would point to a restricted core.'},
{t:'A7',a:'A',q:'What is the most accurate way to check coolant freeze protection?',o:['Color of the coolant','A refractometer','Smell','A voltmeter in the coolant'],c:1,w:'A refractometer measures glycol concentration accurately. A voltmeter in the coolant checks for electrolysis, not freeze protection.'},
{t:'A7',a:'B',q:'The A/C blows warm. Low-side and high-side pressures are both lower than normal. What is the most likely cause?',o:['Overcharge','Undercharge (low refrigerant)','Restricted condenser airflow','Air in the system'],c:1,w:'Low pressure on both sides with poor cooling is classic low refrigerant. Find the leak before recharging.'},
{t:'A7',a:'B',q:'Low-side and high-side pressures are both higher than normal and cooling is poor. Which is the most likely cause?',o:['Undercharge','Condenser fan inoperative','Restricted orifice tube','Bad compressor clutch'],c:1,w:'Poor heat rejection at the condenser raises pressure on both sides. Check the fan and airflow, and look for overcharge.'},
{t:'A7',a:'B',q:'The low side drops into a vacuum, the high side is low, and frost forms at the expansion valve. What is the most likely cause?',o:['Overcharge','Restriction at the metering device (or moisture freezing)','Bad blower motor','Low compressor oil'],c:1,w:'A restriction starves the evaporator and the low side pulls into vacuum. Moisture can freeze at the valve. Replace the drier and evacuate thoroughly.'},
{t:'A7',a:'B',q:'Why should a refrigerant identifier be used before recovering refrigerant?',o:['To measure the oil level','To avoid contaminating the recovery equipment and supply','To find leaks','It is only needed for R-12'],c:1,w:'Mixed or contaminated refrigerant can ruin a recovery machine and its tank. Identify it first and handle contaminated refrigerant separately.'},
{t:'A7',a:'C',q:'The blower motor works only on HIGH. What is the most likely cause?',o:['Failed blower motor resistor','Bad blower motor','Blown blower fuse','Bad blower relay only'],c:0,w:'HIGH usually bypasses the resistor. Lower speeds go through it, so an open resistor kills only the lower speeds.'},
{t:'A7',a:'C',q:'The A/C compressor clutch slips and won\'t pull in fully. Technician A says the air gap may be too large. Technician B says the voltage at the clutch coil should be checked. Who is correct?',o:[TA,TB,BOTH,NEI],c:2,w:'An air gap out of spec or low coil voltage (high resistance in the feed or ground) both weaken the clutch\'s magnetic pull.'},
{t:'A7',a:'A',q:'Technician A says an R-1234yf system can be serviced with an R-134a recovery machine. Technician B says R-1234yf requires dedicated, certified equipment. Who is correct?',o:[TA,TB,BOTH,NEI],c:1,w:'R-1234yf is mildly flammable and needs equipment certified for it. Cross-using machines contaminates both refrigerants.'},
{t:'A7',a:'C',q:'Why does a low-pressure cutoff switch open?',o:['To cycle the condenser fan','To stop compressor operation when system pressure (charge) is too low','To turn on the blower','To control the blend door'],c:1,w:'Running the compressor with a low charge starves it of oil. The switch protects the compressor.'},
/* ===== A8 ===== */
{t:'A8',a:'A',q:'Short- and long-term fuel trims add up to +25% at idle and drop to +3% at 2,500 rpm. What is the most likely cause?',o:['Weak fuel pump','Vacuum leak','Dirty MAF sensor','Restricted fuel filter'],c:1,w:'Unmetered air matters most at low airflow (idle). A weak pump or clogged filter gets worse under load.'},
{t:'A8',a:'A',q:'At idle, the vacuum gauge needle drops 3–4 in. Hg at a steady, regular interval. What is the most likely cause?',o:['Late timing','Burned or leaking valve','Restricted exhaust','Vacuum leak'],c:1,w:'A regular drop happens every time the bad cylinder\'s valve should seal. A steady low reading points to late timing or a leak.'},
{t:'A8',a:'B',q:'A secondary ignition waveform shows a very high firing line on one cylinder. What is the most likely cause?',o:['Fouled spark plug','Excessive plug gap or open plug wire','Rich mixture','Shorted coil'],c:1,w:'High resistance in the secondary (wide gap, open wire) needs more voltage to fire. A fouled plug gives a LOW firing line. Try it in the Ignition Lab.'},
{t:'A8',a:'B',q:'Cylinder 2 is misfiring (P0302). After swapping coil 2 with coil 3, the code changes to P0303. What is the most likely cause?',o:['Bad spark plug 2','Bad coil','Injector 2','Low compression in cylinder 2'],c:1,w:'The misfire followed the coil.'},
{t:'A8',a:'C',q:'On a return-type fuel system, fuel pressure is low but rises to spec when the return line is briefly pinched. What is the most likely cause?',o:['Weak fuel pump','Faulty pressure regulator','Clogged filter','Leaking injector'],c:1,w:'Blocking the return raises pressure, so the pump can supply it. The regulator is bleeding off too much.'},
{t:'A8',a:'C',q:'During an injector balance test, one injector shows much less pressure drop than the others. What does this indicate?',o:['Leaking injector','Restricted injector','Normal','Leaking pressure regulator'],c:1,w:'Less pressure drop means less fuel flowed through that injector, so it\'s restricted. Too much drop would mean a rich or leaking injector.'},
{t:'A8',a:'D',q:'An EGR valve stuck open will most likely cause:',o:['Detonation at cruise','Rough idle or stalling','High NOx','Hard hot start only'],c:1,w:'Exhaust gas at idle dilutes the mixture and causes a rough idle or stalling. An EGR that never opens raises NOx and can cause pinging.'},
{t:'A8',a:'D',q:'With the engine warm, the downstream O2 sensor switches as fast as the upstream sensor. What does this indicate?',o:['Normal catalytic converter','Catalytic converter not storing oxygen (low efficiency)','Exhaust leak after the converter only','Faulty upstream sensor'],c:1,w:'A good converter smooths the downstream signal. Copying the upstream switching means it has lost its oxygen storage (P0420).'},
{t:'A8',a:'E',q:'A MAP sensor reads about 4.5 V with the engine warm at idle. What is the most likely cause?',o:['Normal reading','Disconnected or blocked vacuum hose to the MAP sensor','Vacuum leak','Restricted exhaust'],c:1,w:'High vacuum at idle should give a low MAP voltage (about 1 V). 4.5 V means the sensor sees atmospheric pressure, as if its hose were off.'},
{t:'A8',a:'E',q:'Several sensors (TPS, MAP, fuel tank pressure) set codes at the same time. What should be checked first?',o:['Each sensor individually','The shared 5 V reference circuit','Fuel pressure','Ignition timing'],c:1,w:'Sensors that share a 5 V reference all fail when it is shorted or open. Check the common circuit first.'},
{t:'A8',a:'D',q:'Code P0456 (EVAP very small leak) is set. What is the best way to locate the leak?',o:['Smoke test the EVAP system','Replace the gas cap without testing','Replace the purge valve','Check fuel pressure'],c:0,w:'A smoke machine finds small EVAP leaks: caps, hoses, vent valves, the filler neck.'},
{t:'A8',a:'E',q:'A customer complains of a hesitation. A scope on the TPS signal shows a sharp drop to near 0 V during a slow throttle sweep. What does this indicate?',o:['Normal TPS operation','A dead spot in the TPS','A bad 5 V reference only','A vacuum leak'],c:1,w:'The TPS signal should sweep smoothly. A dropout at one position is a worn spot in the sensor\'s resistive track.'},
];

Q.push(
/* ===================== A1 ENGINE REPAIR ===================== */
{t:'A1',a:'A',q:'A light knocking noise gets louder with engine speed and nearly disappears when that cylinder is disabled during a power balance test. What is the most likely cause?',o:['Worn main bearing','Worn connecting rod bearing','Loose flywheel','Excessive crankshaft end play'],c:1,w:'Disabling the cylinder takes the load off its rod bearing, so the knock fades. A main bearing knock is a deeper thud that doesn\'t change much when one cylinder is killed.'},
{t:'A1',a:'A',q:'A hollow knocking noise is loudest when the engine is cold and quiets down as it warms up. What is the most likely cause?',o:['Piston slap','Rod bearing knock','Detonation','Loose torque converter bolts'],c:0,w:'Excessive piston-to-wall clearance makes the piston rock in the bore. As the piston expands with heat, the clearance shrinks and the noise fades.'},
{t:'A1',a:'A',q:'A ticking noise occurs at half crankshaft speed. Where is it most likely coming from?',o:['Crankshaft','Valve train','Flywheel','Torque converter'],c:1,w:'The camshaft and valve train turn at half crankshaft speed, so a noise at half engine speed points there.'},
{t:'A1',a:'A',q:'A milky residue is found under the oil fill cap of a car driven only on short trips. Coolant level is stable and the oil on the dipstick looks normal. What is the most likely cause?',o:['Blown head gasket','Condensation from short-trip driving','Cracked block','Failed oil cooler'],c:1,w:'Short trips never fully warm the engine, so moisture condenses inside. With stable coolant and clean dipstick oil, internal coolant leaks are unlikely.'},
{t:'A1',a:'A',q:'Thick white exhaust smoke with a sweet smell most likely indicates:',o:['Burning oil','Burning coolant','Rich fuel mixture','Normal condensation'],c:1,w:'Coolant burning in the combustion chamber produces white, sweet-smelling smoke. Blue-gray smoke is oil, black smoke is a rich mixture.'},
{t:'A1',a:'A',q:'Black exhaust smoke under acceleration most likely indicates:',o:['Oil burning','Coolant leak','Rich air-fuel mixture','Lean misfire'],c:2,w:'Black smoke is unburned fuel (soot) from a rich mixture.'},
{t:'A1',a:'A',q:'A compression test shows two cylinders next to each other are both low. What is the most likely cause?',o:['Worn rings in both','Head gasket leak between the two cylinders','Two burned valves','Worn camshaft'],c:1,w:'Two adjacent low cylinders usually share a leak path: a head gasket breached between them.'},
{t:'A1',a:'A',q:'A cylinder reads low on a dry compression test, and adding oil does NOT raise the reading. What is the most likely cause?',o:['Worn piston rings','Leaking valve or head gasket','Worn cylinder walls','Low oil pressure'],c:1,w:'Oil helps seal rings, not valves. No improvement on the wet test points to a valve or gasket leak. Follow up with a leakage test to pinpoint it.'},
{t:'A1',a:'B',q:'Which tool is used with an outside micrometer to measure valve guide inside diameter?',o:['Feeler gauge','Small-hole gauge','Dial bore gauge only','Vernier caliper'],c:1,w:'A small-hole (split-ball) gauge is expanded in the guide and then measured with an outside micrometer.'},
{t:'A1',a:'B',q:'How is cylinder head warpage checked?',o:['With a micrometer across the deck','With a precision straightedge and feeler gauge in several directions','By measuring valve spring height','With a dial bore gauge'],c:1,w:'Lay a straightedge lengthwise, crosswise and diagonally, and try feeler gauges underneath. Compare to the manufacturer\'s flatness spec.'},
{t:'A1',a:'B',q:'A valve seat ground too narrow will most likely cause:',o:['Poor heat transfer and valve burning','Carbon buildup on the seat','Increased valve spring pressure','Low oil consumption'],c:0,w:'The seat is where the valve transfers heat to the head. Too narrow a contact area and the valve runs hot. Too wide traps carbon and lowers seating pressure.'},
{t:'A1',a:'B',q:'Technician A says a broken timing belt on an interference engine can bend valves. Technician B says timing belts should be replaced at the manufacturer\'s interval even if they look good. Who is correct?',o:[TA,TB,BOTH,NEI],c:2,w:'On interference engines, pistons and valves can collide if the timing is lost. Belts can fail without warning, so follow the replacement interval.'},
{t:'A1',a:'B',q:'One hydraulic lifter keeps ticking long after warm-up, even with correct oil level and pressure. What is the most likely cause?',o:['Normal operation','Collapsed or sticking lifter','Worn timing chain','Low coolant'],c:1,w:'A lifter that won\'t pump up (worn, dirty or collapsed) leaves clearance in the valve train and ticks.'},
{t:'A1',a:'B',q:'How can camshaft lobe wear be measured?',o:['Measuring lobe height with a micrometer','Checking valve spring free length','Measuring cam bearing bore with a ruler','Measuring timing chain slack'],c:0,w:'Compare lobe height (or lift measured with a dial indicator on the pushrod or lifter) to spec or to other lobes.'},
{t:'A1',a:'C',q:'Crankshaft end play is measured with a dial indicator. Which part controls it?',o:['Rod bearings','Thrust bearing','Oil pump','Timing chain'],c:1,w:'The thrust bearing (or thrust washers) on one main journal limits fore-and-aft crank movement.'},
{t:'A1',a:'C',q:'How is piston ring end gap measured?',o:['Ring installed on the piston, measured with a micrometer','Ring squared in the cylinder bore, gap measured with a feeler gauge','Ring measured with a caliper on the bench','With Plastigage'],c:1,w:'Push the ring squarely into the bore with a piston and measure the gap with a feeler gauge.'},
{t:'A1',a:'C',q:'Why are cylinder walls honed before installing new rings?',o:['To enlarge the bore','To create a crosshatch pattern that helps the rings seat','To polish the walls smooth','To remove the ring ridge'],c:1,w:'The crosshatch holds oil and gives the new rings a surface to wear in against. A ridge reamer removes the ridge.'},
{t:'A1',a:'C',q:'Piston ring side clearance is checked by:',o:['Measuring the ring in the bore','Inserting a feeler gauge between the ring and the ring land with the ring in its groove','Using Plastigage','Measuring piston diameter'],c:1,w:'Side clearance is the gap between the ring and its groove. Too much points to worn ring lands.'},
{t:'A1',a:'C',q:'Torque-to-yield (TTY) head bolts should generally be:',o:['Reused if they look good','Replaced with new bolts','Torqued 20% higher when reused','Lubricated with thread locker only'],c:1,w:'TTY bolts are stretched into their yield range and won\'t clamp correctly a second time. Most manufacturers require new bolts.'},
{t:'A1',a:'C',q:'Main bearing caps must be installed:',o:['In any position','In their original location and direction','With new bolts only','Without torque specs'],c:1,w:'Caps are line-bored with the block. Mixing them up or reversing them changes the bore alignment.'},
{t:'A1',a:'D',q:'What is the most accurate way to verify actual engine oil pressure?',o:['The dash gauge','A mechanical gauge installed in the sending unit port','The oil level on the dipstick','The scan tool only'],c:1,w:'A mechanical gauge removes the sender and dash gauge from the equation.'},
{t:'A1',a:'D',q:'A radiator cap tester shows the cap releases well below its rated pressure. What is the result?',o:['Lower boiling point and possible overheating or coolant loss','Higher boiling point','Better cooling','No effect'],c:0,w:'System pressure raises the coolant\'s boiling point. A weak cap lets coolant boil and escape sooner.'},
{t:'A1',a:'D',q:'Coolant is dripping from the small weep hole on the water pump. What is the correct repair?',o:['Add stop-leak','Replace the water pump','Replace the thermostat','Tighten the pump bolts'],c:1,w:'The weep hole drips when the pump\'s internal shaft seal fails. The pump must be replaced.'},
{t:'A1',a:'D',q:'A voltmeter reads 0.7 V between the coolant and engine ground. What does this indicate?',o:['Normal reading','Electrolysis from degraded coolant or a poor ground','Good freeze protection','Thermostat failure'],c:1,w:'Coolant should carry very little voltage. A high reading means depleted coolant, a missing ground, or both. Check the grounds and replace the coolant.'},
{t:'A1',a:'D',q:'An engine keeps losing coolant with no external leaks, and the cooling system pressurizes quickly when warm. Which test helps confirm a combustion leak?',o:['Chemical block (combustion leak) test','Oil pressure test','Fuel pressure test','Spark test'],c:0,w:'The block tester\'s fluid changes color when it detects exhaust gases (CO2) in the coolant vapors.'},
{t:'A1',a:'E',q:'An exhaust leak upstream of the front oxygen sensor can cause:',o:['A false lean reading and the engine running rich','A false rich reading','No effect on fuel control','Low oil pressure'],c:0,w:'Outside air drawn in at the leak makes the O2 sensor read lean, so the PCM adds fuel.'},
{t:'A1',a:'E',q:'When replacing a timing belt that also drives the water pump, it is usually recommended to:',o:['Reuse the water pump','Replace the water pump and tensioner at the same time','Skip the tensioner','Replace only the belt'],c:1,w:'A failing pump or tensioner can ruin the new belt. Most of the labor is already done, so replacing them together makes sense.'},
{t:'A1',a:'E',q:'A spark plug has a white, blistered insulator. What does this indicate?',o:['Rich mixture','Overheating: lean mixture, over-advanced timing or a plug that\'s too hot','Oil fouling','Normal wear'],c:1,w:'A white, blistered insulator is a sign of excessive combustion chamber heat.'},
{t:'A1',a:'E',q:'A "hotter" spark plug heat range means:',o:['A shorter insulator nose that sheds heat faster','A longer insulator nose that keeps more heat','A wider gap','A higher firing voltage only'],c:1,w:'A longer heat path keeps the tip hotter, which helps burn off deposits. Use the heat range the manufacturer specifies.'},
{t:'A1',a:'E',q:'Fuel pressure leaks down quickly after shutoff and the engine is hard to start after sitting. What is the most likely cause?',o:['Leaking injector or a faulty pump check valve','Clogged air filter','Bad crank sensor','Weak ignition coil'],c:0,w:'Residual pressure should hold. A leaking injector or check valve lets it bleed off, so the system must re-prime before starting.'},

/* ===================== A2 AUTOMATIC TRANSMISSION ===================== */
{t:'A2',a:'A',q:'A transmission slips only in 2nd gear. What should be suspected?',o:['The pump','A holding device used only in 2nd gear','The torque converter','The valve body in all ranges'],c:1,w:'Use the clutch/band application chart: a slip in only one gear points to the component that\'s applied only in that gear.'},
{t:'A2',a:'A',q:'A vehicle has all forward gears but no Reverse. What is the most likely cause?',o:['Weak pump','A failed reverse-only clutch or band','A clogged filter','A bad torque converter'],c:1,w:'If forward gears work, the pump and converter are OK. Look at the components applied only in reverse.'},
{t:'A2',a:'A',q:'Upshifts are harsh in every gear and line pressure reads high. What is the most likely cause?',o:['Low fluid','Faulty pressure control (EPC) solenoid or its circuit','Worn clutch plates','Slipping torque converter'],c:1,w:'The pressure control solenoid regulates line pressure. If it fails or loses its signal, pressure usually goes to maximum, which gives harsh shifts.'},
{t:'A2',a:'A',q:'An electronic transmission is stuck in one gear (limp mode) and shows multiple solenoid codes. What should be checked first?',o:['Each solenoid\'s resistance individually','The common power feed and ground to the solenoids','The torque converter','The fluid color only'],c:1,w:'Several solenoid codes at once point to something they share: the power supply, a ground or the main connector.'},
{t:'A2',a:'A',q:'The torque converter clutch never engages. Scan data shows the brake switch as "ON" even with the pedal released. What is the most likely cause?',o:['A failed TCC solenoid','A misadjusted or faulty brake pedal switch','Low line pressure','A bad engine coolant sensor'],c:1,w:'The PCM releases (or won\'t apply) the TCC when it sees the brakes applied.'},
{t:'A2',a:'A',q:'Transmission fluid is pink and foamy. What is the most likely cause?',o:['Coolant contamination','Overfilled transmission','Burnt clutches','Normal condition'],c:1,w:'Too much fluid lets rotating parts whip it into foam. Milky, cloudy fluid points to coolant contamination from the cooler.'},
{t:'A2',a:'A',q:'Transmission fluid is milky pink. What is the most likely cause?',o:['Overfill','Coolant leaking in through the radiator\'s transmission cooler','Old fluid','Wrong fluid type'],c:1,w:'An internal leak in the cooler inside the radiator mixes coolant with the fluid. Coolant destroys friction material, so act quickly.'},
{t:'A2',a:'A',q:'There is no engine braking when Manual 1 (Low) is selected while coasting. What is the most likely cause?',o:['A failed holding device for manual low (such as the low/reverse clutch or band)','A bad torque converter','A weak pump','A failed speed sensor'],c:0,w:'In drive range 1st, a one-way clutch freewheels on coast. Manual low applies an extra holding device for engine braking. If it doesn\'t apply, the vehicle freewheels.'},
{t:'A2',a:'A',q:'An output shaft speed sensor fails. Which symptom is most likely?',o:['Erratic or no shifting and an inoperative speedometer','Harsh engagement only','Fluid leak','Engine misfire'],c:0,w:'The TCM uses output speed for shift scheduling, and it often feeds the speedometer.'},
{t:'A2',a:'A',q:'Line pressure is correct in Park and Neutral but drops sharply when Drive is selected. What is the most likely cause?',o:['A clogged filter','A leak in the circuit applied in Drive (such as a forward clutch seal)','A weak pump','A bad pressure regulator'],c:1,w:'A good pump makes pressure in P and N. The drop happens only when the Drive circuit is fed, so the leak is in that circuit.'},
{t:'A2',a:'A',q:'The transmission fluid temperature (TFT) sensor reads −40°F on the scan tool with a warm transmission. What is the most likely cause?',o:['A shorted sensor','An open in the sensor or its circuit','Normal for a cold start','A bad TCM ground only'],c:1,w:'Most thermistor sensors read their coldest value when the circuit is open (the TCM sees full reference voltage).'},
{t:'A2',a:'A',q:'After a valve body replacement, the transmission shifts poorly. What should be performed?',o:['A fluid flush only','Transmission adaptive relearn procedure','Engine idle relearn only','Nothing; it fixes itself instantly'],c:1,w:'Many electronic transmissions need adaptive values reset and relearned with a scan tool or drive procedure after repairs.'},
{t:'A2',a:'A',q:'A vehicle accelerates poorly from a stop but cruises normally at highway speed. Which part is most likely at fault?',o:['A torque converter stator one-way clutch that freewheels','A seized stator one-way clutch','A slipping 3rd clutch','Wrong fluid'],c:0,w:'The stator multiplies torque at low speed. If its one-way clutch freewheels, launch is weak. A seized stator causes overheating and poor top-end performance instead.'},
{t:'A2',a:'A',q:'A transmission shift flares (the rpm jumps briefly) on the 1–2 upshift. What is the most likely cause?',o:['Low line pressure or a worn 2nd-gear apply component','Overfilled fluid','A bad output speed sensor only','A misadjusted throttle body'],c:0,w:'A flare means the off-going and on-coming elements overlap poorly, often because of low apply pressure or a worn component.'},
{t:'A2',a:'B',q:'During a fluid service, a small amount of fine fuzzy material is found in the pan. What does this mean?',o:['Normal wear; continue the service','The transmission needs immediate overhaul','The wrong fluid was used','The torque converter has failed'],c:0,w:'A light amount of fine friction material is normal. Large metal chunks or heavy debris mean internal damage.'},
{t:'A2',a:'B',q:'After a transmission rebuild, why should the cooler and cooler lines be flushed?',o:['To remove debris that could contaminate the rebuilt unit','To remove air only','It\'s not necessary','To raise fluid temperature'],c:0,w:'Debris trapped in the cooler can flow back into the new transmission and cause a repeat failure.'},
{t:'A2',a:'B',q:'Why should valve body bolts be torqued to spec in the correct sequence?',o:['To prevent warping the valve body and sticking valves','To reduce noise','To set line pressure','To prevent fluid foaming'],c:0,w:'Uneven clamping can distort the valve body and bind its spool valves.'},
{t:'A2',a:'B',q:'Fluid is dripping from the bell housing area of an automatic. How can you tell whether it\'s the front pump seal or the rear main seal?',o:['Check the fluid\'s color and smell','Replace both','Check tire pressure','Check the dipstick only'],c:0,w:'Red ATF points to the pump seal, while brown or black oil points to the engine\'s rear main seal. Dye can confirm it.'},
{t:'A2',a:'B',q:'The gear selector shows Drive, but the transmission is between detents. What should be adjusted?',o:['Shift cable/linkage','Line pressure','Torque converter','Throttle position sensor'],c:0,w:'The shift cable must line up the manual valve with each range detent, or you get partial engagement and wear.'},
{t:'A2',a:'B',q:'An output shaft seal keeps leaking after replacement. What should be checked?',o:['Extension housing bushing wear','Torque converter','Pump gears','TCC solenoid'],c:0,w:'A worn bushing lets the driveshaft yoke move around and quickly ruins the new seal.'},
{t:'A2',a:'B',q:'On older transmissions with a vacuum modulator, a ruptured diaphragm can cause:',o:['Transmission fluid drawn into the engine and white exhaust smoke','Delayed engagement only','A no-start','Overheating coolant'],c:0,w:'Engine vacuum pulls fluid through the ruptured diaphragm into the intake. Check the vacuum hose for fluid.'},
{t:'A2',a:'B',q:'Which scan tool function helps check a shift solenoid without removing it?',o:['Freeze frame','Bidirectional output (solenoid) test','Readiness monitors','VIN read'],c:1,w:'Commanding the solenoid on and off while listening or checking the circuit confirms the TCM, wiring and solenoid response.'},
{t:'A2',a:'C',q:'In a simple planetary gearset, the sun gear is held and the ring gear is driven. What does the carrier output?',o:['Reverse','Gear reduction (underdrive)','Direct drive','Overdrive'],c:1,w:'Ring as input, sun held, carrier as output gives a forward reduction.'},
{t:'A2',a:'C',q:'Locking any two members of a simple planetary gearset together results in:',o:['Reverse','Neutral','Direct drive (1:1)','Overdrive'],c:2,w:'With two members locked, the whole set turns as one unit.'},
{t:'A2',a:'C',q:'In a simple planetary gearset, the carrier is held and the sun gear is driven. What happens?',o:['Reverse','Direct drive','Overdrive','Neutral'],c:0,w:'With the carrier held, the planet gears act as idlers, so the ring turns in the opposite direction.'},
{t:'A2',a:'C',q:'During overhaul, steel clutch plates are blue and slightly warped. What should be done?',o:['Reuse them','Replace them','Sand them flat','Flip them over'],c:1,w:'Heat damage and warping cause slipping and uneven apply. Replace them.'},
{t:'A2',a:'C',q:'Before installation, new friction clutch plates should be:',o:['Installed dry','Soaked in the correct transmission fluid','Sanded','Coated in grease'],c:1,w:'Soaking (usually 15 minutes or more) fills the friction material so it isn\'t scorched on first apply.'},
{t:'A2',a:'C',q:'Pump gear-to-housing face clearance is measured with:',o:['Plastigage','A straightedge and feeler gauge','A dial bore gauge','A micrometer only'],c:1,w:'Lay a straightedge across the pump body and measure to the gears with a feeler gauge.'},
{t:'A2',a:'C',q:'Transmission end play measured with a dial indicator is out of spec. How is it usually corrected?',o:['A selective thrust washer','More fluid','A new torque converter','Tightening the pan bolts'],c:0,w:'Selective-thickness thrust washers set the end play.'},
{t:'A2',a:'C',q:'Before installing a one-way (sprag or roller) clutch, the technician should:',o:['Verify it locks in one direction and freewheels in the other','Lubricate it with grease','Check its resistance','Heat it'],c:0,w:'A one-way clutch installed backwards causes a no-drive or a gear that won\'t hold. Check its direction against service info.'},

/* ===================== A3 MANUAL DRIVE TRAIN & AXLES ===================== */
{t:'A3',a:'A',q:'A clutch chatters when engaging. Technician A says the disc may be contaminated with oil. Technician B says worn engine or transmission mounts can cause it. Who is correct?',o:[TA,TB,BOTH,NEI],c:2,w:'Both cause grab-and-release engagement: contamination changes friction, and loose mounts let the driveline move.'},
{t:'A3',a:'A',q:'Gears grind when shifting into first with the engine running but shift smoothly with the engine off. What is the most likely cause?',o:['Clutch not fully releasing (drag)','Worn synchronizers in all gears','Low gear oil','Worn U-joint'],c:0,w:'If the clutch drags, the input shaft keeps spinning and the gears clash. With the engine off, nothing is spinning.'},
{t:'A3',a:'A',q:'A hydraulic clutch pedal feels spongy and the clutch doesn\'t fully release. What is the most likely cause?',o:['Air in the clutch hydraulic system','Worn pressure plate','Worn pilot bearing','Oil on the disc'],c:0,w:'Air compresses, which reduces release travel. Bleed the system and check for leaks.'},
{t:'A3',a:'A',q:'A squealing noise is heard when the clutch pedal is pressed with the vehicle stopped in neutral. Technician A says a worn pilot bearing can cause it. Technician B says a worn release bearing can cause it. Who is correct?',o:[TA,TB,BOTH,NEI],c:2,w:'Both bearings only work when the pedal is pressed. The release bearing spins under load, and the pilot bearing has the crank turning around a stopped input shaft.'},
{t:'A3',a:'A',q:'During clutch replacement, the flywheel shows heat cracks and hard spots. What should be done?',o:['Reuse it','Resurface or replace per manufacturer (dual-mass flywheels are usually replaced)','Sand it with emery cloth','Install a thicker disc'],c:1,w:'A damaged surface causes chatter and wears the new disc. Many dual-mass flywheels can\'t be resurfaced.'},
{t:'A3',a:'B',q:'A noise is heard in neutral with the clutch released, and it goes away when the clutch is pressed. What is the most likely source?',o:['Release bearing','Input shaft bearing','Pilot bearing','Output shaft seal'],c:1,w:'With the clutch released in neutral, the input shaft and countershaft turn. Pressing the clutch stops them.'},
{t:'A3',a:'B',q:'A manual transmission is very hard to shift in cold weather only. What is the most likely cause?',o:['Wrong lubricant viscosity','Broken shift fork','Worn clutch disc','Worn U-joints'],c:0,w:'Gear oil that\'s too thick slows synchronizer action when cold. Use the specified lubricant.'},
{t:'A3',a:'B',q:'How is synchronizer blocker ring wear checked?',o:['Measuring the gap between the ring and the gear\'s cone with a feeler gauge','Measuring ring diameter with a micrometer','Checking ring weight','Visual check only'],c:0,w:'As the cone surfaces wear, the ring sits closer to the gear. Compare the gap to spec.'},
{t:'A3',a:'B',q:'A transmission is noisy in every gear except direct drive. What is the most likely cause?',o:['Countershaft bearings or gears','Input shaft seal','Clutch disc','Shift forks'],c:0,w:'In direct drive, power bypasses the countershaft gears, so they\'re unloaded. Noise in every other gear points to the countershaft.'},
{t:'A3',a:'B',q:'Shifting is hard into one specific gear, while all other gears shift normally. What is the most likely cause?',o:['A worn synchronizer or shift fork for that gear','A dragging clutch','Low fluid','A misadjusted clutch pedal'],c:0,w:'A clutch or fluid problem affects every gear. A problem with one gear points to its own synchronizer, fork or detent.'},
{t:'A3',a:'C',q:'A manual transaxle requires a specific fluid type. Which should be used?',o:['Any 80W-90 gear oil','The fluid specified by the manufacturer (which may be ATF, engine oil or a special MTF)','Engine oil only','Power steering fluid'],c:1,w:'Transaxle synchronizers are designed around a specific fluid. The wrong one causes hard shifting or wear.'},
{t:'A3',a:'C',q:'A front-wheel-drive car pulls to one side under hard acceleration. Which condition is this?',o:['Torque steer','Bump steer','Memory steer','Brake pull'],c:0,w:'Unequal-length half shafts, worn mounts or a tire difference can make the car steer itself under heavy torque.'},
{t:'A3',a:'C',q:'A transaxle clunks when accelerating from a stop and when letting off the throttle. What should be inspected first?',o:['Engine and transaxle mounts','Pilot bearing','Synchronizers','Clutch disc'],c:0,w:'Worn mounts let the powertrain shift as torque changes direction.'},
{t:'A3',a:'C',q:'A transaxle makes noise only when turning, not when driving straight. Which part is most likely at fault?',o:['Differential pinion and side gears','Input shaft bearing','Countershaft','Clutch'],c:0,w:'The differential gears only rotate relative to each other during turns.'},
{t:'A3',a:'C',q:'A cable-shifted transaxle won\'t go fully into some gears after a clutch job. What should be checked?',o:['Shift cable adjustment and routing','Pilot bearing','Fluid color','CV joints'],c:0,w:'Cables disturbed during removal often need adjusting to center the shifter.'},
{t:'A3',a:'D',q:'A CV boot is torn but the joint is not yet noisy. What is the best repair?',o:['Leave it alone','Replace the boot (and clean and re-grease the joint) or replace the axle if contaminated','Tape the boot','Add grease through the tear'],c:1,w:'Dirt and water quickly destroy the joint. Catching it early can save the joint.'},
{t:'A3',a:'D',q:'A FWD car shudders during acceleration but not while cruising. What is the most likely cause?',o:['Worn inner (plunging) CV joint','Worn outer CV joint','Unbalanced tire','Worn wheel bearing'],c:0,w:'The inner tripod joint plunges in and out with suspension and torque. Wear shows up as a shudder under load.'},
{t:'A3',a:'D',q:'Rear-wheel-drive driveshaft U-joint operating angles should generally be:',o:['As large as possible','Small and nearly equal so they cancel each other out','Zero at one end and large at the other','Unrelated to vibration'],c:1,w:'U-joints speed up and slow down as they rotate at an angle. Equal, opposite angles cancel out that speed variation. Unequal angles cause vibration.'},
{t:'A3',a:'D',q:'A two-piece driveshaft was reassembled with its yokes out of phase. What is the most likely result?',o:['Driveline vibration','No change','A clutch slip','Hard shifting'],c:0,w:'Yokes must be in phase (usually lined up) so U-joint speed changes cancel out. Mark the splines before taking it apart.'},
{t:'A3',a:'E',q:'A rear axle whines under acceleration and changes pitch on deceleration. What is the most likely cause?',o:['Ring and pinion gear wear or contact pattern','Axle bearing','Wheel bearing','Pinion seal'],c:0,w:'Gear noise changes between drive and coast because each side of the tooth is loaded. Bearing noise stays about the same with load.'},
{t:'A3',a:'E',q:'A rumble from the rear axle stays about the same whether accelerating, cruising or coasting, and rises with speed. What is the most likely cause?',o:['Bearing noise (carrier or axle bearing)','Ring gear tooth damage','Limited-slip chatter','Loose U-joint'],c:0,w:'Bearing noise depends on speed, not load. Narrow it down with a road test and by lifting the vehicle.'},
{t:'A3',a:'E',q:'To remove an axle shaft on a C-clip retained rear axle, the technician must first:',o:['Remove the differential pinion shaft so the clips can be removed','Remove the driveshaft only','Remove the axle housing','Press off the bearing'],c:0,w:'Remove the cover, take out the pinion shaft, push the axle in and pull the C-clip.'},
{t:'A3',a:'E',q:'Rear axle lubricant level is correct when:',o:['It\'s at the bottom of the fill plug hole (unless specified otherwise)','It\'s 2 inches below the fill hole','It covers the axle tubes','It\'s at the top of the cover'],c:0,w:'Most axles are filled to the bottom of the fill hole. Some have specific measured amounts.'},
{t:'A3',a:'E',q:'Pinion depth in a differential is typically adjusted with:',o:['Shims behind the pinion head or bearing cup','Side bearing adjusters only','Ring gear bolts','The crush sleeve only'],c:0,w:'Depth shims set the pinion position relative to the ring gear. The crush sleeve or shims set bearing preload.'},
{t:'A3',a:'F',q:'A part-time 4WD truck with manual locking hubs won\'t drive the front wheels in 4H. What should be checked first?',o:['That the hubs are locked','The ring and pinion','The clutch','The transmission fluid'],c:0,w:'With manual hubs unlocked, the front axle shafts turn but the wheels don\'t receive power.'},
{t:'A3',a:'F',q:'Shifting into 4-Low on most part-time transfer cases requires:',o:['Driving at highway speed','Vehicle stopped or rolling slowly with the transmission in Neutral','Only engine off','Pressing the brake while in Drive at speed'],c:1,w:'Low range has no synchronizer on most units, so follow the shift procedure to avoid gear clash.'},
{t:'A3',a:'F',q:'A part-time 4WD truck binds and hops in tight turns on dry pavement in 4H. What is the cause?',o:['A failed front differential','Normal driveline windup; part-time 4WD shouldn\'t be used on dry pavement','A bad transfer case chain','Low tire pressure only'],c:1,w:'Without a center differential, the front and rear axles can\'t turn at different speeds in turns, so the driveline winds up on high-traction surfaces.'},
{t:'A3',a:'F',q:'A transfer case makes a slapping noise that increases with speed. What is the most likely cause?',o:['A stretched drive chain','A worn clutch disc','A bad CV boot','A low brake fluid level'],c:0,w:'A stretched chain hits the case and can jump teeth under load.'},
{t:'A3',a:'F',q:'A vacuum-actuated front axle disconnect won\'t engage in 4WD. What should be checked?',o:['Vacuum supply, hoses and the actuator','Rear axle oil','Clutch hydraulic','Transmission range sensor only'],c:0,w:'Leaking hoses or a torn actuator diaphragm keep the axle from locking.'},
{t:'A3',a:'F',q:'Part-time 4WD is used in 4H with a much smaller spare tire on one front corner. What can happen?',o:['Driveline windup and possible component damage','Better traction','No effect','Improved fuel economy'],c:0,w:'Different rolling diameters force the axles to turn at different speeds, which strains the transfer case and axles.'},

/* ===================== A4 SUSPENSION & STEERING ===================== */
{t:'A4',a:'A',q:'Steering is hard in both directions with the engine running. Fluid level is correct. What should be checked next?',o:['Power steering pump pressure and belt condition','Wheel alignment only','Tire balance','Ball joints only'],c:0,w:'A slipping belt or weak pump reduces assist. A pressure gauge test confirms pump output.'},
{t:'A4',a:'A',q:'There is excessive play in the steering wheel. Which components are the most likely cause?',o:['Worn tie-rod ends or steering gear','Low tire pressure','Bad shocks','Incorrect caster'],c:0,w:'Looseness in the linkage or gear shows up as free play.'},
{t:'A4',a:'A',q:'How can inner tie-rod (rack end) wear be checked on a rack-and-pinion system?',o:['Squeeze the bellows boot and feel for play while someone moves the wheel','Measure toe only','Check the power steering fluid','Bounce the vehicle'],c:0,w:'Squeezing the boot lets you feel the inner socket moving in and out.'},
{t:'A4',a:'A',q:'During a power steering pump pressure test, the shutoff valve should be closed:',o:['For as long as needed','Only briefly (usually 5 seconds or less)','With the engine off','Never'],c:1,w:'Leaving it closed overheats the pump. Close it just long enough to read relief pressure.'},
{t:'A4',a:'A',q:'After a turn, the steering wheel doesn\'t return to center on its own. Which is a likely cause?',o:['A binding upper strut bearing or seized ball joint','Toe-in too much','Low tire pressure','A worn tie-rod end'],c:0,w:'Binding pivot points resist the self-centering effect of caster.'},
{t:'A4',a:'A',q:'A vehicle pulls right. After the front tires are swapped side to side, it pulls left. What is the cause?',o:['Tire conicity (a defective tire)','Alignment','Brake drag','Steering gear'],c:0,w:'If the pull follows the tires, it\'s a tire construction problem, not alignment.'},
{t:'A4',a:'A',q:'Toe changes as the suspension moves up and down (bump steer). What can cause this?',o:['A steering rack or linkage that is out of position or bent','Low tire pressure','Worn shocks only','Incorrect camber'],c:0,w:'If the tie rods aren\'t parallel to the control arms, they pull the wheels in or out through suspension travel.'},
{t:'A4',a:'A',q:'With parallelogram steering, how is an idler arm checked?',o:['Apply moderate up-and-down force at the arm and compare movement to spec','Measure toe','Check fluid level','Use a vacuum gauge'],c:0,w:'Excessive vertical movement at the idler arm means it\'s worn.'},
{t:'A4',a:'A',q:'The steering jerks or loses assist when turning at idle and a squeal is heard. What is the most likely cause?',o:['Loose or slipping drive belt','Worn tie-rod ends','Bad alignment','Low tire pressure'],c:0,w:'Pump demand peaks during turns at idle, and a slipping belt can\'t keep up.'},
{t:'A4',a:'B',q:'Why should a coil spring compressor be used when disassembling a strut?',o:['The spring is under heavy tension and can cause injury if released','To measure spring rate','To align the strut','It isn\'t needed'],c:0,w:'Safety first: compress the spring before removing the strut nut.'},
{t:'A4',a:'B',q:'On a torsion bar front suspension, ride height is adjusted by:',o:['Turning the torsion bar adjusting bolts','Replacing the shocks','Changing tire size','Adjusting toe'],c:0,w:'Torsion bar adjusters preload the bar to set ride height. Recheck the alignment afterward.'},
{t:'A4',a:'B',q:'A clunk is heard over bumps, and the vehicle leans more in turns. What is the most likely cause?',o:['A broken stabilizer (sway) bar link or worn bushings','Worn tie-rod ends','Incorrect toe','Bad wheel bearing'],c:0,w:'The sway bar controls body roll. A broken link clunks and lets the body roll more.'},
{t:'A4',a:'B',q:'Worn control arm bushings most commonly cause:',o:['Clunks and changing alignment during braking or acceleration','A brake warning light','High oil consumption','No symptoms'],c:0,w:'Soft bushings let the arm move, which changes caster and camber under load.'},
{t:'A4',a:'B',q:'A wheel shows play when rocked at 12 and 6 o\'clock. The play disappears when the brake is applied. What is the most likely cause?',o:['Wheel bearing','Ball joint','Tie-rod end','Strut mount'],c:0,w:'Applying the brake locks the hub to the knuckle, which takes the bearing out of the test. Play that remains points to a ball joint.'},
{t:'A4',a:'B',q:'An air suspension vehicle sags overnight and the compressor runs often. What is the most likely cause?',o:['An air leak in a spring, line or valve','A bad ride height sensor only','Low engine oil','Worn tie rods'],c:0,w:'The system is losing pressure. Use soapy water to find the leak.'},
{t:'A4',a:'B',q:'Technician A says light oil misting on a shock absorber can be normal. Technician B says fluid dripping from a shock means it should be replaced. Who is correct?',o:[TA,TB,BOTH,NEI],c:2,w:'Seals let a light mist through by design. An active leak means the shock is losing its damping fluid.'},
{t:'A4',a:'B',q:'On a MacPherson strut suspension with the spring on the strut, the lower ball joint is:',o:['Load-carrying','Non-load-carrying (follower)','Not used','A tension joint only'],c:1,w:'The strut and spring carry the vehicle weight, so the lower ball joint mainly locates the knuckle.'},
{t:'A4',a:'C',q:'What is the usual order for adjusting front alignment angles?',o:['Toe, camber, caster','Caster, camber, toe','Camber, toe, caster','Any order'],c:1,w:'Caster and camber changes affect toe, so toe is set last.'},
{t:'A4',a:'C',q:'Excessive wear on the inside shoulder of a front tire most likely indicates:',o:['Too much negative camber','Too much positive caster','Overinflation','Correct alignment'],c:0,w:'Negative camber tilts the top of the tire inward and loads the inner shoulder.'},
{t:'A4',a:'C',q:'Camber is in spec but the included angle (SAI + camber) is out of spec. What does this indicate?',o:['A bent spindle or strut','Normal condition','Incorrect toe','Worn tires'],c:0,w:'Included angle is set by the shape of the parts. If it\'s wrong, a part is bent.'},
{t:'A4',a:'C',q:'Toe-out-on-turns readings are out of spec on one side. What is the most likely cause?',o:['A bent steering arm','Incorrect tire pressure','Worn shocks','Incorrect thrust angle'],c:0,w:'Steering arm geometry sets the turning angles (Ackermann). A bent arm changes them.'},
{t:'A4',a:'C',q:'One front wheel sits farther back than the other. What is this called, and what is the usual cause?',o:['Setback, often from collision damage','Caster, from worn bushings','Toe, from a bent tie rod','SAI, from low tire pressure'],c:0,w:'Setback can cause a pull and usually means frame or cradle damage or shift.'},
