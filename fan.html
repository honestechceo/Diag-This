<style>
:root{--bg:#121417;--panel:#1c1f23;--panel2:#24282d;--line:#33383f;--text:#e9ebee;--muted:#9aa1ab;--yellow:#f5c518;--green:#7dfc9a;--red:#ff5a4e}
*{box-sizing:border-box}
html,body{margin:0;background:radial-gradient(ellipse at top,#1d2228,#0e1012 60%);background-attachment:fixed;color:var(--text);font-family:Barlow,system-ui,sans-serif;font-size:16px}
button{font-family:inherit;cursor:pointer}
.wrap{max-width:760px;margin:0 auto;padding:10px 10px 150px}
h1,h2,h3{font-family:"Barlow Condensed",sans-serif;margin:0;letter-spacing:.02em}

.stats{display:flex;gap:6px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 8px;text-align:center;min-width:54px}

.meta{color:var(--muted);font-size:13px}
.complaint{font-style:italic;margin-top:4px}
.tip{background:#1e2a22;border:1px solid #2f5a3d;border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.45;color:#cfe9d6;margin:8px 0}
.tip b{color:#fff}
.tip button{background:none;border:0;color:var(--green);font-weight:600;padding:0;margin-top:4px}

.diagram{background:#0d1013;border:1px solid var(--line);border-radius:12px;padding:6px;position:relative}
.diagram svg{width:100%;display:block}
.leadbar{display:flex;gap:6px;margin-bottom:6px}
.lead{flex:1;border-radius:9px;padding:9px 6px;font-weight:700;font-size:14px;border:2px solid transparent;background:var(--panel2);color:var(--text)}

.lead.blk.on{border-color:#d9dde2;background:#2c3036}
.lead .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
.tp{cursor:pointer}
.tp circle.hit{fill:transparent}
.tp circle.ring{fill:#0d1013;stroke:#f5c518;stroke-width:2}
.tp:hover circle.ring{fill:#3b3210}
.tpl{font:600 8.5px "JetBrains Mono";fill:#cfd3d8;pointer-events:none}
.wire{fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.cmp{fill:#1a1e23;stroke:#8c949d;stroke-width:1.6}
.cl{font:700 10px "JetBrains Mono";fill:#e9ebee}
.cs{font:500 8px "JetBrains Mono";fill:#9aa1ab}
#fanRotor{transform-box:fill-box;transform-origin:center}
.spinFast{animation:spin .18s linear infinite}
.spinSlow{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.clickfx{opacity:0}
.clickfx.show{animation:pop .5s ease-out}
@keyframes pop{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-12px)}}
.chips{position:absolute;top:10px;right:10px;display:flex;flex-direction:column;gap:4px;align-items:flex-end;pointer-events:none}
.chip{font:700 10px "JetBrains Mono";padding:3px 7px;border-radius:6px;background:#2a2e33;color:#9aa1ab;border:1px solid #3a3f46}
.chip.on{background:#3a3010;color:var(--yellow);border-color:#7a6410}

.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.act{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px 4px;font-size:13px;font-weight:600;line-height:1.2}
.act small{display:block;font-family:"JetBrains Mono";color:var(--yellow);font-size:10.5px;font-weight:500;margin-top:2px}
.act.on{background:var(--yellow);color:#111}.act.on small{color:#111}
.act.primary{background:var(--yellow);color:#111;border-color:var(--yellow)}
.act:disabled{opacity:.4}

.log{background:#0b0e0c;border:2px solid #2c3a30;border-radius:10px;padding:8px 10px;font-family:"JetBrains Mono";font-size:12px;color:var(--green);max-height:220px;overflow:auto}
.log div{padding:4px 0;border-bottom:1px dashed #22302a}.log div:last-child{border:0}
.log .h{color:var(--yellow)}

/* DMM dock */
.dmm{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:8px 10px 12px;background:linear-gradient(transparent,rgba(0,0,0,.6) 30%)}

.modes{display:flex;flex-direction:column;gap:4px}
.mode{background:#2b2b2b;color:#f2c300;border:0;border-radius:7px;padding:7px 9px;font:700 12px "JetBrains Mono"}

/* modal */

<script>
function career(fixed,stars){try{const c=JSON.parse(localStorage.getItem('ce_career')||'{}');c.jobs=(c.jobs||0)+1;c.fixed=(c.fixed||0)+(fixed?1:0);c.stars=(c.stars||0)+stars;localStorage.setItem('ce_career',JSON.stringify(c));}catch(e){}}
const $=id=>document.getElementById(id);

/* ===================== TEST POINTS (real-world locations) ===================== */
const TPN={
 bat_p:'Battery + post',bat_n:'Battery − post',
 f11a:'F11 test point A',f11b:'F11 test point B',f12a:'F12 test point A',f12b:'F12 test point B',f5a:'F5 test point A',f5b:'F5 test point B',
 r30:'Relay terminal 30',r87:'Relay terminal 87',r85:'Relay terminal 85',r86:'Relay terminal 86',
 c1p:'Fan C1 cavity 1 (BLU)',c1n:'Fan C1 cavity 2 (BLK)',
 g1:'G1 ground eyelet',body:'Body sheet metal',
 e44:'ECM C3 pin 44',ecm45:'ECM C3 pin 45',e46:'ECM C3 pin 46',e47:'ECM C3 pin 47'
};
const LOCS=[['battery','Battery'],['fusebox','Fuse/relay box'],['fan','Fan motor'],['ground','Ground G1'],['ecm','ECM'],['diagram','Wiring diagram']];

/* ===================== FAULTS ===================== */
const FAULTS={
 fuse:{complaint:'"Overheats sitting in traffic. The fan never comes on."',repair:'fuse',why:'F12 was blown. One test point had battery voltage and the other had 0 V, so power never reached relay 30. Pulling it would also have shown the broken element. On a real car, find out why it blew before you close the job.'},
 contacts:{complaint:'"Overheats in traffic. The fan never kicks on."',repair:'relay',why:'Burnt relay contacts. With the fan commanded, the relay clicked and 30 had 12 V, but 87 stayed at 0 V. A fused jumper from 30 to 87 ran the fan, and the bench test showed the contacts open (OL) with a good coil.'},
 coil:{complaint:'"Temp gauge climbs at red lights. Fan doesn\'t come on."',repair:'relay',why:'Open relay coil. Terminal 86 had 12 V, but 85 read 0 V with the command off, because no voltage was getting through the coil. Ohms across 85–86 on the bench read OL. Jumpering 30–87 ran the fan, and P0480 was set.'},
 ctrl:{complaint:'"Overheats in traffic. The fan never runs."',repair:'ctrl',why:'Open GRN/YEL control wire. Relay 85 stayed at 12 V even when commanded ON, while ECM C3 pin 45 read 0 V. An ohms check from 85 to pin 45 (key off) read OL. P0480 was set.'},
 wire:{complaint:'"Overheats in traffic. Fan doesn\'t seem to work."',repair:'wire',why:'Open BLU feed wire. Relay 87 had 12 V when commanded, but fan C1 cavity 1 read 0 V. With the key off, ohms from relay socket 87 to C1 cavity 1 read OL.'},
 ground:{complaint:'"Runs hot in traffic. The fan seems weak."',repair:'ground',why:'Corroded G1 ground. With the fan running, the voltage drop from C1 cavity 2 to battery negative was about 6 V (spec is under 0.2 V), and current was only about 6 A. A static ohms check across G1 shows about 1 Ω, which is easy to dismiss. Voltage drop under load is the test that proves it.'},
 motor:{complaint:'"Overheats in traffic. Fan is dead."',repair:'motor',why:'Open fan motor. C1 cavity 1 had 12 V and cavity 2 had a good ground, but 0 A flowed. Ohms across the motor (unplugged, key off) read OL.'},
};
const REPAIRS=[{id:'fuse',name:'Replace fuse F12',cost:5},{id:'relay',name:'Replace fan relay',cost:35},{id:'wire',name:'Repair BLU wire (relay 87 → fan C1-1)',cost:8},{id:'ctrl',name:'Repair GRN/YEL wire (relay 85 → ECM 45)',cost:8},{id:'ground',name:'Clean & repair ground G1',cost:4},{id:'motor',name:'Replace fan motor',cost:180},{id:'ecm',name:'Replace ECM',cost:450}];
const VEHICLES=['2007 Nissan Altima','2010 Toyota Corolla','2012 Chevy Malibu','2009 Honda Civic','2014 Ford Focus','2011 Hyundai Elantra'];
const NAMES=['Tony','Maria','Dev','Keisha','Frank','Lena','Omar'];

/* ===================== STATE ===================== */
let job,S,M,fixedCount=0,loc='fusebox',active='red';
function newJob(){
  const ks=Object.keys(FAULTS),f=ks[Math.floor(Math.random()*ks.length)];

/* ===================== CIRCUIT ===================== */
function ammeterBridgesFuse(){const l=M.leads;return M.dial==='A'&&M.red==='A'&&M.meterFuse&&!S.fuseIn&&((l.red==='f12a'&&l.blk==='f12b')||(l.red==='f12b'&&l.blk==='f12a'));}
function solve(){
  const f=job.fault,V=12.4,k=S.key,cmd=k&&S.cmd;
  const relayHere=S.relay!=='out';
  const energized=relayHere&&cmd&&f!=='coil'&&f!=='ctrl';
  const closed=(relayHere&&energized&&f!=='contacts')||(S.relay==='out'&&S.jumper);
  const fuseCond=(S.fuseIn&&f!=='fuse')||ammeterBridgesFuse();
  const load=closed&&fuseCond&&f!=='wire'&&f!=='motor'&&S.fanPlug;
  const I=load?(f==='ground'?6.1:11.8):0;
  const v={bat_p:V,bat_n:0,body:0,f11a:V,f11b:V};
  v.f12a=V-(I?.02:0);
  v.f12b=fuseCond?V-(I?.06:0):0;
  v.r30=v.f12b-(I&&fuseCond?.02:0);
  v.f5a=k?V:0;v.f5b=v.f5a;v.r86=v.f5b;
  if(!k||f==='coil'||!relayHere)v.r85=0;else if(energized)v.r85=.18;else v.r85=V;
  v.ecm45=f==='ctrl'?0:(relayHere?v.r85:0);
  v.r87=closed?(fuseCond?v.r30-(I?.05:0):0):0;
  if(closed&&f!=='wire'&&fuseCond&&S.fanPlug){
    if(load){v.c1p=v.r87-I*.009;if(f==='ground'){v.c1n=6.05;v.g1=5.98;}else{v.c1n=.09;v.g1=.06;}}
    else{v.c1p=v.r87;v.c1n=0;v.g1=0;}
  }else if(closed&&f!=='wire'&&fuseCond&&!S.fanPlug){v.c1p=v.r87;v.c1n=0;v.g1=0;}
  else{v.c1p=0;v.c1n=0;v.g1=0;}
  v.e44=k?.62:0;v.e46=.01;v.e47=k?5.0:0;
  return {v,I,energized,closed,fan:load?(f==='ground'?'slow':'fast'):'off'};
}
/* resistance graph (only meaningful with key off / circuit dead) */
function edges(){
  const f=job.fault,E=[];const add=(a,b,r)=>E.push([a,b,r]);
  add('bat_n','body',.01);add('body','g1',f==='ground'?1.1:.02);add('g1','c1n',.05);
  if(S.fanPlug&&f!=='motor')add('c1n','c1p',.9);
  if(f!=='wire')add('c1p','r87',.12);
  add('f12b','r30',.05);
  if(S.fuseIn&&f!=='fuse')add('f12a','f12b',.01);
  add('bat_p','f12a',.01);add('bat_p','f11a',.01);add('f11a','f11b',.01);
  add('f5b','r86',.05);add('f5a','f5b',.01);
  if(S.relay!=='out'&&f!=='coil')add('r86','r85',74);
  if(S.relay==='out'&&S.jumper)add('r30','r87',.03);
  if(f!=='ctrl')add('r85','ecm45',.1);
  add('e46','body',.02);
  return E;
}
function resistance(a,b){
  if(a===b)return 0;
  const E=edges(),dist={},seen={};dist[a]=0;
  while(true){let u=null,d=1e9;for(const n in dist)if(!seen[n]&&dist[n]<d){d=dist[n];u=n;}if(u===null)break;seen[u]=1;if(u===b)return d;
    for(const [x,y,r] of E){let w=null;if(x===u)w=y;else if(y===u)w=x;if(w&&!seen[w]&&(dist[w]===undefined||dist[w]>d+r))dist[w]=d+r;}}
  return Infinity;
}
/* ===================== METER ===================== */
function reading(){
  const s=solve(),l=M.leads;
  if(M.dial==='OFF')return {txt:'',unit:''};
  if(M.clamp&&M.dial==='A')return {txt:(s.I?(s.I+(Math.random()-.5)*.1).toFixed(1):'0.0'),unit:'A',note:'clamp'};
  if(!l.red||!l.blk)return {txt:M.dial==='OHM'||M.dial==='CONT'?'O.L':'0.00',unit:unitOf()};
  const dv=s.v[l.red]-s.v[l.blk];
  if(M.dial==='VDC'){if(M.red==='A'){if(Math.abs(dv)>1)blowMeterFuse();return {txt:'0.00',unit:'V',note:'jackV'};}return {txt:fmt(dv+(Math.random()-.5)*.01),unit:'V'};}
  if(M.dial==='VAC')return {txt:(Math.abs(dv)>1?.02:0).toFixed(2),unit:'V~'};
  if(M.dial==='OHM'||M.dial==='CONT'){
    if(M.red==='A')return {txt:'O.L',unit:'Ω'};
    if(Math.abs(dv)>.3||(S.key&&liveBetween(l.red,l.blk)))return {txt:'-'+(Math.random()*9).toFixed(1),unit:'Ω',note:'live'};
    const r=resistance(l.red,l.blk);
    if(M.dial==='CONT'){if(r<5)beepCont();return {txt:r===Infinity?'O.L':r.toFixed(1),unit:'Ω',note:r<5?'beep':''};}
    return {txt:r===Infinity?'O.L':(r<200?r.toFixed(1):Math.round(r)),unit:'Ω'};
  }
  if(M.dial==='A'){
    if(M.red!=='A')return {txt:'0.00',unit:'A',note:'jack'};
    if(!M.meterFuse)return {txt:'0.00',unit:'A',note:'fuse'};
    if(ammeterBridgesFuse())return {txt:(s.I+(Math.random()-.5)*.1).toFixed(2),unit:'A'};
    if(Math.abs(dv)>1){blowMeterFuse();return {txt:'0.00',unit:'A'};}
    return {txt:'0.00',unit:'A'};
  }
}
function liveBetween(a,b){const s=solve();return s.v[a]>1||s.v[b]>1;}
function unitOf(){return {VDC:'V',VAC:'V~',OHM:'Ω',CONT:'Ω',A:'A',OFF:''}[M.dial];}
function fmt(x){return (x<0?'−':'')+Math.abs(x).toFixed(2);}
let fuseMsgShown=false;
function blowMeterFuse(){if(!M.meterFuse)return;M.meterFuse=false;addLog('POP! You put the meter across a voltage source while it was set up for current. The meter\'s internal 10 A fuse blew. Ammeters go in <b>series</b>, never across a voltage source.','METER:');setTimeout(render,10);}

/* ===================== RENDER ===================== */
function render(){
  const s=solve();
  $('locTabs').innerHTML=LOCS.map(([k,n])=>'<button class="loc'+(loc===k?' on':'')+'" onclick="go(\''+k+'\')">'+n+'</button>').join('');
  $('view').innerHTML=VIEWS[loc](s);
  $('chipKey').textContent=S.key?'KEY ON':'KEY OFF';$('chipKey').className='chip'+(S.key?' go':'');
  $('chipCmd').textContent='FAN CMD '+(S.key&&S.cmd?'ON':'OFF');$('chipCmd').className='chip'+(S.key&&S.cmd?' on':'');
  $('chipFan').textContent='FAN '+(s.fan==='fast'?'RUNNING':s.fan==='slow'?'SLOW':'STOPPED');$('chipFan').className='chip'+(s.fan==='fast'?' go':s.fan==='slow'?' on':'');
  $('bKey').innerHTML=(S.key?'Key OFF':'Key ON')+'<small>free</small>';
  ['red','blk'].forEach(c=>$('P_'+c).classList.toggle('on',active===c));
  $('P_redLoc').textContent=M.leads.red?TPN[M.leads.red]:'not connected';
  $('P_blkLoc').textContent=M.leads.blk?TPN[M.leads.blk]:'not connected';
  if(job.repairs.length&&S.key&&S.cmd&&s.fan==='fast')job.flags.verified=true;
  $('sTime').textContent=job.time;$('sParts').textContent='$'+job.parts;$('sJobs').textContent=fixedCount;
  drawLcd();
  renderGuide();
  fanSound(s);
}
function drawLcd(){
  const r=reading();
  $('lcdVal').textContent=r.txt;
  $('lcdUnit').textContent=r.unit;
  $('lcdFn').textContent={VDC:'DC VOLTS',VAC:'AC VOLTS',OHM:'OHMS',CONT:'CONTINUITY',A:M.clamp?'AMPS · CLAMP':'DC AMPS',OFF:'OFF'}[M.dial];
  let warn='';
  if(r.note==='live')warn='Circuit is live. Ohms readings are invalid.';
  else if(r.note==='jack')warn='Move the red lead to the 10A jack to measure current.';
  else if(r.note==='fuse')warn='Meter 10A fuse blown.';
  else if(r.note==='jackV')warn='Red lead is in the 10A jack. Move it to VΩ to measure volts.';
  else if(M.dial==='A'&&!M.clamp&&!r.note&&M.leads.red)warn='Ammeter must be in series (e.g. across a pulled fuse\'s socket).';
  else if(M.dial==='OHM'&&S.key)warn='Turn the key off for resistance checks.';
  $('lcdWarn').textContent=warn;
  $('lcdBeep').classList.toggle('on',r.note==='beep');
  $('dmmMini').classList.toggle('off',M.dial==='OFF');
  $('jackTxt').textContent='Red lead: '+(M.red==='A'?'10A jack':'VΩ jack')+(M.meterFuse?'':' · meter fuse BLOWN');
}
setInterval(()=>{if(job)drawLcd();},500);

function probe(id){
  beep(1500,.03);M.leads[active]=id;job.probed=job.probed||{};job.probed[id]=1;M.clamp=false;
  const key=[M.leads.red,M.leads.blk,M.dial,M.red,JSON.stringify(S),job.fault].join('|');
  render();
  if(M.leads.red&&M.leads.blk){const rr=M.leads.red;if(S.key&&S.cmd&&(rr==='c1p'||rr==='c1n'))job.flags.fan=true;if(['f12a','f12b','r30','r87','r85','r86','ecm45','g1','body'].includes(rr)||(rr==='c1n'&&M.leads.blk!=='bat_n'))job.flags.trace=true;}
  if(M.leads.red&&M.leads.blk&&!job.seen[key]){job.seen[key]=1;job.time+=1;job.reads++;
    const r=reading();addLog(TPN[M.leads.red]+' → '+TPN[M.leads.blk]+': <b>'+r.txt+' '+r.unit+'</b> <span class="dim">['+fnName()+', '+stTxt()+']</span>');render();}
}

/* scan tool, tests, repair */
function openModal(html,cls=''){$('modal').className='modal '+cls;$('modal').innerHTML=html;$('modalBg').classList.remove('hidden');}
function closeModal(){$('modalBg').classList.add('hidden');}
function openScan(){
  if(!S.key){openModal('<h3>Scan tool</h3><p>No communication. Turn the key ON first.</p><button class="ghost" onclick="closeModal()">OK</button>','scan');return;}
  if(!job.scanned){job.scanned=true;job.time+=2;}
  const f=job.fault,dtc=(f==='coil'||f==='ctrl')?'<span class="code">P0480</span>Cooling Fan 1 Control Circuit':'No DTCs stored';
  openModal('<h3>Scan tool</h3><div class="scr"><div style="color:#b6ffca">DTCs</div><div>'+dtc+'</div><br><div style="color:#b6ffca">LIVE DATA</div><div class="row"><span>ECT</span><span>226 °F</span></div><div class="row"><span>Fan 1 command</span><span>'+(S.cmd?'ON':'OFF')+'</span></div><div class="row"><span>Battery voltage</span><span>12.4 V</span></div></div>'+
   '<p>Bidirectional control. The command stays on after you close this, so you can probe.</p><button class="mbtn big" onclick="setCmd('+(!S.cmd)+')">'+(S.cmd?'Command fan OFF':'Command fan ON')+'</button><button class="ghost" onclick="closeModal()">Back</button>','scan');
}
function setCmd(on){if(on)job.flags.cmd=true;const b=solve().energized;S.cmd=on;const s=solve();if(s.energized!==b)clickSound();
  if(on)addLog(s.energized?'Fan commanded ON. Relay clicks. '+(s.fan==='fast'?'Fan runs.':s.fan==='slow'?'Fan turns slowly.':'Fan does not run.'):'Fan commanded ON. No relay click'+(S.relay!=='in'&&S.relay!=='adapter'?' (relay is pulled)':'')+'.','SCAN:');
  openScan();render();}
function openTests(){openModal('<h3>Other checks</h3><p>Each costs shop time.</p><button class="mbtn" onclick="bench()"><span>Bench test the relay</span><small>5 min</small></button><button class="mbtn" onclick="inspect()"><span>Visual inspection of fan wiring</span><small>3 min</small></button><button class="ghost" onclick="closeModal()">Close</button>');}
function bench(){job.time+=5;const f=job.fault;const coil=f==='coil'?'O.L':'74 Ω',cont=f==='contacts'?'O.L':(f==='coil'?'— (won\'t energize)':'0.1 Ω');
  addLog('Coil 85–86: '+coil+' · contacts 30–87 energized: '+cont,'BENCH:');
  openModal('<h3>Relay bench test</h3><div class="scr" style="background:#c9d3b6;color:#18210d"><div class="row"><span>Coil 85–86</span><span>'+coil+'</span></div><div class="row"><span>12 V on coil</span><span>'+(f==='coil'?'no click':'clicks')+'</span></div><div class="row"><span>Contacts 30–87 energized</span><span>'+cont+'</span></div></div><p>Spec: coil 60–90 Ω, contacts under 0.2 Ω energized.</p><button class="ghost" onclick="closeModal();render()">Done</button>');render();}
function inspect(){job.time+=3;const t={ground:'G1 eyelet has some green crust under it.',wire:'Harness looks intact. Loom is taped tight near the radiator support.',ctrl:'Harness looks intact. Loom runs near the exhaust heat shield.',motor:'Fan blade turns freely by hand.'}[job.fault]||'Nothing obvious.';addLog(t,'INSPECT:');closeModal();render();}
function openRepair(){openModal('<h3>Repair</h3><p>Each repair is 10 minutes plus parts. Verify afterwards.</p>'+REPAIRS.map(r=>'<button class="mbtn" onclick="doRepair(\''+r.id+'\')"><span>'+r.name+'</span><small>$'+r.cost+'</small></button>').join('')+'<button class="ghost" onclick="closeModal()">Cancel</button>');}
function doRepair(id){const r=REPAIRS.find(x=>x.id===id);job.time+=10;job.parts+=r.cost;job.repairs.push(id);if(job.fault&&FAULTS[job.fault].repair===id)job.fault=null;S.fuseIn=true;S.relay='in';S.jumper=false;S.fanPlug=true;addLog(r.name+'. Everything reassembled. Verify the fix.','REPAIR:');closeModal();render();}
function closeJob(){
  const fixed=job.fault===null,right=FAULTS[job.orig].repair,wasted=job.repairs.filter(r=>r!==right).reduce((s,id)=>s+REPAIRS.find(x=>x.id===id).cost,0);
  let stars=0;if(fixed){stars=1;if(wasted===0)stars++;if(job.time<=30)stars++;fixedCount++;}career(fixed,stars);
  openModal('<div class="verdict '+(fixed?'ok':'no')+'">'+(fixed?'Fixed it':'Comeback')+'</div><div class="stars">'+'★'.repeat(stars)+'☆'.repeat(3-stars)+'</div><table class="res" style="width:100%;margin:8px 0"><tr><td>Time</td><td style="text-align:right">'+job.time+' min</td></tr><tr><td>Measurements</td><td style="text-align:right">'+job.reads+'</td></tr><tr><td>Wasted on wrong parts</td><td style="text-align:right;color:'+(wasted?'#ff5a4e':'#7dfc9a')+'">$'+wasted+'</td></tr></table><p class="res"><b>Fault:</b> '+FAULTS[job.orig].why+'</p>'+(fixed?'':'<p class="res" style="color:#ff8a80">Command the fan and confirm it runs before you close the job.</p>')+
   '<p class="res" style="color:#9aa1ab"><b>ASE link:</b> A6 · General Electrical Diagnosis (voltage drop, opens, relays) · A7 · Operating Systems & Controls (cooling fan control).</p>'+
   '<button class="mbtn big" onclick="closeModal();newJob()">Next job</button><a class="ghost" style="display:block;text-align:center;text-decoration:none" href="ase.html">Study A6 questions</a><a class="ghost" style="display:block;text-align:center;text-decoration:none" href="index.html">Back to garage</a>');
}

/* sound */
let ac=null,fanNode=null,lastFan='off',lastCont=0;
function audio(){if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(ac&&ac.state==='suspended')ac.resume();return ac;}
function beep(f,d){const a=audio();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();o.frequency.value=f;g.gain.setValueAtTime(.05,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d);}
function beepCont(){const n=Date.now();if(n-lastCont<900)return;lastCont=n;beep(2700,.35);}
function clickSound(){const a=audio();if(!a)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();o.type='square';o.frequency.value=900;g.gain.setValueAtTime(.15,t);g.gain.exponentialRampToValueAtTime(.001,t+.035);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+.04);}
function fanSound(s){if(s.fan===lastFan)return;lastFan=s.fan;const a=audio();if(!a)return;if(fanNode){const t=a.currentTime;fanNode.g.gain.linearRampToValueAtTime(0,t+.3);fanNode.s.stop(t+.35);fanNode=null;}
  if(s.fan==='off')return;const len=a.sampleRate*2,b=a.createBuffer(1,len,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;const src=a.createBufferSource();src.buffer=b;src.loop=true;const bp=a.createBiquadFilter();bp.type='bandpass';bp.frequency.value=s.fan==='slow'?350:750;const g=a.createGain();g.gain.value=0;g.gain.linearRampToValueAtTime(s.fan==='slow'?.04:.08,a.currentTime+.4);src.connect(bp);bp.connect(g);g.connect(a.destination);src.start();fanNode={s:src,g};}

function fcRender(n,depth){
  const done=(n.tp||[]).some(t=>job.probed&&job.probed[t]);
  let h='<div class="fcNode'+(n.end?' end':'')+'"><div>'+(n.end?'<span class="fcK">→</span> ':'<span class="fcK">?</span> ')+(n.q||n.end)+'</div>';
  if(done)h+='<span class="fcDone">✓ measured</span>';
  if(n.loc)h+='<button class="fcGo" onclick="fcGo(\''+n.loc+'\')">Go measure ›</button>';
  h+='</div>';
  if(n.br){h+='<div class="fcBr">'+n.br.map(([lab,child])=>'<details'+(depth<1?' open':'')+'><summary><span class="fcLab">'+lab+'</span></summary>'+fcRender(child,depth+1)+'</details>').join('')+'</div>';}
  return h;
}

     ['No',{end:'Bad ground. Check across the G1 eyelet to body metal, then clean and repair.',tp:['g1','body'],loc:'ground'}]]}],
   ['No',{q:'Does the relay click when the fan is commanded ON?',br:[
     ['Yes, it clicks',{q:'12 V at relay 87 (relay on the test adapter, fan commanded)?',tp:['r87'],loc:'fusebox',br:[
       ['Yes',{end:'Power leaves the relay but never reaches the fan, so the BLU wire between 87 and C1-1 is open. Confirm with ohms (key off, relay pulled).'}],
       ['No',{q:'12 V at relay 30?',tp:['r30'],loc:'fusebox',br:[
         ['Yes',{end:'Power in at 30, nothing out at 87 even though it clicks: the relay contacts aren\'t closing. Bench test the relay.'}],
         ['No',{end:'No supply to the relay. Check both test points on F12: power on one side only means the fuse is open.',tp:['f12a','f12b'],loc:'fusebox'}]]}]]}],
     ['No click',{q:'12 V at relay 86 with the key ON?',tp:['r86'],loc:'fusebox',br:[
       ['No',{end:'No ignition feed to the relay coil. Check F5 and the ignition circuit.',tp:['f5a','f5b'],loc:'fusebox'}],
       ['Yes',{q:'What does relay 85 read with the fan commanded ON?',tp:['r85'],loc:'fusebox',br:[
         ['About 0 V',{end:'86 has power but none comes through the coil to 85: the relay coil is open. Bench test (O.L across 85–86).'}],
         ['About 12 V',{q:'Now check ECM connector C3 pin 45 (GRN/YEL). What does it read?',tp:['ecm45'],loc:'ecm',br:[
           ['About 0 V',{end:'12 V at one end of the GRN/YEL wire and 0 V at the other: that wire is open between relay 85 and ECM pin 45.'}],
           ['About 12 V',{end:'The wire is good but the ECM isn\'t pulling it to ground: check the ECM command and driver (and its powers and grounds) before condemning it.'}]]}]]}]]}]]}]]}]]};
function fcGo(loc){closeModal();go(loc);setActive('red');document.getElementById('view').scrollIntoView({behavior:'smooth'});}

/* ===== GUIDED FLOW ===== */
let guideOpen=true;
function renderGuide(){
  const el=document.getElementById('guide');if(!el||!job)return;
  job.flags=job.flags||{};job.hints=job.hints||0;
  const cur=GUIDE.findIndex(g=>!g.done());
  const n=cur<0?GUIDE.length:cur;
  let h='<button class="gHead" onclick="guideOpen=!guideOpen;renderGuide()">Diagnostic steps <span>'+n+'/'+GUIDE.length+' done '+(guideOpen?'▾':'▸')+'</span></button>';
  if(guideOpen){
    h+='<div class="gBody"><div class="gBtns" style="margin:0 0 6px"><button class="alt" onclick="openFlow()">📋 Open the diagnostic flow chart</button></div>'+GUIDE.map((g,i)=>{const st=g.done()?'done':i===cur?'cur':'';
      return '<div class="gStep '+st+'"><div class="gNum">'+(g.done()?'✓':i+1)+'</div><div><b>'+g.t+'</b>'+(i===cur?'<p>'+g.d+'</p><div class="gBtns"><button onclick="GUIDE['+i+'].go()">'+g.btn+'</button></div>':'')+'</div></div>';}).join('');
    if(cur<0)h+='<p style="margin:8px 0 0;color:#7dfc9a;font-size:14px">All steps done. Tap <b>Close job</b> to see your score.</p>';
    const hs=HINTS[job.orig]||[];
    for(let i=0;i<job.hints;i++)h+='<div class="gHint">💡 '+hs[i]+'</div>';
    if(job.hints<hs.length)h+='<div class="gBtns"><button class="alt" onclick="useHint()">Stuck? Get a hint (+3 min)</button></div>';
    h+='</div>';
  }
  el.innerHTML=h;
}
function useHint(){const hs=HINTS[job.orig]||[];if(job.hints>=hs.length)return;job.time+=3;job.hints++;render();}

newJob();
</script>
