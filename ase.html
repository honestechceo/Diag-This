{t:'A5',a:'C',q:'Torn caliper guide pin boots most likely lead to:',o:['Corroded, sticking guide pins and uneven pad wear','Spongy pedal','ABS faults','Brake fluid boiling'],c:0,w:'Moisture and dirt get in and the caliper can no longer slide freely.'},
{t:'A5',a:'C',q:'What is an advantage of an on-car brake lathe?',o:['It compensates for hub runout by machining the rotor on the vehicle','It\'s always faster','It removes less metal in every case','It doesn\'t need tools'],c:0,w:'Machining in place matches the rotor to the hub it runs on.'},
{t:'A5',a:'C',q:'Glazed brake pads most likely cause:',o:['Higher pedal effort and reduced braking','Brake pull only','A spongy pedal','An ABS light'],c:0,w:'Glazing reduces friction. Find the cause, such as overheating or dragging.'},
{t:'A5',a:'C',q:'What retracts a disc brake caliper piston slightly after release?',o:['The square-cut piston seal deflecting and returning','A return spring','The master cylinder','The ABS pump'],c:0,w:'The seal flexes during apply and pulls the piston back a little on release.'},
{t:'A5',a:'C',q:'Before installing a new rotor, why should hub flange runout be checked?',o:['Excessive hub runout causes the new rotor to run out and later pulsate','It isn\'t necessary','It sets wheel alignment','It sets the ABS gap'],c:0,w:'Clean the hub and check runout. Correct or replace as specified.'},
{t:'A5',a:'D',q:'A brief buzz or click from the ABS unit right after startup or at low speed is usually:',o:['A normal self-test','A failed pump','Air in the lines','A bad wheel sensor'],c:0,w:'Many ABS systems run the pump and valves briefly to check them.'},
{t:'A5',a:'D',q:'On a passive ABS sensor with an adjustable air gap, the gap is set with:',o:['A nonmagnetic (brass or plastic) feeler gauge','A steel feeler gauge','A ruler','A dial indicator'],c:0,w:'A steel gauge would stick to the magnetic sensor and give a false gap.'},
{t:'A5',a:'D',q:'Mismatched tire sizes on a vehicle can cause:',o:['ABS/TCS warning lights or unwanted activation','Better braking','No effect','Spongy pedal'],c:0,w:'The modules compare wheel speeds. A smaller tire spins faster and looks like slip.'},
{t:'A5',a:'D',q:'On many modern vehicles, electronic brake force distribution (EBD):',o:['Replaces the mechanical proportioning valve by using ABS valves to limit rear pressure','Controls the parking brake','Only works with drum brakes','Adds engine braking'],c:0,w:'EBD balances front-to-rear braking using the ABS hydraulics.'},
{t:'A5',a:'D',q:'What does hill-start assist do?',o:['Briefly holds brake pressure after the pedal is released so the vehicle doesn\'t roll back','Adds throttle','Locks the transmission in park','Disables ABS'],c:0,w:'The ABS/ESC unit holds pressure for a moment while the driver moves to the accelerator.'},
{t:'A5',a:'D',q:'How does an ESC system know how hard the driver is pressing the brakes?',o:['A brake pressure sensor (often at the master cylinder or hydraulic unit)','A wheel speed sensor','A yaw sensor','The TPS'],c:0,w:'Pressure input helps the module work out driver intent and brake assist.'},

/* ===== A6 ===== */
{t:'A6',a:'A',q:'In a series circuit, the voltage drops across all the loads and conductors add up to:',o:['The source voltage','Zero','Half the source voltage','The current'],c:0,w:'This is Kirchhoff\'s voltage law. Unexpected drops show where resistance is hiding.'},
{t:'A6',a:'A',q:'If resistance increases in a series circuit with constant voltage, current will:',o:['Decrease','Increase','Stay the same','Reverse'],c:0,w:'I = E ÷ R. More resistance means less current, so lamps dim and motors slow.'},
{t:'A6',a:'A',q:'How is an ammeter connected to measure circuit current?',o:['In series with the circuit','In parallel across the load','Across the battery','To ground only'],c:0,w:'All circuit current must pass through the meter. Use the 10 A jack and never connect across a voltage source.'},
{t:'A6',a:'A',q:'Resistance should be measured with:',o:['The circuit or component de-energized','The circuit powered','The key on','The engine running'],c:0,w:'Ohmmeters use their own small current. Outside voltage gives false readings and can damage the meter.'},
{t:'A6',a:'A',q:'Which wire size can carry more current?',o:['12 AWG','18 AWG','20 AWG','22 AWG'],c:0,w:'A smaller AWG number means a larger wire.'},
{t:'A6',a:'A',q:'What is the best repair for a damaged wire in the engine compartment?',o:['Soldered or crimped splice sealed with adhesive-lined heat-shrink','Twist and tape','Wire nut','Scotch-lock connector'],c:0,w:'Sealed splices keep moisture and corrosion out.'},
{t:'A6',a:'B',q:'A parasitic draw test reads 250 mA after the modules go to sleep. What is the next step?',o:['Pull fuses one at a time to find which circuit drops the draw','Replace the battery','Replace the alternator','Accept it as normal'],c:0,w:'250 mA is excessive on most vehicles. Isolating it by fuse narrows down the circuit.'},
{t:'A6',a:'B',q:'Battery terminals are covered in white, crusty corrosion. What is the correct cleaning method?',o:['Baking soda and water, then a terminal brush and protective coating','Gasoline','Engine oil','Leave it'],c:0,w:'Baking soda neutralizes acid. Keep it out of the cells.'},
{t:'A6',a:'B',q:'During a starter current draw test, the engine should be:',o:['Prevented from starting by disabling fuel or ignition per procedure','Running','Started and revved','Hot only'],c:0,w:'You want a steady cranking reading, so keep the engine from starting.'},
{t:'A6',a:'B',q:'After a battery replacement on some newer vehicles, what may be required?',o:['Registering the new battery with the battery management system','Replacing the alternator','A wheel alignment','Bleeding the brakes'],c:0,w:'The BMS adjusts charging for battery age and type. Skipping registration can overcharge the new battery or shorten its life.'},
{t:'A6',a:'C',q:'A leaking alternator diode can cause:',o:['Battery drain with the engine off and AC ripple while running','Overcharging only','A no-crank with a good battery','Dim dash lights only'],c:0,w:'A bad diode can let current flow backward from the battery through the alternator.'},
{t:'A6',a:'C',q:'Many charging systems use a battery temperature sensor to:',o:['Adjust charging voltage (higher when cold, lower when hot)','Turn on the fan','Measure electrolyte level','Control the starter'],c:0,w:'Batteries need more voltage to charge in the cold and less in the heat.'},
{t:'A6',a:'C',q:'Bulbs burn out often and the battery smells of acid. What is the most likely cause?',o:['Overcharging','Undercharging','A bad starter','A parasitic draw'],c:0,w:'Excess voltage overheats filaments and boils off electrolyte.'},
{t:'A6',a:'D',q:'LED bulbs installed in place of incandescent turn signal bulbs make the signals flash fast. What is the fix?',o:['Install load resistors or an LED-compatible flasher','Use bigger fuses','Change the switch','Nothing; it\'s normal'],c:0,w:'LEDs draw less current, so the flasher thinks a bulb is out.'},
{t:'A6',a:'D',q:'After a front-end repair, adaptive (steerable or auto-leveling) headlights point incorrectly. What is needed?',o:['Calibration/aim with a scan tool per procedure','New bulbs','Bigger fuses','Nothing'],c:0,w:'These systems need their zero positions set after parts or ride height change.'},
{t:'A6',a:'D',q:'The hazard lights work, but the turn signals don\'t. Where is the most likely problem?',o:['Turn signal fuse/feed or the turn signal switch','All bulbs','The ground at each lamp','The battery'],c:0,w:'The bulbs work on hazards, so the fault is in the part of the circuit only the turn signals use.'},
{t:'A6',a:'E',q:'The airbag light is on and the horn doesn\'t work. What is the most likely cause?',o:['A failed clockspring','A bad horn relay only','A bad SRS module only','A blown horn fuse only'],c:0,w:'The clockspring carries both the driver airbag and horn circuits through the turning steering wheel.'},
{t:'A6',a:'E',q:'After a collision, the seat belt pretensioners have deployed. What should be done?',o:['Replace them per manufacturer procedure','Reset them','Reuse them','Disable them'],c:0,w:'Pretensioners are single-use pyrotechnic devices.'},
{t:'A6',a:'E',q:'A power seat moves forward but not backward. What is the most likely cause?',o:['The seat switch, since the motor reverses by switching polarity','A bad motor','A blown fuse','A bad ground'],c:0,w:'If the motor runs one way, it\'s probably good. The switch flips polarity to reverse it.'},
{t:'A6',a:'E',q:'Cruise control won\'t engage, but the brake lights work. What should be checked?',o:['The brake (and clutch) switch cruise circuits','The headlight switch','The wiper motor','The radio'],c:0,w:'Brake switches often have a separate cruise circuit that has to show "released."'},
{t:'A6',a:'E',q:'A whine in the radio speakers rises and falls with engine speed. What is the most likely cause?',o:['Alternator noise from a bad diode or poor ground','A bad speaker','A bad antenna','Low fuel'],c:0,w:'Check the grounds and the alternator\'s AC ripple.'},
{t:'A6',a:'E',q:'After disconnecting the battery, the radio asks for a code. What is this?',o:['An anti-theft feature that needs the security code entered','A failed radio','A blown fuse','A failed antenna'],c:0,w:'Have the customer\'s code ready (or use a memory saver) before disconnecting the battery.'},
{t:'A6',a:'E',q:'Many body modules control lamps with pulse-width modulation (PWM). What should be used to check the output?',o:['A scope or a DMM with duty cycle function','A test light only','An ohmmeter','A hydrometer'],c:0,w:'A plain voltmeter shows an average. A scope shows the actual switching.'},
{t:'A6',a:'E',q:'The dome light stays on and the battery drains overnight. What is a common cause?',o:['A stuck door ajar switch','A bad alternator','A bad starter','Low coolant'],c:0,w:'The body module thinks a door is open and keeps the lights and modules awake.'},
{t:'A6',a:'E',q:'After a windshield replacement, the automatic (rain-sensing) wipers act erratically. What is a likely cause?',o:['The rain sensor isn\'t properly coupled to the new glass (missing gel pad or bracket)','A bad wiper motor','A low washer fluid level','A blown fuse'],c:0,w:'The optical sensor needs a proper bond to the glass. Some also need calibration.'},

/* ===== A7 ===== */
{t:'A7',a:'A',q:'When judging A/C gauge readings, why does ambient temperature matter?',o:['Normal pressures change with ambient temperature, so compare them to a chart','It doesn\'t matter','Pressures are always the same','Only humidity matters'],c:0,w:'High-side pressure rises with outside temperature. Use the manufacturer\'s chart.'},
{t:'A7',a:'A',q:'Is it legal to intentionally vent automotive refrigerant into the atmosphere?',o:['No, it must be recovered with approved equipment','Yes, if it\'s R-134a','Yes, in small amounts','Only outdoors'],c:0,w:'Federal law prohibits venting. Use certified recovery and recycling equipment.'},
{t:'A7',a:'A',q:'When replacing an A/C O-ring, the technician should:',o:['Use the correct O-ring material and lubricate it with the specified refrigerant oil','Reuse the old one','Use silicone sealant','Install it dry'],c:0,w:'The right O-ring and lubricant prevent leaks and twisting.'},
{t:'A7',a:'A',q:'Heater output is weak at idle and improves at higher rpm. What is the most likely cause?',o:['Low coolant, air in the system or a weak water pump','Bad blend door','Bad blower resistor','Low refrigerant'],c:0,w:'At idle, coolant flow through the heater core is lowest. Restricted flow shows up first there.'},
{t:'A7',a:'A',q:'Technician A says mixing different coolant types can reduce corrosion protection. Technician B says to use the coolant type the manufacturer specifies. Who is correct?',o:[TA,TB,BOTH,NEI],c:2,w:'Incompatible additive packages can drop out or cut service life.'},
{t:'A7',a:'A',q:'An electric cooling fan runs all the time, even on a cold engine. What is a likely cause?',o:['A stuck fan relay or a faulty ECT signal','A low refrigerant charge','A bad thermostat stuck open','A bad blend door'],c:0,w:'Check the relay, then the coolant temperature reading on the scan tool. Some systems also run the fan when A/C pressure is high.'},
{t:'A7',a:'A',q:'Coolant goes into the overflow tank but never returns to the radiator, and the radiator ends up low. What is the most likely cause?',o:['Radiator cap vacuum (return) valve stuck','Bad water pump','Stuck-open thermostat','Low refrigerant'],c:0,w:'As the engine cools, the cap\'s vacuum valve should let coolant be drawn back from the reservoir.'},
{t:'A7',a:'A',q:'After evacuating an A/C system, the vacuum gauge rises when the pump is isolated. What does this indicate?',o:['A leak or remaining moisture','Normal','An overcharge','A bad compressor clutch'],c:0,w:'A vacuum decay test confirms the system is tight before charging.'},
{t:'A7',a:'A',q:'When a major A/C component is replaced, how much refrigerant oil should be added?',o:['The amount the manufacturer specifies for that component','None','A full system\'s worth every time','A random amount'],c:0,w:'Oil stays in components. Too little starves the compressor, and too much hurts cooling.'},
{t:'A7',a:'A',q:'R-134a and R-1234yf systems use different service port fittings. Why?',o:['To prevent cross-contamination and the wrong refrigerant being used','For appearance only','To increase pressure','It\'s just a brand difference'],c:0,w:'Unique fittings make it hard to connect the wrong equipment.'},
{t:'A7',a:'B',q:'A compressor makes grinding noises with the clutch engaged and metal debris is found in the orifice tube. What else should be done along with the compressor?',o:['Flush the system and replace the accumulator/drier and the orifice tube or TXV','Replace only the compressor','Add oil only','Replace the blower motor'],c:0,w:'Debris spreads through the system. Without a flush and filter replacement, the new compressor will fail.'},
{t:'A7',a:'B',q:'Low-side pressure is high and high-side pressure is low with the compressor engaged. What is the most likely cause?',o:['A weak or failing compressor','An overcharge','A restricted orifice','Condenser airflow blocked'],c:0,w:'The compressor isn\'t building the pressure difference between the sides.'},
{t:'A7',a:'B',q:'The A/C cools well at first, then airflow drops and the air gets warm after a long drive. What is the most likely cause?',o:['Evaporator icing from a faulty cycling switch or evaporator temperature sensor','A failed blower motor','A bad heater valve','A low coolant level'],c:0,w:'Ice blocks airflow through the evaporator core. Airflow returns once it thaws.'},
{t:'A7',a:'B',q:'One area of the condenser is much cooler than the rest, and the high side is high. What is the most likely cause?',o:['An internal condenser restriction','An undercharge','A bad blower','A bad blend door'],c:0,w:'A temperature drop at a restriction is a classic sign.'},
{t:'A7',a:'B',q:'Frost forms at the receiver-drier outlet. What does this indicate?',o:['A restriction in the receiver-drier','Normal operation','An overcharge','A bad compressor clutch'],c:0,w:'Refrigerant expands at the restriction and gets cold.'},
{t:'A7',a:'C',q:'On a cycling clutch orifice tube (CCOT) system, what normally controls compressor cycling?',o:['A low-side pressure (cycling) switch','The high-pressure switch only','The blower switch','The thermostat'],c:0,w:'The switch cycles the clutch to keep the evaporator above freezing.'},
{t:'A7',a:'C',q:'On many vehicles, how does the A/C request reach the compressor?',o:['The HVAC control signals the PCM, which controls the compressor relay (and raises idle)','The compressor turns on directly from the switch','The blower motor powers it','The battery sensor controls it'],c:0,w:'The PCM may also cut the compressor at wide-open throttle or high coolant temperature.'},
{t:'A7',a:'C',q:'After a battery disconnect, the blend doors don\'t move to the correct positions. What is often required?',o:['An actuator calibration/relearn','A new actuator','A refrigerant recharge','A new blower motor'],c:0,w:'Many systems re-home their actuators after power loss using a set procedure.'},
{t:'A7',a:'C',q:'The blower motor runs even with the key off. What is the most likely cause?',o:['A stuck blower relay or shorted control module output','A bad resistor','A bad motor','A blown fuse'],c:0,w:'Something is keeping power applied. Check the relay first.'},
{t:'A7',a:'C',q:'On automatic climate control, how are faults usually retrieved?',o:['With a scan tool or the system\'s built-in self-diagnostic mode','With a test light only','By guessing','With a vacuum gauge'],c:0,w:'HVAC modules store DTCs for sensors, actuators and communication.'},
{t:'A7',a:'C',q:'On a 50°F day the A/C compressor won\'t engage. The ambient temperature sensor reads 30°F. What is the most likely explanation?',o:['The system thinks it\'s too cold outside and locks out the compressor','The compressor clutch is worn out','The refrigerant is overcharged','The blower motor has failed'],c:0,w:'Many systems disable the compressor at low ambient temperatures to protect it.'},
{t:'A7',a:'C',q:'The compressor clutch disengages briefly at wide-open throttle. What is this?',o:['A normal PCM strategy to give the engine more power','A failing clutch','Low refrigerant','A bad relay'],c:0,w:'Explain the strategy to the customer. It\'s by design.'},
{t:'A7',a:'C',q:'In a dual-zone system, the passenger side blows the wrong temperature but the driver side is fine. What is the most likely cause?',o:['The passenger-side blend door or its actuator','The compressor','The heater core','The blower motor'],c:0,w:'Shared components work, so the fault is in that zone\'s blend control.'},
{t:'A7',a:'C',q:'On many automatic climate systems, how is blower speed controlled?',o:['By a module or power transistor using PWM','By a fixed resistor block only','By the compressor','By the thermostat'],c:0,w:'Variable blower control modules need good power, ground and cooling. A failed module can cause stuck or no blower speeds.'},
{t:'A7',a:'C',q:'One heated seat doesn\'t warm up, and the other works. What is the most likely cause?',o:['An open heating element or connection in that seat','The A/C compressor','A failed blower','The engine thermostat'],c:0,w:'Check for power and ground at the seat, then the element\'s resistance.'},

/* ===== A8 ===== */
{t:'A8',a:'A',q:'An engine stalls intermittently. What is the best approach?',o:['Record scan data (or use a recorder) and do wiggle tests to catch the fault','Replace the fuel pump','Clear codes and return the vehicle','Replace the PCM'],c:0,w:'Intermittent faults have to be captured, so record data and try to recreate the conditions.'},
{t:'A8',a:'A',q:'An engine hesitates only when cold. Scan data shows the ECT reading 160°F on a cold-soaked engine. What is the most likely cause?',o:['Faulty ECT sensor reading too hot, so not enough cold enrichment','A vacuum leak','Bad spark plugs','A clogged cat'],c:0,w:'After the engine sits, ECT and IAT should read close to ambient temperature.'},
{t:'A8',a:'A',q:'A five-gas analyzer shows high HC with normal CO. What is the most likely cause?',o:['A misfire','A rich mixture','A clogged air filter','High fuel pressure'],c:0,w:'Unburned fuel from a misfire raises HC. A rich mixture raises CO.'},
{t:'A8',a:'A',q:'High CO in the exhaust indicates:',o:['A rich mixture','A lean mixture','A misfire only','An EGR fault'],c:0,w:'CO forms when there isn\'t enough oxygen to burn the fuel completely.'},
{t:'A8',a:'A',q:'A five-gas analyzer shows high O2 and high HC. What is the most likely cause?',o:['A misfire or extremely lean condition','A rich mixture','Normal operation','A good catalytic converter'],c:0,w:'Unburned air and fuel pass straight through a cylinder that isn\'t firing.'},
{t:'A8',a:'A',q:'Mode $06 data on the scan tool shows:',o:['On-board monitor test results and limits, including misfire counts on many vehicles','Freeze frame only','VIN and calibration','Live sensor voltages only'],c:0,w:'Mode $06 can reveal a test that is close to failing before a code sets.'},
{t:'A8',a:'B',q:'Ignition timing that\'s too far advanced most likely causes:',o:['Detonation (spark knock/ping) under load','Low power at idle only','A rich mixture','Low oil pressure'],c:0,w:'Too much advance raises cylinder pressure too early, which causes knock.'},
{t:'A8',a:'B',q:'P0016 (crankshaft/camshaft position correlation) is set. Which is a likely cause?',o:['A stretched or jumped timing chain, or a VVT fault','A bad O2 sensor','A low coolant level','A clogged air filter'],c:0,w:'The cam isn\'t where the PCM expects relative to the crank. Check oil level and VVT, then timing marks.'},
{t:'A8',a:'B',q:'How should spark plug gap be checked on fine-wire (iridium or platinum) plugs?',o:['With a wire-type gauge, without prying on the fine center electrode','By prying the center electrode','With a coin-style gauge forced into the gap','It never needs checking'],c:0,w:'Fine electrodes break easily. Adjust only the ground electrode if needed, and only if allowed.'},
{t:'A8',a:'C',q:'A low-amp probe on the fuel pump circuit shows uneven current humps with some very low ones. What is the most likely cause?',o:['Worn pump commutator or brushes','Normal operation','A bad injector','A clogged air filter'],c:0,w:'Each hump is a commutator segment. Irregular humps mean a worn motor.'},
{t:'A8',a:'C',q:'Fuel pressure drops when the engine is under load. What is a likely cause?',o:['A clogged fuel filter or a weak pump','A leaking injector','A bad TPS','Too much spark advance'],c:0,w:'A restriction limits flow when demand is highest.'},
{t:'A8',a:'C',q:'A turbocharged engine has low boost and sets a boost-related code. What should be checked first?',o:['Charge air (intercooler) leaks and wastegate operation','The spark plugs only','The catalytic converter only','The fuel cap'],c:0,w:'A split intercooler hose or a stuck-open wastegate is a common cause.'},
{t:'A8',a:'C',q:'A high-mileage GDI engine has a rough idle and misfires. Heavy carbon is found on the intake valves. What is a common repair?',o:['Clean the intake valves (for example, walnut blasting)','Replace the fuel pump','Replace the O2 sensors','Add fuel injector cleaner only'],c:0,w:'GDI doesn\'t spray fuel on the intake valves, so deposits build up there.'},
{t:'A8',a:'C',q:'Code P0011 (camshaft timing over-advanced, bank 1) is set and the engine idles rough. What is a likely cause?',o:['A sticking VVT oil control solenoid or low/dirty oil','A clogged EGR','A bad MAF only','A weak battery'],c:0,w:'VVT works on oil pressure. Check the oil level and condition, then the solenoid.'},
{t:'A8',a:'D',q:'P0401 (EGR insufficient flow) is set. The EGR valve works when commanded. What is the next likely cause?',o:['Clogged EGR passages','A bad O2 sensor','A low fuel level','A bad knock sensor'],c:0,w:'Carbon buildup blocks flow even when the valve opens.'},
{t:'A8',a:'D',q:'A new catalytic converter is about to be installed. What must be done first?',o:['Find and fix what damaged the original (misfire, rich running, oil or coolant burning)','Nothing','Remove the O2 sensors','Disable the EVAP system'],c:0,w:'Misfires and rich running overheat and destroy converters.'},
{t:'A8',a:'D',q:'The fuel pump nozzle keeps clicking off while refueling. Which EVAP component is a likely cause?',o:['A blocked or stuck-closed vent valve/canister','A stuck-open purge valve','A bad gas cap','A bad fuel pump'],c:0,w:'Air must escape the tank as fuel goes in. A blocked vent path stops it.'},
{t:'A8',a:'D',q:'Oil is found in the air cleaner housing. What is the most likely cause?',o:['Excessive blow-by pushing crankcase vapors through the PCV fresh-air hose','A bad MAF sensor','A clogged fuel filter','A bad O2 sensor'],c:0,w:'Check the PCV valve and engine condition (rings).'},
{t:'A8',a:'E',q:'What does closed loop mean?',o:['The PCM is using O2/AF sensor feedback to adjust fuel','The engine is cold','The throttle is closed','The PCM ignores sensors'],c:0,w:'Open loop (cold start, wide-open throttle) uses preset values.'},
{t:'A8',a:'E',q:'With the key on and the engine off, what should a MAP sensor read?',o:['Barometric (atmospheric) pressure','Zero','Full vacuum','Boost pressure'],c:0,w:'With no engine running, manifold pressure equals atmospheric pressure. Compare it to the BARO PID.'},
{t:'A8',a:'E',q:'After an overnight cold soak, the IAT reads 72°F and the ECT reads 25°F. Ambient temperature is 70°F. What does this suggest?',o:['A problem with the ECT sensor or its circuit','Normal readings','A bad thermostat','A low battery'],c:0,w:'After a cold soak, both should read near ambient temperature. The one that\'s off is the suspect.'},
{t:'A8',a:'E',q:'In an injector or solenoid circuit, duty cycle means:',o:['The percentage of time the device is on during each cycle','The number of cycles per second','The voltage level','The resistance of the coil'],c:0,w:'Frequency is cycles per second. Duty cycle is on-time as a percentage.'},
{t:'A8',a:'E',q:'A Hall-effect sensor typically produces:',o:['A digital square-wave signal','An AC sine wave that increases with speed','A steady 12 V','A resistance change only'],c:0,w:'Hall sensors need power and switch the signal on and off. Magnetic (variable reluctance) sensors make AC signals.'},
{t:'A8',a:'E',q:'The scan tool won\'t communicate with any module. What should be checked first?',o:['DLC power (pin 16) and grounds (pins 4 and 5)','The PCM software','The O2 sensors','The fuel pressure'],c:0,w:'Without power and ground at the connector, no tool will connect.'},
{t:'A8',a:'E',q:'After repairing a large vacuum leak, the engine runs rich for a while. What should be done?',o:['Reset or relearn fuel trims (clear adaptive memory) per procedure','Replace the O2 sensor','Replace injectors','Do nothing ever'],c:0,w:'The PCM had learned to add fuel. Resetting the trims speeds up the return to normal.'}
);

const $=id=>document.getElementById(id);
let store={};try{store=JSON.parse(localStorage.getItem('ce_ase2')||'{}');}catch(e){}
store.q=store.q||{};store.bm=store.bm||{};store.exams=store.exams||[];
function save(){try{localStorage.setItem('ce_ase2',JSON.stringify(store));}catch(e){}}
Q.forEach((q,i)=>q.id=i);
const st=id=>store.q[id]||{r:0,w:0,last:null};
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function mastered(qs){return qs.filter(q=>st(q.id).last===1).length;}
const L='ABCD';
const isTech=q=>q.o[0]===TA;
function priority(q){const s=st(q.id);if(s.last===null)return 2;return s.w*2-s.r+(s.last===0?3:0);}


// Estimated difficulty tiers based on question wording; not independently ASE-calibrated.
let difficultyLevel='all';
function difficultyOf(q){
 if(q.difficulty)return q.difficulty;
 const stem=q.q.toLowerCase();
 const advanced=/technician a|technician b|oscilloscope|waveform|voltage drop|duty cycle|scan tool data|freeze.frame|intermittent|diagnostic procedure|most likely cause|which test|what should.*first|pressure reading|current ramp|fuel trim/.test(stem);
 const intermediate=/diagnos|symptom|measurement|test shows|reading|when .*engine|while .*engine|what is the cause|why|which component/.test(stem);
 return advanced?'advanced':intermediate?'intermediate':'beginner';
}
function difficultyMatches(q){return difficultyLevel==='all'||difficultyOf(q)===difficultyLevel;}
function setDifficulty(level){difficultyLevel=level;home();}
function difficultyControls(){return '<h2 style="margin-top:16px">Choose your level</h2><p class="sub">Estimated from question complexity; all levels use the existing question bank.</p><div class="difficulty">'+[['beginner','Beginner','Fundamentals'],['intermediate','Intermediate','Diagnosis'],['advanced','Advanced','Complex cases']].map(x=>'<button class="'+(difficultyLevel===x[0]?'active':'')+'" onclick="setDifficulty(\''+x[0]+'\')">'+x[1]+'<small>'+x[2]+'</small></button>').join('')+'</div><button class="ghost" onclick="setDifficulty(\'all\')">'+(difficultyLevel==='all'?'✓ ':'')+'All difficulty levels</button>';}
function levelQuiz(){const ids=Q.filter(difficultyMatches).map(q=>q.id);startQuiz(shuffle(ids).slice(0,20),'Level practice · '+difficultyLevel,false);}
function home(){
  const total=mastered(Q),bms=Object.keys(store.bm).filter(k=>store.bm[k]).length;
  const answered=Q.filter(q=>st(q.id).last!==null).length;
  $('app').innerHTML='<div class="hazard"></div><nav class="topnav"><a href="index.html">Garage</a><a href="quick.html">Quick jobs</a><a href="fan.html">Fan lab</a><a href="ign.html">Ignition lab</a><a href="ase.html" class="on">ASE prep</a></nav>'+
   '<div class="hero"><h1>ASE <span>Prep</span></h1><p class="sub">'+Q.length+' practice questions for the ASE Automobile tests A1–A8. '+answered+' answered, '+total+' currently correct.</p></div>'+
   '<div class="stats"><div class="stat"><strong>'+Q.length+'</strong><small>Questions</small></div><div class="stat"><strong>'+answered+'</strong><small>Attempted</small></div><div class="stat"><strong>'+Math.round(total/Q.length*100)+'%</strong><small>Mastered</small></div></div>'+difficultyControls()+'<button class="big" onclick="levelQuiz()">Practice '+(difficultyLevel==='all'?'all levels':difficultyLevel)+' · 20 questions</button><h2 style="margin-top:20px">Training modes</h2><div class="grid2"><button class="feat" onclick="smart()"><b>Smart review</b><span>20 questions, weakest and unseen first</span></button>'+
   '<button class="feat" onclick="examPick()"><b>Exam simulation</b><span>Timed, weighted like the real test</span></button>'+
   '<button class="feat" onclick="quick10()"><b>Quick 10</b><span>Random mix from every test</span></button>'+
   '<button class="feat" '+(bms?'':'disabled')+' onclick="startQuiz(Object.keys(store.bm).filter(k=>store.bm[k]).map(Number),\'Bookmarked\',false)"><b>Bookmarked</b><span>'+bms+' saved</span></button></div>'+
   '<h2 style="margin-top:14px">Study by test</h2>'+
   Object.keys(TESTS).map(k=>{const T=TESTS[k],qs=Q.filter(q=>q.t===k),m=mastered(qs);return '<button class="test" onclick="testView(\''+k+'\')"><div class="badge">'+k+'</div><div style="flex:1;min-width:0"><b>'+T.name+'</b><small>'+qs.length+' questions · real test: '+T.scored+' scored, '+T.time+' min</small><div class="prog"><i style="width:'+Math.round(m/qs.length*100)+'%"></i></div></div><div class="pct">'+Math.round(m/qs.length*100)+'%</div></button>';}).join('')+
   (store.exams.length?'<h2 style="margin-top:14px">Recent exams</h2><div class="card">'+store.exams.slice(-5).reverse().map(e=>'<div class="area"><div><b>'+e.t+' exam</b><div class="n">'+e.d+' · '+e.n+' questions · '+e.m+' min</div></div><div class="pct" style="color:'+(e.p>=70?'var(--green)':'var(--red)')+'">'+e.p+'%</div></div>').join('')+'</div>':'')+
   '<p class="note">These are original practice questions written in the ASE style. They are not actual ASE test questions. Content areas and scored-question counts come from ASE\'s 2025 Automobile Study Guide. ASE sets passing scores per test, so practice scores are a guide, not a guarantee. Check ase.com for current specifications.</p>'+
   '<button class="ghost" style="margin-top:18px" onclick="if(confirmReset())home()">Reset my progress</button>';
  window.scrollTo(0,0);
}
let resetArm=0;function confirmReset(){if(Date.now()-resetArm<4000){store={q:{},bm:{},exams:[]};save();return true;}resetArm=Date.now();toast('Tap reset again within 4 seconds to erase progress.');return false;}
function toast(t){const d=document.createElement('div');d.className='why';d.style.position='fixed';d.style.left='12px';d.style.right='12px';d.style.bottom='12px';d.style.zIndex=9;d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2600);}
function smart(){const ids=Q.filter(difficultyMatches).slice().sort((a,b)=>priority(b)-priority(a)||Math.random()-.5).slice(0,20).map(q=>q.id);startQuiz(ids,'Smart review',false);}
function quick10(){startQuiz(shuffle(Q.filter(difficultyMatches).map(q=>q.id)).slice(0,10),'Quick 10',false);}
function testView(k){
  const T=TESTS[k],qs=Q.filter(q=>q.t===k&&difficultyMatches(q));
  $('app').innerHTML='<div class="hazard"></div><button class="back" onclick="home()">← All tests</button>'+
   '<h1>'+k+' · <span>'+T.name+'</span></h1><p class="sub">Real test: '+T.scored+' scored questions in '+T.time+' minutes. Each content area shows how many scored questions it gets on the real test.</p>'+
   (T.lab?'<a class="lablink" href="'+T.lab[0]+'">🔧 <span>Hands-on: <b>'+T.lab[1]+'</b> →</span></a>':'')+
   '<div class="card">'+Object.keys(T.areas).map(a=>{const [n,c]=T.areas[a],aq=qs.filter(q=>q.a===a),m=mastered(aq);
     return '<div class="area"><div><b>'+a+'. '+n+'</b><div class="n">'+c+' on real test · '+m+'/'+aq.length+' correct</div></div><button onclick="startQuiz(['+aq.map(q=>q.id)+'],\''+k+' · '+a+'. '+n.replace(/'/g,"\\'")+'\',false)">Study</button></div>';}).join('')+'</div>'+
   '<button class="big" onclick="startExam(\''+k+'\')">Exam simulation: '+k+'</button>'+
   '<button class="ghost" onclick="startQuiz(Q.filter(q=>q.t===\''+k+'\').map(q=>q.id),\''+k+' · all questions\',false)">Study all '+qs.length+' questions</button>'+
   '<button class="ghost" onclick="var ids=Q.filter(q=>q.t===\''+k+'\'&&st(q.id).last!==1).map(q=>q.id);ids.length?startQuiz(ids,\''+k+' · missed & new\',false):toast(\'Everything here is answered correctly. Nice.\')">Review missed &amp; unanswered</button>';
  window.scrollTo(0,0);
}
function examPick(){
  $('app').innerHTML='<div class="hazard"></div><button class="back" onclick="home()">← Back</button><h1>Exam <span>simulation</span></h1><p class="sub">Questions are drawn in proportion to each content area on the real test, and the timer is scaled to the real time limit. You won\'t see answers until you submit. You can flag questions and come back to them.</p>'+
   Object.keys(TESTS).map(k=>'<button class="test" onclick="startExam(\''+k+'\')"><div class="badge">'+k+'</div><div><b>'+TESTS[k].name+'</b><small>'+examSize(k)+' questions · '+examTime(k)+' min</small></div></button>').join('');
  window.scrollTo(0,0);
}
function examSize(k){return Math.min(TESTS[k].scored,Q.filter(q=>q.t===k).length);}
function examTime(k){return Math.round(TESTS[k].time*examSize(k)/TESTS[k].scored);}
function startExam(k){
  const T=TESTS[k],n=examSize(k),tot=Object.values(T.areas).reduce((s,a)=>s+a[1],0);
  let ids=[];const pools={};Object.keys(T.areas).forEach(a=>pools[a]=shuffle(Q.filter(q=>q.t===k&&q.a===a).map(q=>q.id)));
  Object.keys(T.areas).forEach(a=>{const want=Math.round(n*T.areas[a][1]/tot);ids.push(...pools[a].splice(0,want));});
  const rest=shuffle(Object.values(pools).flat());while(ids.length<n&&rest.length)ids.push(rest.pop());
  ids=shuffle(ids.slice(0,n));
  quiz={ids,i:0,title:k+' exam',exam:k,ans:{},pick:{},flag:{},start:Date.now(),end:Date.now()+examTime(k)*60000,order:{}};
  examQ();clearInterval(window.tick);window.tick=setInterval(examTick,1000);
}
function examTick(){if(!quiz||!quiz.exam){clearInterval(window.tick);return;}const left=Math.max(0,quiz.end-Date.now());const el=$('timer');if(el)el.textContent=Math.floor(left/60000)+':'+String(Math.floor(left%60000/1000)).padStart(2,'0');if(left<=0){clearInterval(window.tick);submitExam(true);}}
function orderFor(q){return quiz.order[q.id]||(quiz.order[q.id]=isTech(q)?[0,1,2,3]:shuffle([0,1,2,3]));}
function examQ(){
  const q=Q[quiz.ids[quiz.i]],ord=orderFor(q),answered=Object.keys(quiz.pick).length;
  $('app').innerHTML='<div class="examBar"><span>'+quiz.title+'</span><span id="timer">--:--</span><span>'+answered+'/'+quiz.ids.length+' answered</span></div>'+
   '<div class="qhead"><span>Question '+(quiz.i+1)+' of '+quiz.ids.length+'</span><button class="flagB'+(quiz.flag[q.id]?' on':'')+'" onclick="quiz.flag['+q.id+']=!quiz.flag['+q.id+'];examQ()">⚑ '+(quiz.flag[q.id]?'Flagged':'Flag')+'</button></div>'+
   '<div class="qtext">'+q.q+'</div>'+
   ord.map((oi,k)=>'<button class="opt'+(quiz.pick[q.id]===oi?' sel':'')+'" onclick="quiz.pick['+q.id+']='+oi+';examQ()"><span class="l">'+L[k]+'</span><span>'+q.o[oi]+'</span></button>').join('')+
   '<div class="navRow"><button class="ghost" '+(quiz.i?'':'disabled')+' onclick="quiz.i--;examQ()">← Prev</button><button class="ghost" onclick="'+(quiz.i+1<quiz.ids.length?'quiz.i++;examQ()':'reviewGrid()')+'">'+(quiz.i+1<quiz.ids.length?'Next →':'Review')+'</button></div>'+
   '<button class="ghost" onclick="reviewGrid()">Question grid / submit</button>';
  examTick();window.scrollTo(0,0);
}
function reviewGrid(){
  $('app').innerHTML='<div class="examBar"><span>'+quiz.title+'</span><span id="timer">--:--</span><span>'+Object.keys(quiz.pick).length+'/'+quiz.ids.length+'</span></div><h2 style="margin:10px 0">Review</h2><p class="sub">Tap a number to go back to it. Flagged questions are yellow, unanswered ones are outlined.</p><div class="qgrid">'+
   quiz.ids.map((id,i)=>'<button class="'+(quiz.flag[id]?'fl ':'')+(quiz.pick[id]===undefined?'un':'')+'" onclick="quiz.i='+i+';examQ()">'+(i+1)+'</button>').join('')+'</div>'+
   '<button class="big" onclick="submitExam(false)">Submit exam</button>';
  examTick();window.scrollTo(0,0);
}
function submitExam(timeUp){
  clearInterval(window.tick);
  quiz.ids.forEach(id=>{const q=Q[id],p=quiz.pick[id];quiz.ans[id]=p===q.c;record(id,p===q.c);});
  const ids=quiz.ids,right=ids.filter(id=>quiz.ans[id]).length,pct=Math.round(right/ids.length*100),mins=Math.max(1,Math.round((Date.now()-quiz.start)/60000));
  store.exams.push({t:quiz.exam,p:pct,n:ids.length,m:mins,d:new Date().toLocaleDateString()});store.exams=store.exams.slice(-30);save();
  const k=quiz.exam;quiz.exam=null;
  results(timeUp?'Time\'s up! ':'');
}
function record(id,ok){const s=st(id);if(ok)s.r++;else s.w++;s.last=ok?1:0;store.q[id]=s;save();}

let quiz;
function startQuiz(ids,title,test){
  if(!ids.length){toast('Nothing to review here.');return;}
  quiz={ids:shuffle(ids),i:0,title,ans:{},start:Date.now(),order:{}};
  question();
}
function question(){
  const q=Q[quiz.ids[quiz.i]],T=TESTS[q.t],ord=orderFor(q),s=st(q.id);
  $('app').innerHTML='<div class="hazard"></div><button class="back" onclick="home()">← Quit</button>'+
   '<div class="qhead"><span>'+quiz.title+'</span><span>'+(quiz.i+1)+' / '+quiz.ids.length+'</span></div>'+
   '<div class="prog"><i style="width:'+(quiz.i/quiz.ids.length*100)+'%"></i></div>'+
   '<div class="qhead"><span>'+q.t+' · '+T.areas[q.a][0]+(s.last!==null?' · you: '+s.r+'✓ '+s.w+'✗':'')+'</span><button class="flagB'+(store.bm[q.id]?' on':'')+'" onclick="store.bm['+q.id+']=!store.bm['+q.id+'];save();this.classList.toggle(\'on\');this.textContent=store.bm['+q.id+']?\'★ Saved\':\'☆ Save\'">'+(store.bm[q.id]?'★ Saved':'☆ Save')+'</button></div>'+
   '<div class="qtext">'+q.q+'</div>'+
   ord.map((oi,k)=>'<button class="opt" data-oi="'+oi+'" onclick="pick('+oi+')"><span class="l">'+L[k]+'</span><span>'+q.o[oi]+'</span></button>').join('')+
   '<div id="after"></div>';
  window.scrollTo(0,0);
}
function explainChoices(q,selected){
  const reasons=q.whyWrong||q.distractors||{};
  return '<div class="card"><b>Answer-by-answer review</b>'+q.o.map((choice,i)=>{
    const correct=i===q.c;
    const reason=correct?q.w:(reasons[i]||'This choice does not best satisfy the question. Compare it with the correct answer and the diagnostic reasoning above.');
    return '<div class="area" style="display:block"><b style="color:'+(correct?'var(--green)':'var(--muted)')+'">'+(correct?'✓ Correct: ':'✗ Not best: ')+escapeReview(choice)+(i===selected?' (your selection)':'')+'</b><div class="sub">'+escapeReview(reason)+'</div></div>';
  }).join('')+'</div>';
}
function escapeReview(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function pick(oi){
  const q=Q[quiz.ids[quiz.i]],ok=oi===q.c;
  if(quiz.ans[q.id]!==undefined)return;
  quiz.ans[q.id]=ok;record(q.id,ok);
  document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;const v=+b.dataset.oi;if(v===q.c)b.classList.add('right');else if(v===oi)b.classList.add('wrong');});
  const last=quiz.i+1>=quiz.ids.length;
  $('after').innerHTML='<div class="why"><b class="'+(ok?'ok':'no')+'">'+(ok?'Correct.':'Not quite. The answer is: '+q.o[q.c]+'.')+'</b><br>'+q.w+'</div>'+
   (TESTS[q.t].lab&&!ok?'<a class="lablink" href="'+TESTS[q.t].lab[0]+'">🔧 <span>Practice it hands-on: <b>'+TESTS[q.t].lab[1]+'</b></span></a>':'')+
   explainChoices(q,oi)+
   '<button class="big" onclick="next()">'+(last?'See results':'Next question')+'</button>';
  $('after').scrollIntoView({behavior:'smooth',block:'nearest'});
}
function next(){quiz.i++;if(quiz.i>=quiz.ids.length)results('');else question();}
function results(prefix){
  const ids=quiz.ids,right=ids.filter(id=>quiz.ans[id]).length,pct=Math.round(right/ids.length*100);
  const by={};ids.forEach(id=>{const q=Q[id],k=q.t+'·'+q.a;by[k]=by[k]||{t:q.t,a:q.a,r:0,n:0};by[k].n++;if(quiz.ans[id])by[k].r++;});
  const mins=Math.max(1,Math.round((Date.now()-quiz.start)/60000)),missed=ids.filter(id=>!quiz.ans[id]);
  $('app').innerHTML='<div class="hazard"></div><button class="back" onclick="home()">← All tests</button>'+
   '<h2 style="margin-top:8px">'+prefix+quiz.title+'</h2><div class="score" style="color:'+(pct>=70?'var(--green)':'var(--red)')+'">'+pct+'%</div>'+
   '<p class="sub">'+right+' of '+ids.length+' correct · about '+mins+' min. '+(pct>=70?'Good result. ASE sets passing scores per test, so treat this as a good sign, not a guarantee.':'Focus on the weakest areas below, then use Smart review.')+'</p>'+
   '<div class="card"><table class="res"><tr><td><b>Content area</b></td><td style="text-align:right"><b>Score</b></td></tr>'+
   Object.values(by).sort((a,b)=>a.r/a.n-b.r/b.n).map(x=>'<tr><td>'+x.t+' · '+TESTS[x.t].areas[x.a][0]+'</td><td style="text-align:right;color:'+(x.r/x.n>=.7?'var(--green)':'var(--red)')+'">'+x.r+'/'+x.n+'</td></tr>').join('')+'</table></div>'+
   (missed.length?'<h2 style="margin-top:12px">What you missed</h2>'+missed.map(id=>{const q=Q[id];return '<div class="card"><div style="font-size:15px;line-height:1.4">'+q.q+'</div><div class="why"><b class="ok">'+q.o[q.c]+'</b><br>'+q.w+'</div></div>';}).join('')+
   '<button class="big" onclick="startQuiz(['+missed+'],\'Retry missed\',false)">Retry the ones I missed</button>':'')+
   '<button class="ghost" onclick="home()">Back to tests</button>';
  window.scrollTo(0,0);
}
home();
</script>
</body>
